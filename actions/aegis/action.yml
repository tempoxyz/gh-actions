name: "Aegis"
description: >-
  Install Aegis with a short-lived Socket API token when enforcement is
  available, skipping installation with a warning when any setup stage fails

inputs:
  socket-sts-host:
    description: "Socket STS hostname used for the Aegis credential"
    required: false
    default: "socket-sts.tempoxyz.net"

outputs:
  firewall-path-binary:
    description: "Path to the installed Aegis binary"
    value: ${{ steps.install-linux.outputs.path || steps.install-macos.outputs.path || steps.install-windows.outputs.path }}
  firewall-path-report:
    description: "Path to the Aegis audit log"
    value: ${{ steps.install-linux.outputs.report || steps.install-macos.outputs.report || steps.install-windows.outputs.report }}

runs:
  using: "composite"
  steps:
    # GitHub never issues an OIDC token to pull_request runs from forks, whatever
    # permissions the workflow declares. Those runs explicitly disable enforcement
    # without downloading or installing anything. Any other event without OIDC is
    # a workflow configuration error.
    - name: Detect fork and GitHub OIDC availability
      id: oidc
      shell: bash
      env:
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        CURRENT_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        elif [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ -n "$HEAD_REPOSITORY" ] && [ "$HEAD_REPOSITORY" != "$CURRENT_REPOSITORY" ]; then
          echo "available=false" >> "$GITHUB_OUTPUT"
          message="This job is running for a fork pull request, which receives no GitHub OIDC token. No package firewall will be installed; downloads will not be inspected or blocked."
          echo "::warning title=Package-policy enforcement disabled::$message"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '> ⚠️ **Package-policy enforcement disabled:** %s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          fi
        else
          echo "::error::ACTIONS_ID_TOKEN_REQUEST_TOKEN is missing: the job must grant id-token: write (event: ${GITHUB_EVENT_NAME:-unknown})"
          exit 1
        fi

    # Every stage from here on degrades instead of failing the job. Each stage
    # runs only if the previous one succeeded, so nothing is downloaded or
    # installed once a token exchange fails, and the final step reports the
    # first failure as a warning annotation. A Socket STS, GitHub STS, GitHub
    # release, or Aegis installation outage therefore leaves the job running
    # without a package firewall rather than halting it.
    - name: Exchange GitHub OIDC token for a Socket token
      if: steps.oidc.outputs.available == 'true'
      id: socket-token
      continue-on-error: true
      uses: tempoxyz/gh-actions/actions/socket-sts@ee2960a6cc25d99bda45614135bfe1197d879bac # 2026-09-26T06-46-03Z-ee2960a6
      with:
        host: ${{ inputs.socket-sts-host }}
        upload-aegis-report: "false"

    - name: Exchange GitHub OIDC token for Aegis release access
      if: steps.socket-token.outcome == 'success'
      id: release-token
      continue-on-error: true
      uses: tempoxyz/gh-actions/actions/github-sts@ee2960a6cc25d99bda45614135bfe1197d879bac # 2026-09-26T06-46-03Z-ee2960a6
      with:
        scope: tempoxyz/aegis
        policy: download-releases
        ttl: 15m

    - name: Ensure GitHub CLI supports attestation verification
      if: steps.release-token.outcome == 'success'
      id: gh-cli
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ steps.release-token.outputs.token }}
      run: |
        set -euo pipefail
        retry() {
          local attempt=1
          until "$@"; do
            if [ "$attempt" -ge 3 ]; then return 1; fi
            local delay=$((2 ** (attempt - 1)))
            echo "$1 failed (attempt $attempt/3); retrying in ${delay}s."
            sleep "$delay"
            attempt=$((attempt + 1))
          done
        }
        retry bash "$GITHUB_ACTION_PATH/../setup-foundry/ensure-gh.sh"

    # Socket STS runs on the runner's bundled Node, even when PATH has no node.
    # Reuse that exact executable without installing a runtime or changing PATH.
    - name: Download and verify Aegis
      if: steps.gh-cli.outcome == 'success'
      id: download
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ steps.release-token.outputs.token }}
        RUNNER_ARCHITECTURE: ${{ runner.arch }}
        RUNNER_OPERATING_SYSTEM: ${{ runner.os }}
        RUNNER_NODE: ${{ steps.socket-token.outputs.node-path }}
      run: '"$RUNNER_NODE" "$GITHUB_ACTION_PATH/download.cjs"'

    # Aegis deliberately rejects credentials in its JSON configuration. This
    # provider keeps the token in memory and exposes it only at an unguessable
    # loopback URL, which is the release's supported installed-CI token source.
    - name: Prepare Aegis configuration
      if: steps.download.outcome == 'success'
      id: config
      continue-on-error: true
      shell: bash
      env:
        INPUT_SOCKET_TOKEN: ${{ steps.socket-token.outputs.token }}
        RUNNER_NODE: ${{ steps.socket-token.outputs.node-path }}
      run: '"$RUNNER_NODE" "$GITHUB_ACTION_PATH/token-provider.cjs"'

    # Register after STS (so post runs before credential revocation), but before
    # installation (so failures still upload logs and clean up owned state).
    - name: Prepare Aegis lifecycle and register cleanup
      if: steps.config.outcome == 'success'
      id: lifecycle
      continue-on-error: true
      # Linux lifecycle
      uses: tempoxyz/gh-actions/actions/aegis-report@ee2960a6cc25d99bda45614135bfe1197d879bac # 2026-09-26T06-46-03Z-ee2960a6
      with:
        linux-installation-config: ${{ runner.os == 'Linux' && steps.config.outputs.path || '' }}

    - name: Install Aegis package on Linux
      if: steps.lifecycle.outcome == 'success' && runner.os == 'Linux'
      id: install-linux
      continue-on-error: true
      shell: bash
      env:
        AEGIS_PACKAGE: ${{ steps.download.outputs.package }}
        AEGIS_CONFIG: ${{ steps.config.outputs.path }}
      run: |
        set -euo pipefail
        retry() {
          local attempt=1
          until "$@"; do
            if [ "$attempt" -ge 3 ]; then return 1; fi
            local delay=$((2 ** (attempt - 1)))
            echo "$1 failed (attempt $attempt/3); retrying in ${delay}s."
            sleep "$delay"
            attempt=$((attempt + 1))
          done
        }
        retry sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 install -y "$AEGIS_PACKAGE"
        retry /usr/bin/aegis install --config "$AEGIS_CONFIG"
        echo "path=/usr/bin/aegis" >> "$GITHUB_OUTPUT"
        echo "report=/var/log/aegis/service.jsonl" >> "$GITHUB_OUTPUT"

    - name: Install Aegis package on macOS
      if: steps.lifecycle.outcome == 'success' && runner.os == 'macOS'
      id: install-macos
      continue-on-error: true
      shell: bash
      env:
        AEGIS_PACKAGE: ${{ steps.download.outputs.package }}
        AEGIS_CONFIG: ${{ steps.config.outputs.path }}
      run: |
        set -euo pipefail
        retry() {
          local attempt=1
          until "$@"; do
            if [ "$attempt" -ge 3 ]; then return 1; fi
            local delay=$((2 ** (attempt - 1)))
            echo "$1 failed (attempt $attempt/3); retrying in ${delay}s."
            sleep "$delay"
            attempt=$((attempt + 1))
          done
        }
        extract="$RUNNER_TEMP/aegis-extracted"
        mkdir -p "$extract"
        tar -xzf "$AEGIS_PACKAGE" -C "$extract"
        sudo install -m 0755 "$extract/aegis" /usr/local/bin/aegis
        retry /usr/local/bin/aegis install --config "$AEGIS_CONFIG"
        echo "path=/usr/local/bin/aegis" >> "$GITHUB_OUTPUT"
        echo "report=/Library/Application Support/Aegis/service.jsonl" >> "$GITHUB_OUTPUT"

    - name: Install Aegis package on Windows
      if: steps.lifecycle.outcome == 'success' && runner.os == 'Windows'
      id: install-windows
      continue-on-error: true
      shell: pwsh
      env:
        AEGIS_PACKAGE: ${{ steps.download.outputs.package }}
        AEGIS_CONFIG: ${{ steps.config.outputs.path }}
      run: |
        $ErrorActionPreference = 'Stop'
        function Invoke-WithRetry([scriptblock] $Operation, [string] $Description) {
          for ($attempt = 1; $attempt -le 3; $attempt += 1) {
            try {
              & $Operation
              if ($LASTEXITCODE -eq 0) { return }
            } catch {}
            if ($attempt -eq 3) { throw "$Description failed after $attempt attempts" }
            $delay = [math]::Pow(2, $attempt - 1)
            Write-Host "$Description failed (attempt $attempt/3); retrying in ${delay}s."
            Start-Sleep -Seconds $delay
          }
        }
        $directory = Join-Path $env:ProgramFiles 'Aegis'
        New-Item -ItemType Directory -Force $directory | Out-Null
        Expand-Archive -LiteralPath $env:AEGIS_PACKAGE -DestinationPath $directory -Force
        $binary = Join-Path $directory 'aegis.exe'
        Invoke-WithRetry { & $binary install --config $env:AEGIS_CONFIG } 'aegis install'
        "path=$binary" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "report=$(Join-Path $env:ProgramData 'Aegis\service.jsonl')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    # Runs whenever OIDC was available, after every stage above has either
    # succeeded, failed without stopping the job, or been skipped because an
    # earlier stage failed. Reports the first failure so the job's annotations
    # and step summary say exactly why no package firewall is running.
    - name: Report package firewall status
      if: steps.oidc.outputs.available == 'true'
      shell: bash
      env:
        SOCKET_TOKEN_OUTCOME: ${{ steps.socket-token.outcome }}
        RELEASE_TOKEN_OUTCOME: ${{ steps.release-token.outcome }}
        GH_CLI_OUTCOME: ${{ steps.gh-cli.outcome }}
        DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        CONFIG_OUTCOME: ${{ steps.config.outcome }}
        LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
        INSTALL_LINUX_OUTCOME: ${{ steps.install-linux.outcome }}
        INSTALL_MACOS_OUTCOME: ${{ steps.install-macos.outcome }}
        INSTALL_WINDOWS_OUTCOME: ${{ steps.install-windows.outcome }}
        AEGIS_BINARY: ${{ steps.install-linux.outputs.path || steps.install-macos.outputs.path || steps.install-windows.outputs.path }}
      run: |
        set -euo pipefail
        install=skipped
        for outcome in "$INSTALL_LINUX_OUTCOME" "$INSTALL_MACOS_OUTCOME" "$INSTALL_WINDOWS_OUTCOME"; do
          if [ "$outcome" != skipped ]; then install=$outcome; fi
        done
        if [ "$install" = success ]; then
          echo "Aegis installed at $AEGIS_BINARY; package downloads are inspected and enforced."
          exit 0
        fi
        reason="Aegis setup did not complete"
        for stage in \
          "$SOCKET_TOKEN_OUTCOME|the Socket STS did not issue a Socket API token" \
          "$RELEASE_TOKEN_OUTCOME|the GitHub STS did not issue an Aegis release download token" \
          "$GH_CLI_OUTCOME|a GitHub CLI with attestation support could not be bootstrapped" \
          "$DOWNLOAD_OUTCOME|the Aegis release could not be downloaded and verified" \
          "$CONFIG_OUTCOME|the Aegis token provider could not be started" \
          "$LIFECYCLE_OUTCOME|the Aegis lifecycle handler could not be prepared" \
          "$install|the Aegis package could not be installed"; do
          if [ "${stage%%|*}" = failure ]; then
            reason="${stage#*|}"
            break
          fi
        done
        message="Aegis was not installed: ${reason}. See the failed step's log for details. No package firewall is running for this job, so package downloads are not inspected or blocked."
        echo "::warning title=Package-policy enforcement disabled::$message"
        # Mirror the annotation into the step summary so the degraded state is
        # visible on the job's summary page too.
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          printf '> ⚠️ **Package-policy enforcement disabled:** %s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
        fi
