name: "Setup Rust Build"
description: "Install Rust toolchain, mold linker, and sccache"

inputs:
  toolchain:
    description: "Rust toolchain (stable, nightly, or specific version)"
    required: false
    default: "stable"
  components:
    description: "Comma-separated Rust components (e.g., clippy,rustfmt)"
    required: false
    default: ""
  targets:
    description: "Comma-separated Rust targets"
    required: false
    default: ""
  mold:
    description: "Install mold linker"
    required: false
    default: "true"
  sccache:
    description: "Enable sccache"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Install mold linker
      if: inputs.mold == 'true'
      uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

    - name: Enable sccache
      if: inputs.sccache == 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
