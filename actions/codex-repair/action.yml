name: Codex Repair
description: Validate and repair Rust dependency migrations in runner processes.

inputs:
  source:
    description: Absolute path to the prepared source export, without .git or runner files.
    required: true
  baseline:
    description: Absolute path to the original trusted source export.
    required: true
  pins:
    description: JSON object mapping selected GitHub HTTPS sources to full commit SHAs.
    required: true
  local-checks:
    description: Newline-separated commands; parsed as argument lists, not shell scripts.
    required: true
  allowed-paths:
    description: Newline-separated path globs; only Rust, Cargo.toml and Cargo.lock may change.
    required: true
  repair-instructions:
    description: Repository-specific migration instructions; not a substitute for validation.
    default: Fix API compatibility without weakening invariants or tests.
  max-repairs:
    description: Maximum Codex invocations after failed local checks.
    default: "3"
  budget-minutes:
    description: Total repair budget, including verification commands.
    default: "60"
  codex-api-key:
    description: Codex credential; included only in agent process environments.
    required: true
  codex-model:
    description: Codex model override; empty uses the installed CLI default.
    default: ""
  codex-effort:
    description: Codex reasoning effort override; empty uses the model default.
    default: ""

outputs:
  status:
    description: passed or failed; exhausted repairs fail the action.
    value: ${{ steps.repair.outputs.status }}
  repair-attempts:
    description: Number of Codex repair invocations.
    value: ${{ steps.repair.outputs.repair-attempts }}

runs:
  using: composite
  steps:
    - name: Repair and independently verify candidate
      id: repair
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
        SOURCE: ${{ inputs.source }}
        BASELINE: ${{ inputs.baseline }}
        PINS: ${{ inputs.pins }}
        LOCAL_CHECKS: ${{ inputs.local-checks }}
        ALLOWED_PATHS: ${{ inputs.allowed-paths }}
        INSTRUCTIONS: ${{ inputs.repair-instructions }}
        MAX_REPAIRS: ${{ inputs.max-repairs }}
        BUDGET_MINUTES: ${{ inputs.budget-minutes }}
        CODEX_API_KEY: ${{ inputs.codex-api-key }}
        CODEX_MODEL: ${{ inputs.codex-model }}
        CODEX_EFFORT: ${{ inputs.codex-effort }}
      run: |
        set -euo pipefail
        python3 -I "$ACTION_DIR/repair.py" \
          --source "$SOURCE" --baseline "$BASELINE" --pins "$PINS" \
          --checks "$LOCAL_CHECKS" \
          --allowed-paths "$ALLOWED_PATHS" --instructions "$INSTRUCTIONS" \
          --max-repairs "$MAX_REPAIRS" --budget-minutes "$BUDGET_MINUTES"
