name: "Scan GitHub Actions"
description: "Security scan for GitHub Actions workflows"

inputs:
  paths:
    description: "Whitespace-separated paths for zizmor to scan. Defaults to `.` (the whole repo), so first-party workflows and actions anywhere (e.g. across a monorepo) are covered. Narrow it (e.g. to `.github/`) to exclude vendored or third-party trees."
    required: false
    default: "."
  config:
    description: "Path to a zizmor configuration file for overrides. When empty and the repository has no zizmor config of its own, a default that disables the ref-version-mismatch audit is used (pins to tempoxyz/gh-actions cannot carry a matching version comment)."
    required: false
    default: ""
  advanced-security:
    description: "Upload SARIF to GitHub code scanning. Requires code scanning to be enabled for the repository."
    required: false
    default: "false"
  actionlint:
    description: "Run actionlint (workflow syntax, expression, and shellcheck/pyflakes checks) in addition to the zizmor security scan."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    # Default zizmor policy when the caller ships no zizmor config. Pins to this repository
    # can never carry a version comment that matches a tag (gh-actions publishes none), so
    # zizmor's ref-version-mismatch audit reports every commented pin as mismatched, a
    # medium-severity finding that fails the scan. Comment correctness for third-party pins is
    # pinact's job (`verify-pin-comments`). A repo that wants the audit back adds its own
    # .github/zizmor.yml or passes `config`.
    - name: Resolve zizmor config
      id: zizmor-config
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        if [[ -n "$CONFIG" ]]; then
          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        for f in .github/zizmor.yml .github/zizmor.yaml zizmor.yml zizmor.yaml; do
          if [[ -f "$f" ]]; then
            echo "using the repository's own $f"
            echo "config=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        # zizmor-action runs zizmor in a container that mounts only the workspace (read-only,
        # at /workspace), so the file has to live inside the checkout and be passed relatively.
        cfg=".zizmor-default.yml"
        printf 'rules:\n  ref-version-mismatch:\n    disable: true\n' > "$GITHUB_WORKSPACE/$cfg"
        echo "config=$cfg" >> "$GITHUB_OUTPUT"

    - name: Scan GitHub Actions
      uses: tempoxyz/gh-actions/vendor/zizmorcore/zizmor-action@6f436eb3a168279692739e8c0c9fdb52b94bfae7
      with:
        inputs: ${{ inputs.paths }}
        persona: regular
        online-audits: true
        advanced-security: ${{ inputs.advanced-security }}
        annotations: ${{ inputs.advanced-security != 'true' }}
        config: ${{ steps.zizmor-config.outputs.config }}
        token: ${{ github.token }}

    - name: Install actionlint
      if: ${{ !cancelled() && inputs.actionlint == 'true' }}
      shell: bash
      # This unreleased commit supports service command/entrypoint. Build outside the
      # caller's checkout and verify module downloads through Go's checksum database.
      run: | # zizmor: ignore[github-env] INSTALL_DIR is created under RUNNER_TEMP, not derived from user input.
        set -euo pipefail
        ACTIONLINT_VERSION="011a6d15e749bb3f2d771eed9c7aa0e7e3e10ee7"
        INSTALL_DIR="${RUNNER_TEMP:?}/actionlint-bin"
        mkdir -p "$INSTALL_DIR"
        (
          cd "$INSTALL_DIR"
          GOENV=off GOWORK=off GOFLAGS='' GOTOOLCHAIN=auto CGO_ENABLED=0 \
            GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org \
            GOPRIVATE='' GONOPROXY='' GONOSUMDB='' GOBIN="$INSTALL_DIR" \
            go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
        )
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Lint GitHub Actions
      if: ${{ !cancelled() && inputs.actionlint == 'true' }}
      shell: bash
      run: actionlint -color
