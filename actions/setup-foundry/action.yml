name: "Setup Foundry"
description: "Install Foundry toolchain (forge, cast, anvil, chisel)"

inputs:
  version:
    description: "Foundry toolchain version"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      with:
        version: ${{ inputs.version }}

    - name: Show Forge version
      shell: bash
      run: forge --version
