name: "Secure Runner"
description: >-
  Start Harden Runner with StepSecurity policy-store access, then install Socket Firewall

inputs:
  step-security-sts-host:
    description: "Step Security STS hostname used for policy-store credentials"
    required: false
    default: "ss-sts.tempoxyz.net"
  socket-sts-host:
    description: "Socket STS hostname used for the Aegis credential"
    required: false
    default: "socket-sts.tempoxyz.net"
  egress-policy:
    description: "Fallback outbound policy when no stored policy applies (audit or block)"
    required: false
    default: "audit"
  allowed-endpoints:
    description: "Endpoints allowed when the fallback egress policy is block"
    required: false
    default: ""
  denied-endpoints:
    description: "Endpoints denied when endpoint blocking is enabled"
    required: false
    default: ""
  disable-telemetry:
    description: "Disable StepSecurity telemetry; valid only with a block egress policy"
    required: false
    default: "false"
  disable-sudo-and-containers:
    description: "Disable sudo and container access for the runner account"
    required: false
    default: "false"
  disable-file-monitoring:
    description: "Disable file monitoring"
    required: false
    default: "false"
  deploy-on-self-hosted-vm:
    description: "Deploy Harden Runner directly on an ephemeral self-hosted Linux VM"
    required: false
    default: "false"
  disable-enforcement:
    description: "Skip Harden Runner and Socket Firewall with a warning annotation"
    required: false
    default: "false"
  token:
    description: "GitHub token used by Harden Runner to avoid API rate limiting"
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Harden the runner with the StepSecurity policy store
      uses: tempoxyz/gh-actions/actions/harden-runner@ddde9bacfffed2574debefdeee00747b3d2c6087 # 2026-09-24T20-02-12Z-ddde9bac
      with:
        step-security-sts-host: ${{ inputs.step-security-sts-host }}
        egress-policy: ${{ inputs.egress-policy }}
        allowed-endpoints: ${{ inputs.allowed-endpoints }}
        denied-endpoints: ${{ inputs.denied-endpoints }}
        disable-telemetry: ${{ inputs.disable-telemetry }}
        disable-sudo-and-containers: ${{ inputs.disable-sudo-and-containers }}
        disable-file-monitoring: ${{ inputs.disable-file-monitoring }}
        deploy-on-self-hosted-vm: ${{ inputs.deploy-on-self-hosted-vm }}
        disable-enforcement: ${{ inputs.disable-enforcement }}
        token: ${{ inputs.token }}

    - name: Install Socket Firewall
      if: inputs.disable-enforcement != 'true'
      uses: tempoxyz/gh-actions/actions/socket-firewall@ddde9bacfffed2574debefdeee00747b3d2c6087 # 2026-09-24T20-02-12Z-ddde9bac
      with:
        socket-sts-host: ${{ inputs.socket-sts-host }}
