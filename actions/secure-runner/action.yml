name: "Secure Runner"
description: >-
  Start Harden Runner with StepSecurity policy-store access and install Aegis concurrently,
  running without either when its service cannot be reached

inputs:
  benchmark-variant:
    description: Benchmark variant
    default: baseline
  benchmark-self-hosted:
    description: Exercise persistent-runner cleanup on an ephemeral test VM
    default: "false"
  step-security-sts-host:
    description: "Step Security STS hostname used for policy-store credentials"
    required: false
    default: "ss-sts.tempoxyz.net"
  socket-sts-host:
    description: "Socket STS hostname used for the Aegis credential"
    required: false
    default: "socket-sts.tempoxyz.net"
  aegis-version:
    description: "Exact published Aegis release tag (for example v0.15.0 or 20260927T194115Z-5e7bd8b807b2); empty selects the latest stable release"
    required: false
    default: ""
  egress-policy:
    description: "Fallback outbound policy when no stored policy applies (audit or block)"
    required: false
    default: "audit"
  allowed-endpoints:
    description: "Endpoints allowed when the fallback egress policy is block"
    required: false
    default: ""
  denied-endpoints:
    description: "Endpoints denied when endpoint blocking is enabled"
    required: false
    default: ""
  disable-telemetry:
    description: "Disable StepSecurity telemetry; valid only with a block egress policy"
    required: false
    default: "false"
  disable-sudo-and-containers:
    description: "Disable sudo and container access for the runner account"
    required: false
    default: "false"
  disable-file-monitoring:
    description: "Disable file monitoring"
    required: false
    default: "false"
  deploy-on-self-hosted-vm:
    description: "Deploy Harden Runner directly on an ephemeral self-hosted Linux VM"
    required: false
    default: "false"
  disable-enforcement:
    description: "Skip Harden Runner and Aegis with a warning annotation"
    required: false
    default: "false"
  token:
    description: "GitHub token used by Harden Runner to avoid API rate limiting"
    required: false
    default: ${{ github.token }}

runs:
  using: "node24"
  main: "main.cjs"
  post: "benchmark-post.cjs"
