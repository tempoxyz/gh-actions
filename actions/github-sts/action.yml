---
name: "GitHub STS"
description: >-
  Exchange the workflow OIDC token for a short-lived GitHub App token

inputs:
  scope:
    description: >-
      Repository (org/repo) or organization whose trust policy to use
    required: false
    default: ""
  policy:
    description: "Trust policy name"
    required: true
  ttl:
    description: >-
      Requested maximum token lifetime (for example 30s, 5m, or 1h)
    required: false
    default: ""
  host:
    description: "GitHub STS hostname used for HTTPS requests and the GitHub OIDC audience"
    required: false
    default: "gh-sts.tempoxyz.net"
  retry-timeout:
    description: "Total OIDC/exchange retry budget in seconds (1–3600); report the retry deadline if it exceeds this budget"
    required: false
    default: "90"

outputs:
  token:
    description: "Short-lived GitHub App installation token"
  expires-at:
    description: "Token expiration timestamp"

runs:
  using: "node24"
  main: "main.js"
  post: "post.js"
