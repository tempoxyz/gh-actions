---
name: "GitHub STS"
description: >-
  Exchange the workflow OIDC token for a short-lived GitHub App token

inputs:
  scope:
    description: >-
      Repository (org/repo) or organization whose trust policy to use
    required: false
    default: ""
  policy:
    description: "Trust policy name"
    required: true
  client-cert:
    description: "PEM-encoded client certificate"
    required: true
  client-key:
    description: "PEM-encoded client private key"
    required: true
  dev:
    description: "(Dev testing only) Use the development STS endpoint and client certificate"
    required: false
    default: "false"

outputs:
  token:
    description: "Short-lived GitHub App installation token"
    value: ${{ steps.exchange.outputs.token }}
  expires-at:
    description: "Token expiration timestamp"
    value: ${{ steps.exchange.outputs.expires-at }}

runs:
  using: "composite"
  steps:
    - name: Exchange OIDC token
      id: exchange
      shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
        POLICY: ${{ inputs.policy }}
        CLIENT_CERT: ${{ inputs.client-cert }}
        CLIENT_KEY: ${{ inputs.client-key }}
        DEV: ${{ inputs.dev }}
      run: |
        set -euo pipefail

        if [[ "$DEV" == "true" ]]; then
          host='gh-sts.tehq.dev'
        elif [[ "$DEV" == "false" ]]; then
          host='gh-sts.tehq.net'
        else
          echo 'dev must be either true or false' >&2
          exit 1
        fi

        cert_value="$CLIENT_CERT"
        key_value="$CLIENT_KEY"
        if [[ -z "$cert_value" || -z "$key_value" ]]; then
          echo 'client-cert and client-key must be provided' >&2
          exit 1
        fi

        scope="$SCOPE"
        if [[ -z "$scope" ]]; then
          scope="$GITHUB_REPOSITORY"
        fi

        if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
          echo 'id-token: write permission is required' >&2
          exit 1
        fi
        if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
          echo 'GitHub OIDC request URL is unavailable' >&2
          exit 1
        fi

        cert_file="$RUNNER_TEMP/github-sts-client.pem"
        key_file="$RUNNER_TEMP/github-sts-client.key"
        exchange_response_file="$RUNNER_TEMP/github-sts-exchange-response.json"
        trap 'rm -f "$cert_file" "$key_file" "$exchange_response_file"' EXIT

        umask 077
        printf '%s\n' "$cert_value" > "$cert_file"
        printf '%s\n' "$key_value" > "$key_file"

        oidc_response="$(curl --fail-with-body --silent --show-error \
          --get \
          --data-urlencode "audience=${host}" \
          -H \
            "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL")"
        oidc="$(jq --exit-status --raw-output '.value' <<< "$oidc_response")"

        exchange_status="$(curl --silent --show-error \
          --cert "$cert_file" \
          --key "$key_file" \
          --output "$exchange_response_file" \
          --write-out '%{http_code}' \
          --get \
          --data-urlencode "scope=${scope}" \
          --data-urlencode "identity=${POLICY}" \
          -H "Authorization: Bearer ${oidc}" \
          "https://${host}/sts/exchange")"

        if [[ ! "$exchange_status" =~ ^2[0-9]{2}$ ]]; then
          message="$(jq -r 'select(.message | type == "string") | .message' \
            "$exchange_response_file" 2>/dev/null || true)"
          message="$(tr '\r\n' '  ' <<< "$message" | cut -c1-500)"
          if [[ -n "$message" ]]; then
            echo "GitHub STS exchange failed (HTTP ${exchange_status}): ${message}" >&2
          else
            echo "GitHub STS exchange failed (HTTP ${exchange_status})" >&2
          fi
          exit 1
        fi

        exchange_response="$(<"$exchange_response_file")"

        token="$(jq --exit-status --raw-output '.token' \
          <<< "$exchange_response")"
        expires_at="$(jq --exit-status --raw-output '.expires_at' \
          <<< "$exchange_response")"
        echo "::add-mask::${token}"
        echo "token=${token}" >> "$GITHUB_OUTPUT"
        echo "expires-at=${expires_at}" >> "$GITHUB_OUTPUT"
