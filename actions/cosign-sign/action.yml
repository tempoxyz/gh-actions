name: "Cosign Sign"
description: "Install cosign and sign container images"

inputs:
  images:
    description: "Newline-separated list of image references to sign"
    required: true
  cosign-version:
    description: "Cosign version to install (e.g., v3.1.4)"
    required: false
    default: "v3.1.4"

runs:
  using: "composite"
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      with:
        cosign-release: ${{ inputs.cosign-version }}

    - name: Sign images
      shell: bash
      env:
        IMAGES: ${{ inputs.images }}
      run: |
        set -euo pipefail
        echo "$IMAGES" | while IFS= read -r image; do
          [ -z "$image" ] && continue
          echo "Signing: $image"
          cosign sign --yes --recursive "$image"
        done
