name: "Cosign Sign"
description: "Install cosign and sign container images"

inputs:
  images:
    description: "Newline-separated list of image references to sign"
    required: true
  cosign-version:
    description: "Cosign version to install (leave empty for default)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install cosign
      uses: tempoxyz/gh-actions/vendor/sigstore/cosign-installer@62de042f2251366d3fedbba7b7920b4f90fab588 # 2026-10-01T19-42-00Z-62de042f
      with:
        cosign-release: ${{ inputs.cosign-version }}

    - name: Sign images
      shell: bash
      env:
        IMAGES: ${{ inputs.images }}
      run: |
        set -euo pipefail
        echo "$IMAGES" | while IFS= read -r image; do
          [ -z "$image" ] && continue
          echo "Signing: $image"
          cosign sign --yes --recursive "$image"
        done
