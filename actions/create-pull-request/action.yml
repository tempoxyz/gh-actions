name: "Create Pull Request"
description: >-
  Commit working-tree changes to a branch and open a pull request using
  only git and gh — a bare-minimum replacement for
  peter-evans/create-pull-request

# Expects the caller to have checked out the repository at the commit the
# branch should start from (normally the tip of `base`) and to have edited
# the working tree in place. The action then:
#
#   1. Creates the head branch at HEAD — or force-resets it if a stale
#      branch survived an earlier failed run (callers are expected to
#      delete the branch on merge). When the branch has an open PR, the
#      commit is built on a scratch branch and the head branch is moved
#      to it in one update, so the PR is never left without changes
#      (which would close it). If the open PR already has exactly these
#      changes, nothing is committed.
#   2. Stages `add-paths` and commits the staged changes via the GraphQL
#      createCommitOnBranch mutation. Nothing is pushed from the runner:
#      the commit is created server-side, so it is authored by the
#      token's actor (e.g. a GitHub App bot) and signed by GitHub —
#      commits never show as "Unverified", without any signing key
#      handling. Additions, modifications, and deletions are supported;
#      renames become delete + add; anything else (e.g. type changes)
#      fails the action. File modes are not preserved — created files
#      are regular (non-executable) files.
#   3. Opens a pull request for the branch, or reuses the branch's
#      existing open PR (refreshing its title and body), and optionally
#      enables auto-merge.
#
# The token must have contents: write (branch + commit) and
# pull-requests: write (PR create/edit, labels). Any `labels` must
# already exist in the repository.
#
# The action fails if there are no changes to commit: it is built for
# callers that just generated changes and expect them to exist, so an
# empty diff means something upstream went wrong.

inputs:
  token:
    description: >-
      Token used for all API calls (branch, commit, PR). Needs
      contents: write and pull-requests: write. The commit is authored
      by this token's actor, so pass a GitHub App installation token
      (e.g. from the github-sts action) to avoid github-actions[bot].
    required: true
  branch:
    description: "Head branch to create (force-reset if it exists)"
    required: true
  base:
    description: "Base branch the pull request targets"
    required: false
    default: "main"
  commit-message:
    description: "Commit message headline"
    required: true
  title:
    description: "Pull request title"
    required: true
  body:
    description: "Pull request body (Markdown)"
    required: false
    default: ""
  add-paths:
    description: >-
      Newline-separated git pathspecs to stage (as `git add -A --
      <pathspec>...`). Defaults to all changes in the working tree.
    required: false
    default: "."
  labels:
    description: >-
      Newline- or comma-separated labels to add to the pull request.
      Labels must already exist in the repository.
    required: false
    default: ""
  auto-merge:
    description: >-
      Enable auto-merge with this method (`merge`, `squash`, or
      `rebase`) so the PR merges once required checks pass. Empty
      leaves the PR for manual merge.
    required: false
    default: ""

outputs:
  pull-request-number:
    description: "Number of the created (or reused) pull request"
    value: ${{ steps.create.outputs.pull-request-number }}
  head-sha:
    description: "OID of the commit created on the head branch"
    value: ${{ steps.create.outputs.head-sha }}

runs:
  using: "composite"
  steps:
    - name: Commit changes and open pull request
      id: create
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        BRANCH: ${{ inputs.branch }}
        BASE: ${{ inputs.base }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
        ADD_PATHS: ${{ inputs.add-paths }}
        LABELS: ${{ inputs.labels }}
        AUTO_MERGE: ${{ inputs.auto-merge }}
      run: |
        set -euo pipefail

        case "$AUTO_MERGE" in
          ""|merge|squash|rebase) ;;
          *)
            echo "::error::auto-merge must be merge, squash, rebase, or empty" >&2
            exit 1
            ;;
        esac

        BASE_SHA="$(git rev-parse HEAD)"

        mapfile -t PATHSPECS < <(printf '%s\n' "$ADD_PATHS" | sed '/^[[:space:]]*$/d')
        git add -A -- "${PATHSPECS[@]}"

        # Classify the staged changes into the GraphQL fileChanges shape.
        # --no-renames so a rename surfaces as D + A; any status other
        # than A/M/D (e.g. T for a type change) is unsupported and fails.
        ADDITIONS='[]'
        DELETIONS='[]'
        CHANGE_COUNT=0
        while IFS= read -r -d '' status && IFS= read -r -d '' path; do
          case "$status" in
            A|M)
              ADDITIONS="$(
                jq --arg path "$path" --arg contents "$(base64 -w0 < "$path")" \
                  '. + [{path: $path, contents: $contents}]' <<<"$ADDITIONS"
              )"
              ;;
            D)
              DELETIONS="$(
                jq --arg path "$path" '. + [{path: $path}]' <<<"$DELETIONS"
              )"
              ;;
            *)
              echo "::error::unsupported change type '$status' for '$path'" >&2
              exit 1
              ;;
          esac
          CHANGE_COUNT=$((CHANGE_COUNT + 1))
        done < <(git diff --cached --name-status --no-renames -z)
        if [[ "$CHANGE_COUNT" -eq 0 ]]; then
          echo "::error::nothing to commit: no staged changes under: $ADD_PATHS" >&2
          exit 1
        fi

        BRANCH_SHA="$(
          gh api "repos/$GH_REPO/git/ref/heads/$BRANCH" --jq '.object.sha' 2>/dev/null || true
        )"
        PR_NUMBER="$(
          gh pr list --repo "$GH_REPO" --head "$BRANCH" --base "$BASE" \
            --state open --json number --jq '.[0].number // empty'
        )"

        if [[ -n "$PR_NUMBER" && -n "$BRANCH_SHA" ]] && [[ "$(
          gh api "repos/$GH_REPO/git/commits/$BRANCH_SHA" --jq '.tree.sha'
        )" == "$(git write-tree)" ]]; then
          echo "#$PR_NUMBER already has these changes; leaving $BRANCH at $BRANCH_SHA"
          HEAD_SHA="$BRANCH_SHA"
        else
          # Resetting a branch that has an open PR to the base would leave
          # the PR without changes, and GitHub closes it. Build the commit on
          # a scratch branch instead and move the head branch to it at once.
          COMMIT_BRANCH="$BRANCH"
          if [[ -n "$PR_NUMBER" ]]; then
            COMMIT_BRANCH="$BRANCH-update-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            trap 'gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$COMMIT_BRANCH" >/dev/null 2>&1 || true' EXIT
          fi

          # Point the commit branch at the checked-out commit, force-resetting
          # a leftover branch from an earlier failed run.
          if gh api "repos/$GH_REPO/git/ref/heads/$COMMIT_BRANCH" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/heads/$COMMIT_BRANCH" \
              -f sha="$BASE_SHA" -F force=true
          else
            gh api "repos/$GH_REPO/git/refs" \
              -f ref="refs/heads/$COMMIT_BRANCH" -f sha="$BASE_SHA"
          fi

          # The $input below is a GraphQL variable, not shell.
          # shellcheck disable=SC2016
          QUERY='mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) { commit { oid } }
          }'
          jq -n \
            --arg query "$QUERY" \
            --arg repo "$GH_REPO" \
            --arg branch "$COMMIT_BRANCH" \
            --arg oid "$BASE_SHA" \
            --arg headline "$COMMIT_MESSAGE" \
            --argjson additions "$ADDITIONS" \
            --argjson deletions "$DELETIONS" \
            '{query: $query, variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $oid,
                message: {headline: $headline},
                fileChanges: {additions: $additions, deletions: $deletions}}}}' \
            > "$RUNNER_TEMP/create-commit.json"
          HEAD_SHA="$(
            gh api graphql --input "$RUNNER_TEMP/create-commit.json" \
              --jq '.data.createCommitOnBranch.commit.oid'
          )"
          if [[ "$COMMIT_BRANCH" != "$BRANCH" ]]; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/heads/$BRANCH" \
              -f sha="$HEAD_SHA" -F force=true >/dev/null
          fi
          echo "Committed $HEAD_SHA to $BRANCH"
        fi

        BODY_FILE="$(mktemp "$RUNNER_TEMP/pr-body-XXXXXX")"
        printf '%s\n' "$BODY" > "$BODY_FILE"

        LABEL_ARGS=()
        while IFS= read -r label; do
          [[ -z "$label" ]] && continue
          LABEL_ARGS+=(--label "$label")
        done < <(
          printf '%s\n' "$LABELS" | tr ',' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'
        )

        # Reuse the branch's open PR — the branch now points at the fresh
        # commit, so only the title/body need refreshing.
        if [[ -z "$PR_NUMBER" ]]; then
          PR_URL="$(
            gh pr create --repo "$GH_REPO" --base "$BASE" --head "$BRANCH" \
              --title "$TITLE" --body-file "$BODY_FILE" "${LABEL_ARGS[@]}"
          )"
          PR_NUMBER="${PR_URL##*/}"
        else
          gh pr edit --repo "$GH_REPO" "$PR_NUMBER" \
            --title "$TITLE" --body-file "$BODY_FILE"
        fi

        if [[ -n "$AUTO_MERGE" ]]; then
          gh pr merge --repo "$GH_REPO" "$PR_NUMBER" --auto "--$AUTO_MERGE"
        fi

        echo "pull-request-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
        echo "head-sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
        echo "Pull request #$PR_NUMBER"
