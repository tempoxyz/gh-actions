name: "cargo install (cached)"
description: "Install a Rust tool with cargo install, caching the built binary between runs"

inputs:
  tool:
    description: "Crate to install (e.g., zepter or cargo-hack)"
    required: true
  version:
    description: "Exact crate version; omit for the newest on crates.io"
    required: false
    default: ""
  locked:
    description: "Pass --locked"
    required: false
    default: "true"
  features:
    description: "Comma-separated features"
    required: false
    default: ""

outputs:
  cache-hit:
    description: "Whether the binary came from the cache"
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Resolve cache key
      id: key
      shell: bash
      env:
        TOOL: ${{ inputs.tool }}
        VERSION: ${{ inputs.version }}
        FEATURES: ${{ inputs.features }}
      run: |
        set -euo pipefail
        rustc_v="$(rustc --version | awk '{print $2}')"
        echo "key=cargo-install-${TOOL}-${VERSION:-latest}-${FEATURES:-nofeatures}-rustc-${rustc_v}-${RUNNER_OS}-$(uname -m)" >> "$GITHUB_OUTPUT"
        echo "bin=$HOME/.cargo/bin/${TOOL}" >> "$GITHUB_OUTPUT"

    - name: Restore cached binary
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.bin }}
        key: ${{ steps.key.outputs.key }}

    - name: cargo install
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TOOL: ${{ inputs.tool }}
        VERSION: ${{ inputs.version }}
        LOCKED: ${{ inputs.locked }}
        FEATURES: ${{ inputs.features }}
      run: |
        set -euo pipefail
        args=("$TOOL")
        [[ -n "$VERSION" ]] && args+=(--version "$VERSION")
        [[ "$LOCKED" == "true" ]] && args+=(--locked)
        [[ -n "$FEATURES" ]] && args+=(--features "$FEATURES")
        cargo install "${args[@]}"

    - name: Show version
      shell: bash
      env:
        TOOL: ${{ inputs.tool }}
      run: |
        "$TOOL" --version || true
