name: "actionlint"
description: "Lint GitHub Actions workflows with actionlint (syntax, expressions, shellcheck and pyflakes checks), installed from a digest-pinned release"

inputs:
  args:
    description: "Arguments passed to actionlint. The default lints every workflow under .github/workflows."
    required: false
    default: "-color"

runs:
  using: "composite"
  steps:
    - name: Install actionlint
      shell: bash
      # actionlint publishes release checksums but no attestations, so the tarball digests are pinned
      # here (the same approach as mold). Bump ACTIONLINT_VERSION and both digests together.
      run: | # zizmor: ignore[github-env] INSTALL_DIR is created under RUNNER_TEMP, not derived from user input.
        set -euo pipefail
        ACTIONLINT_VERSION="1.7.12"
        case "$(uname -m)" in
          x86_64)        ARCH=amd64; SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8" ;;
          aarch64|arm64) ARCH=arm64; SHA256="325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6" ;;
          *) echo "::error::actionlint: unsupported architecture $(uname -m)"; exit 1 ;;
        esac
        ASSET="actionlint_${ACTIONLINT_VERSION}_linux_${ARCH}.tar.gz"
        INSTALL_DIR="${RUNNER_TEMP:?}/actionlint-bin"
        mkdir -p "$INSTALL_DIR"
        curl -fsSL --retry 3 -o "$INSTALL_DIR/$ASSET" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ASSET}"
        echo "${SHA256}  ${INSTALL_DIR}/${ASSET}" | sha256sum --check --strict
        tar -xzf "$INSTALL_DIR/$ASSET" -C "$INSTALL_DIR" actionlint
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Lint GitHub Actions workflows
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086  # args are intentionally word-split
        actionlint $ARGS
