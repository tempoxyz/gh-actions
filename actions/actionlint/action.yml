name: "actionlint"
description: "Lint GitHub Actions workflows with actionlint (syntax, expressions, shellcheck and pyflakes checks), built from a commit-pinned source"

inputs:
  args:
    description: "Arguments passed to actionlint. The default lints every workflow under .github/workflows."
    required: false
    default: "-color"

runs:
  using: "composite"
  steps:
    - name: Install actionlint
      shell: bash
      # This unreleased commit supports service command/entrypoint. Build outside the
      # caller's checkout and verify module downloads through Go's checksum database.
      run: | # zizmor: ignore[github-env] INSTALL_DIR is created under RUNNER_TEMP, not derived from user input.
        set -euo pipefail
        ACTIONLINT_VERSION="011a6d15e749bb3f2d771eed9c7aa0e7e3e10ee7"
        INSTALL_DIR="${RUNNER_TEMP:?}/actionlint-bin"
        mkdir -p "$INSTALL_DIR"
        (
          cd "$INSTALL_DIR"
          GOENV=off GOWORK=off GOFLAGS='' GOTOOLCHAIN=auto CGO_ENABLED=0 \
            GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org \
            GOPRIVATE='' GONOPROXY='' GONOSUMDB='' GOBIN="$INSTALL_DIR" \
            go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
        )
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Lint GitHub Actions workflows
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086  # args are intentionally word-split
        actionlint $ARGS
