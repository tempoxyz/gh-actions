name: "Socket Firewall"
description: >-
  Install Socket Firewall Enterprise with a short-lived API token

inputs:
  dev:
    description: "Use the development Socket STS endpoint"
    required: false
    default: "false"

outputs:
  firewall-path-binary:
    description: "Path to the installed Socket Firewall binary"
    value: ${{ steps.firewall.outputs.firewall-path-binary }}
  firewall-path-report:
    description: "Path to the Socket Firewall report JSON"
    value: ${{ steps.firewall.outputs.firewall-path-report }}

runs:
  using: "composite"
  steps:
    - name: Exchange GitHub OIDC token for a Socket token
      id: socket-token
      uses: tempoxyz/gh-actions/actions/socket-firewall/sts@17877c44e0a14b6fc634f69fbdee575d940c7386
      with:
        dev: ${{ inputs.dev }}

    - name: Install Socket Firewall Enterprise
      id: firewall
      uses: SocketDev/action@be1f253a41351d59095f8d7f1425985097dd1054 # main
      with:
        mode: firewall-enterprise
        socket-token: ${{ steps.socket-token.outputs.token }}
