name: "Socket Firewall"
description: >-
  Install Socket Firewall Enterprise with a short-lived API token

inputs:
  dev:
    description: "Use the development Socket STS endpoint"
    required: false
    default: "false"

outputs:
  firewall-path-binary:
    description: "Path to the installed Socket Firewall binary"
    value: ${{ steps.windows-binary.outputs.path || steps.firewall.outputs.firewall-path-binary }}
  firewall-path-report:
    description: "Path to the Socket Firewall report JSON"
    value: ${{ steps.firewall.outputs.firewall-path-report }}

runs:
  using: "composite"
  steps:
    # GitHub never issues an OIDC token to pull_request runs from forks, whatever
    # permissions the workflow declares. Such runs skip the Socket STS exchange and
    # install the Free edition below. Any other event without an OIDC token is a
    # workflow missing `id-token: write`, so it fails here.
    - name: Detect GitHub OIDC availability
      id: oidc
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        elif [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning::GitHub issued no OIDC token to this pull_request run (fork pull requests never receive one). Installing Socket Firewall Free instead of Enterprise: known-malware blocking only, without organization policies."
        else
          echo "::error::ACTIONS_ID_TOKEN_REQUEST_TOKEN is missing: the job must grant id-token: write (event: ${GITHUB_EVENT_NAME:-unknown})"
          exit 1
        fi

    - name: Exchange GitHub OIDC token for a Socket token
      if: steps.oidc.outputs.available == 'true'
      id: socket-token
      uses: tempoxyz/gh-actions/actions/socket-firewall/sts@0f195471b66fe3e39f538383f67bfc0676a3aaa5
      with:
        dev: ${{ inputs.dev }}

    # In `firewall` mode the vendored action installs the Enterprise edition when
    # socket-token is set and the Free edition when it is empty, which is the case
    # when the exchange above was skipped.
    - name: Install Socket Firewall
      id: firewall
      uses: tempoxyz/gh-actions/vendor/SocketDev/action@0f195471b66fe3e39f538383f67bfc0676a3aaa5
      with:
        mode: firewall
        socket-token: ${{ steps.socket-token.outputs.token }}

    - name: Make Socket Firewall executable by Windows shims
      if: runner.os == 'Windows'
      id: windows-binary
      shell: pwsh
      env:
        FIREWALL_PATH_BINARY: ${{ steps.firewall.outputs.firewall-path-binary }}
      run: node "$env:GITHUB_ACTION_PATH/windows-binary.cjs"
