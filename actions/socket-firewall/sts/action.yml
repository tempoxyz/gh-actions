name: "Socket STS"
description: "Exchange a GitHub Actions OIDC token for a short-lived Socket API token"

inputs:
  dev:
    description: "Use the development Socket STS endpoint"
    required: false
    default: "false"

outputs:
  token:
    description: "Short-lived Socket API token"
  expires-at:
    description: "Time when Socket STS will revoke the token"

runs:
  using: "node24"
  main: "main.cjs"
  post: "post.cjs"
