name: "Cargo cooldown"
description: "Reject Cargo dependency graphs containing releases newer than the configured cooldown"

inputs:
  cooldown-days:
    description: "Minimum whole days a registry release must have been published"
    required: false
    default: "7"
  working-directory:
    description: "Cargo workspace directory to check"
    required: false
    default: "."
  mode:
    description: "Validation mode: verify checks policy only; check also compiles the workspace"
    required: false
    default: "verify"
  verbose:
    description: "Enable verbose cargo-cooldown output"
    required: false
    default: "false"
  allow-user-policy:
    description: "Allow policy from $CARGO_HOME/cooldown.toml"
    required: false
    default: "false"

outputs:
  verifier-path:
    description: "Absolute path to the checksum-verified cargo-cooldown binary"
    value: ${{ steps.install-unix.outputs.verifier-path || steps.install-windows.outputs.verifier-path }}
  verifier-sha256:
    description: "Pinned SHA-256 digest of the installed cargo-cooldown binary"
    value: ${{ steps.install-unix.outputs.verifier-sha256 || steps.install-windows.outputs.verifier-sha256 }}

runs:
  using: "composite"
  steps:
    - name: Install cargo-cooldown
      id: install-unix
      if: runner.os != 'Windows'
      shell: bash
      env:
        CARGO_COOLDOWN_VERSION: "0.3.4"
        CARGO_COOLDOWN_SHA256_LINUX_X64: 5706c1636415b90ec8244631ff707d1c49d502779d14235d7abb65c080ac8ba6
        CARGO_COOLDOWN_SHA256_LINUX_ARM64: bc5488d892da21575f1834ad31c64077f2a681ea70d22e4409fa3f21857cf63a
        CARGO_COOLDOWN_SHA256_MACOS_X64: fd7e8627a8248f3e803a866a893cd3ec2db29c215dee16357caa4d23a36c86f0
        CARGO_COOLDOWN_SHA256_MACOS_ARM64: 0499a6ff956cd1bfb4b29466cbbf1ceb4571a1d1c0eabfe84bffa487e2b11d4b
        CARGO_COOLDOWN_BINARY_SHA256_LINUX_X64: c9939a37768c7d0e4dbac047ea2d2e41bd1e0276db4da3752e200dd5722d1f6e
        CARGO_COOLDOWN_BINARY_SHA256_LINUX_ARM64: 0e71062f61a6d0bc9345a6c20409e34e7b43bee8d991eeb6f5d933340082c758
        CARGO_COOLDOWN_BINARY_SHA256_MACOS_X64: 374c625a4574752dca107cd843236da9deecea879799a86e64fc5c6cd58022df
        CARGO_COOLDOWN_BINARY_SHA256_MACOS_ARM64: 56b30e9418915503a70391dee75214f30874875d6d567219c6dbe0b05c1ae14c
      run: | # zizmor: ignore[github-env] BIN_DIR is created under RUNNER_TEMP, not derived from user input.
        set -euo pipefail
        case "${RUNNER_OS}/${RUNNER_ARCH}" in
          Linux/X64)
            TARGET=x86_64-unknown-linux-gnu
            EXPECTED_ARCHIVE="$CARGO_COOLDOWN_SHA256_LINUX_X64"
            EXPECTED_BINARY="$CARGO_COOLDOWN_BINARY_SHA256_LINUX_X64"
            ;;
          Linux/ARM64)
            TARGET=aarch64-unknown-linux-gnu
            EXPECTED_ARCHIVE="$CARGO_COOLDOWN_SHA256_LINUX_ARM64"
            EXPECTED_BINARY="$CARGO_COOLDOWN_BINARY_SHA256_LINUX_ARM64"
            ;;
          macOS/X64)
            TARGET=x86_64-apple-darwin
            EXPECTED_ARCHIVE="$CARGO_COOLDOWN_SHA256_MACOS_X64"
            EXPECTED_BINARY="$CARGO_COOLDOWN_BINARY_SHA256_MACOS_X64"
            ;;
          macOS/ARM64)
            TARGET=aarch64-apple-darwin
            EXPECTED_ARCHIVE="$CARGO_COOLDOWN_SHA256_MACOS_ARM64"
            EXPECTED_BINARY="$CARGO_COOLDOWN_BINARY_SHA256_MACOS_ARM64"
            ;;
          *)
            echo "::error::cargo-cooldown: unsupported runner ${RUNNER_OS}/${RUNNER_ARCH}"
            exit 1
            ;;
        esac

        ROOT="cargo-cooldown-${TARGET}-v${CARGO_COOLDOWN_VERSION}"
        ASSET="${ROOT}.tgz"
        TMP="${RUNNER_TEMP:?}/cargo-cooldown-${CARGO_COOLDOWN_VERSION}"
        ARCHIVE="$TMP/$ASSET"
        BIN_DIR="$TMP/bin"
        rm -rf "$TMP"
        mkdir -p "$BIN_DIR"
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
          --output "$ARCHIVE" \
          "https://github.com/dertin/cargo-cooldown/releases/download/v${CARGO_COOLDOWN_VERSION}/${ASSET}"
        if command -v sha256sum >/dev/null; then
          echo "$EXPECTED_ARCHIVE  $ARCHIVE" | sha256sum --check --strict
        elif command -v shasum >/dev/null; then
          echo "$EXPECTED_ARCHIVE  $ARCHIVE" | shasum -a 256 --check
        else
          echo "::error::cargo-cooldown: sha256sum or shasum is required"
          exit 1
        fi
        tar -xzf "$ARCHIVE" -C "$TMP"
        BIN="$BIN_DIR/cargo-cooldown"
        install -m 0755 "$TMP/$ROOT/cargo-cooldown" "$BIN"
        if command -v sha256sum >/dev/null; then
          echo "$EXPECTED_BINARY  $BIN" | sha256sum --check --strict
        else
          echo "$EXPECTED_BINARY  $BIN" | shasum -a 256 --check
        fi
        echo "$BIN_DIR" >> "$GITHUB_PATH"
        {
          echo "verifier-path=$BIN"
          echo "verifier-sha256=$EXPECTED_BINARY"
        } >> "$GITHUB_OUTPUT"

    - name: Install cargo-cooldown on Windows
      id: install-windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        CARGO_COOLDOWN_VERSION: "0.3.4"
        CARGO_COOLDOWN_SHA256_WINDOWS_X64: e3ec5ad658caa1e94ed133437ff93f503ccc3184a8a5cd56911682a55374fe9c
        CARGO_COOLDOWN_BINARY_SHA256_WINDOWS_X64: e5d9b0c8dc8f823e9b9a87333ae80cd377c7bac5b8d467ccac5624734cd5e9e7
      run: | # zizmor: ignore[github-env] binDir is created under RUNNER_TEMP, not derived from user input.
        $ErrorActionPreference = "Stop"
        if ($env:RUNNER_ARCH -ne "X64") {
          Write-Error "cargo-cooldown: unsupported runner Windows/$env:RUNNER_ARCH"
        }

        $target = "x86_64-pc-windows-msvc"
        $root = "cargo-cooldown-$target-v$env:CARGO_COOLDOWN_VERSION"
        $asset = "$root.zip"
        $tmp = Join-Path $env:RUNNER_TEMP "cargo-cooldown-$env:CARGO_COOLDOWN_VERSION"
        $archive = Join-Path $tmp $asset
        $binDir = Join-Path $tmp "bin"
        Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force $binDir | Out-Null
        Invoke-WebRequest -Uri "https://github.com/dertin/cargo-cooldown/releases/download/v$env:CARGO_COOLDOWN_VERSION/$asset" -OutFile $archive
        $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
        if ($actual -ne $env:CARGO_COOLDOWN_SHA256_WINDOWS_X64) {
          Write-Error "cargo-cooldown: checksum mismatch for $asset"
        }
        Expand-Archive -Path $archive -DestinationPath $tmp
        $bin = Join-Path $binDir "cargo-cooldown.exe"
        Copy-Item (Join-Path $tmp "$root/cargo-cooldown.exe") $bin
        $binaryActual = (Get-FileHash -Algorithm SHA256 $bin).Hash.ToLowerInvariant()
        if ($binaryActual -ne $env:CARGO_COOLDOWN_BINARY_SHA256_WINDOWS_X64) {
          Write-Error "cargo-cooldown: binary checksum mismatch"
        }
        Add-Content -Path $env:GITHUB_PATH -Value $binDir
        Add-Content -Path $env:GITHUB_OUTPUT -Value "verifier-path=$bin"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "verifier-sha256=$env:CARGO_COOLDOWN_BINARY_SHA256_WINDOWS_X64"

    - name: Check dependency cooldown
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ALLOW_USER_POLICY: ${{ inputs.allow-user-policy }}
        CARGO_COOLDOWN_BIN: ${{ steps.install-unix.outputs.verifier-path || steps.install-windows.outputs.verifier-path }}
        CARGO_COOLDOWN_SHA256: ${{ steps.install-unix.outputs.verifier-sha256 || steps.install-windows.outputs.verifier-sha256 }}
        COOLDOWN_DAYS: ${{ inputs.cooldown-days }}
        COOLDOWN_INCOMPATIBLE_PUBLISH_AGE: deny
        COOLDOWN_LOCKFILE_BASELINE: ignore
        COOLDOWN_MODE: ${{ inputs.mode }}
        COOLDOWN_VERBOSE: ${{ inputs.verbose }}
      run: |
        set -euo pipefail
        VERIFIER="${CARGO_COOLDOWN_BIN:?cargo-cooldown verifier path is required}"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          VERIFIER_EXEC="$(cygpath -u "$VERIFIER")"
        else
          VERIFIER_EXEC="$VERIFIER"
        fi
        if [[ ! -x "$VERIFIER_EXEC" ]]; then
          echo "::error::cargo-cooldown verifier is not executable: $VERIFIER"
          exit 1
        fi
        if command -v sha256sum >/dev/null; then
          ACTUAL_SHA256="$(sha256sum "$VERIFIER_EXEC" | awk '{print $1}')"
        else
          ACTUAL_SHA256="$(shasum -a 256 "$VERIFIER_EXEC" | awk '{print $1}')"
        fi
        if [[ "$ACTUAL_SHA256" != "$CARGO_COOLDOWN_SHA256" ]]; then
          echo "::error::cargo-cooldown verifier checksum mismatch"
          exit 1
        fi
        if [[ ! "$COOLDOWN_DAYS" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::cooldown-days must be a positive whole number"
          exit 1
        fi
        if [[ "$ALLOW_USER_POLICY" != "false" && "$ALLOW_USER_POLICY" != "true" ]]; then
          echo "::error::allow-user-policy must be 'true' or 'false'"
          exit 1
        fi
        if [[ ! -f Cargo.lock ]] || ! git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
          echo "::error::Cargo.lock must exist and be committed"
          exit 1
        fi
        if ! git diff --quiet HEAD -- Cargo.lock; then
          echo "::error::Cargo.lock must match the committed version"
          exit 1
        fi

        USER_CARGO_HOME="${CARGO_HOME:-${HOME:?HOME is required}/.cargo}"
        if [[ "$ALLOW_USER_POLICY" != "true" && -f "$USER_CARGO_HOME/cooldown.toml" ]]; then
          echo "::error::user cargo-cooldown policy is not allowed: $USER_CARGO_HOME/cooldown.toml"
          exit 1
        fi

        unset COOLDOWN_NOW COOLDOWN_SKIP_REGISTRIES CARGO_REGISTRY_MIN_PUBLISH_AGE
        while IFS= read -r VARIABLE; do
          case "$VARIABLE" in
            CARGO_REGISTRIES_*_MIN_PUBLISH_AGE) unset "$VARIABLE" ;;
          esac
        done < <(compgen -e)

        LOCKFILE_SNAPSHOT="$(mktemp)"
        cp -p Cargo.lock "$LOCKFILE_SNAPSHOT"
        restore_lockfile() {
          if ! cmp -s "$LOCKFILE_SNAPSHOT" Cargo.lock; then
            cp -p "$LOCKFILE_SNAPSHOT" Cargo.lock
          fi
          rm -f "$LOCKFILE_SNAPSHOT"
        }
        trap restore_lockfile EXIT

        export CARGO_REGISTRY_GLOBAL_MIN_PUBLISH_AGE="${COOLDOWN_DAYS} days"
        case "$COOLDOWN_MODE" in
          verify)
            "$VERIFIER_EXEC" cooldown --workspace --all-features tree \
              --locked --depth 0 >/dev/null
            ;;
          check)
            "$VERIFIER_EXEC" cooldown --workspace --all-features check --locked
            ;;
          *)
            echo "::error::mode must be 'verify' or 'check'"
            exit 1
            ;;
        esac
        git diff --exit-code HEAD -- Cargo.lock
