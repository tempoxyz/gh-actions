name: "Cargo cooldown"
description: "Fail when crates.io dependencies in Cargo.lock are newer than the configured cooldown"

inputs:
  cooldown-days:
    description: "Minimum whole days a crates.io release must have been published"
    required: false
    default: "7"
  working-directory:
    description: "Cargo workspace directory to check"
    required: false
    default: "."
  verbose:
    description: "Enable verbose cooldown output"
    required: false
    default: "false"

outputs:
  checked-packages:
    description: "Number of crates.io package versions checked"
  cache-hits:
    description: "Number of unique crate lookups served by Cargo's sparse-index cache"
  remote-fallbacks:
    description: "Number of unique crate lookups fetched from index.crates.io"
  exemptions:
    description: "Number of package versions exempted before index lookup"

runs:
  using: "node24"
  main: "main.js"
