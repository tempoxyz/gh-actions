name: "Socket STS"
description: "Exchange a GitHub Actions OIDC token for a short-lived Socket API token"

inputs:
  host:
    description: "Socket STS hostname used for HTTPS requests and the GitHub OIDC audience"
    required: false
    default: "socket-sts.tempoxyz.net"
  upload-aegis-report:
    description: "Upload the final Aegis audit log as a job artifact"
    required: false
    default: "true"

outputs:
  token:
    description: "Sensitive: short-lived Socket API token, registered with GitHub's secret masker"
  expires-at:
    description: "Time when Socket STS will revoke the token"
  node-path:
    description: "Absolute path to the Node runtime provided by the GitHub Actions runner"

runs:
  using: "node24"
  main: "main.cjs"
  post: "post.cjs"
