# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/pinact/refs/heads/main/json-schema/pinact.json
version: 3
min_age:
  value: 7
  always: true
rules:
  # First-party STS revisions are consumed immediately after review and remain
  # pinned by SHA, so they cannot satisfy the third-party soak period.
  - ignore: true
    conditions:
      - expr: ActionName == "tempoxyz/socket-sts/action"
  - ignore: true
    conditions:
      - expr: ActionName == "dtolnay/rust-toolchain"
  - ignore: true
    conditions:
      - expr: |
          ActionName matches "^docker://.+" && ActionVersion matches "^sha256:[0-9a-f]{64}$"
