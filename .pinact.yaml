# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/pinact/refs/heads/main/json-schema/pinact.json
version: 3
# Only first-party files are subject to the pin policy. Trees under vendor/ are copies of
# upstream actions managed by vendor-manifest.yml; their nested pins are handled by the sync.
files:
  - pattern: .github/workflows/*.yml
  - pattern: .github/workflows/*.yaml
  - pattern: actions/*/action.yml
  - pattern: actions/*/*/action.yml
min_age:
  value: 7
  always: true
rules:
  # Checkout is intentionally referenced by this release SHA without a version
  # comment. Limit the exception to the verified immutable commit.
  - ignore: true
    conditions:
      - expr: ActionName == "actions/checkout" && ActionVersion == "3d3c42e5aac5ba805825da76410c181273ba90b1"
  # Artifact upload follows the same explicit-SHA, no-version-comment policy.
  - ignore: true
    conditions:
      - expr: ActionName == "actions/upload-artifact" && ActionVersion == "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
  # First-party actions are consumed by this repository's own reusable workflows and
  # wrappers immediately after review. They stay pinned by full SHA, but this repository
  # publishes no tags to comment with and new revisions cannot satisfy the soak period.
  - ignore: true
    conditions:
      - expr: ActionName matches "^tempoxyz/gh-actions/"
  # The shim-capable Socket action revision is not tagged yet. Keep its
  # immutable pin while exempting only this action from comment/min-age checks.
  - ignore: true
    conditions:
      - expr: ActionName == "SocketDev/action"
  - ignore: true
    conditions:
      - expr: ActionName == "dtolnay/rust-toolchain"
  - ignore: true
    conditions:
      - expr: |
          ActionName matches "^docker://.+" && ActionVersion matches "^sha256:[0-9a-f]{64}$"
