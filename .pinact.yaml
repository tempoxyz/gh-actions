# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/pinact/refs/heads/main/json-schema/pinact.json
version: 3
# Only first-party files are subject to the pin policy. Trees under vendor/ are copies of
# upstream actions managed by vendor-manifest.yml; their nested pins are handled by the sync.
files:
  - pattern: .github/workflows/*.yml
  - pattern: .github/workflows/*.yaml
  - pattern: actions/*/action.yml
  - pattern: actions/*/*/action.yml
min_age:
  value: 7
  always: true
rules:
  # The shim-capable Socket action revision is not tagged yet. Keep its
  # immutable pin while exempting only this action from comment/min-age checks.
  - ignore: true
    conditions:
      - expr: ActionName == "SocketDev/action"
  # These nested first-party action pins intentionally reference commits in
  # this pull request. Their release tags are created after merge, at which
  # point the normal self-pin refresh replaces these exact exemptions.
  - ignore: true
    conditions:
      - expr: ActionName == "tempoxyz/gh-actions/actions/socket-sts"
      - expr: ActionVersion == "645c7bc579435697435a3990ee1d93aeeb0e65e7"
  - ignore: true
    conditions:
      - expr: ActionName == "tempoxyz/gh-actions/actions/github-sts"
      - expr: ActionVersion == "645c7bc579435697435a3990ee1d93aeeb0e65e7"
  - ignore: true
    conditions:
      - expr: ActionName == "tempoxyz/gh-actions/actions/harden-runner"
      - expr: ActionVersion == "950c3bc1e1464324ba6145183a740cdfab6051c2"
  - ignore: true
    conditions:
      - expr: ActionName == "tempoxyz/gh-actions/actions/socket-firewall"
      - expr: ActionVersion == "950c3bc1e1464324ba6145183a740cdfab6051c2"
  - ignore: true
    conditions:
      - expr: ActionName == "dtolnay/rust-toolchain"
  - ignore: true
    conditions:
      - expr: |
          ActionName matches "^docker://.+" && ActionVersion matches "^sha256:[0-9a-f]{64}$"
