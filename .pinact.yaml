# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/pinact/refs/heads/main/json-schema/pinact.json
version: 3
# Only first-party files are subject to the pin policy. Trees under vendor/ are copies of
# upstream actions managed by vendor-manifest.yml; their nested pins are handled by the sync.
files:
  - pattern: .github/workflows/*.yml
  - pattern: .github/workflows/*.yaml
  - pattern: actions/*/action.yml
  - pattern: actions/*/*/action.yml
min_age:
  value: 7
  always: true
rules:
  # The shim-capable Socket action revision is not tagged yet. Keep its
  # immutable pin while exempting only this action from comment/min-age checks.
  - ignore: true
    conditions:
      - expr: ActionName == "SocketDev/action"
  - ignore: true
    conditions:
      - expr: ActionName == "dtolnay/rust-toolchain"
  - ignore: true
    conditions:
      - expr: |
          ActionName matches "^docker://.+" && ActionVersion matches "^sha256:[0-9a-f]{64}$"
  # Latest-head refresh: these exact upstream commits have no release tag. Remove
  # each exception when replacing the pin with a tagged release; the seven-day
  # policy still applies to other commits.
  - ignore: true
    conditions:
      - expr: ActionName == "actions/checkout" && ActionVersion == "f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a"
  - ignore: true
    conditions:
      - expr: ActionName == "actions/download-artifact" && ActionVersion == "484a0b528fb4d7bd804637ccb632e47a0e638317"
  - ignore: true
    conditions:
      - expr: ActionName == "actions/setup-node" && ActionVersion == "7f84f1d52d0c56afb45c62fee31a93b843cea4d6"
  - ignore: true
    conditions:
      - expr: ActionName == "actions/cache" && ActionVersion == "3edfce9056124e459a23f683a21433670d47daca"
  - ignore: true
    conditions:
      - expr: ActionName == "sigstore/cosign-installer" && ActionVersion == "828df1e55de306ba29db814d6057ddae71883cda"
  - ignore: true
    conditions:
      - expr: ActionName == "docker/login-action" && ActionVersion == "783ae9cac559640a24c9212dfa6cd9e998252f9a"
  - ignore: true
    conditions:
      - expr: ActionName == "docker/metadata-action" && ActionVersion == "8e671d84a3bd81afdfc4fdbb96a42b07c2a80934"
  # cosign-sign consumes the first published commit carrying the 828df1e cosign-installer vendor.
  - min_age: 0
    conditions:
      - expr: ActionName == "tempoxyz/gh-actions/vendor/sigstore/cosign-installer" && ActionVersion == "62de042f2251366d3fedbba7b7920b4f90fab588"
  # The latest published repository commit is intentionally inside the cooldown.
  - min_age: 0
    conditions:
      - expr: ActionName matches "^tempoxyz/gh-actions(/|$)" && ActionVersion == "392079a54ac0240e1b21417eca38b7c0a50bf55d"
  - min_age: 0
    conditions:
      - expr: ActionName == "tempoxyz/gh-actions/actions/secure-runner" && ActionVersion == "d3efa0f3c3121a949e342d9a52240f988fbfd4ee"
