# Minimal known-good workflow used by .github/workflows/test.yml to prove the
# scan passes on valid input. Copied into .github/workflows at test time; never
# committed there.
name: clean fixture

on:
  pull_request:

permissions:
  contents: read

jobs:
  ok:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@cfdaf2e39309260bff640fb06cf1ab2f9f57386b # 2026-09-25T04-44-11Z-cfdaf2e3
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Print title safely
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "title $TITLE"
