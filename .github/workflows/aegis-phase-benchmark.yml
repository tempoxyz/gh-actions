name: Aegis authentication and verification benchmark

on:
  push:
    branches: [centaur/measure-aegis-phases-1790622903]
    paths: [.github/workflows/aegis-phase-benchmark.yml]

permissions:
  contents: read
  id-token: write

jobs:
  benchmark:
    name: Aegis phases sample ${{ matrix.sample }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - name: Measure authentication and verification separately
        uses: tempoxyz/gh-actions/actions/secure-runner@85c27f9f5b037c77c2dda4bfc6e193b6b133e281
        with:
          aegis-version: v0.19.0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify allowed package
        run: node actions/aegis/npm-install.cjs allow

      - name: Verify blocked package
        id: blocked
        continue-on-error: true
        run: node actions/aegis/npm-install.cjs block

      - name: Require policy block
        env:
          BLOCK_OUTCOME: ${{ steps.blocked.outcome }}
        run: test "$BLOCK_OUTCOME" = failure

      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aegis-phases-${{ matrix.sample }}
          path: ${{ runner.temp }}/aegis-phases.json
          retention-days: 7
