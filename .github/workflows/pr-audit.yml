name: Pull request audit

on:
  workflow_call:
    inputs:
      required-label:
        description: Label required to trigger audit event publishing. Kept for compatibility; use required-labels for multiple labels.
        required: false
        type: string
        default: cyclops
      required-labels:
        description: Comma or newline-separated production labels. cyclops-staging and cyclops-ab are trusted built-in controls.
        required: false
        type: string
      branch:
        description: Branch to audit when called from workflow_dispatch.
        required: false
        type: string
      pr-number:
        description: PR number to audit when called from workflow_dispatch.
        required: false
        type: number
      environment:
        description: GitHub Environment name used to gate audit publishing.
        required: false
        type: string
      require-completed-audit:
        description: Require a completed tempoxyz-bot Cyclops review before merge.
        required: false
        type: boolean
        default: false
    secrets:
      EVENTS_KEY:
        required: true
      EVENTS_CERT:
        required: true
      EVENTS_ARGS:
        required: true

permissions:
  id-token: write

jobs:
  publish:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: $/actions/secure-runner

      - name: Resolve target
        id: target
        env:
          ACTOR: ${{ github.actor }}
          REQUIRED_LABEL: ${{ inputs.required-label }}
          REQUIRED_LABELS: ${{ inputs.required-labels }}
          BRANCH: ${{ inputs.branch }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          LABEL_NAME: ${{ github.event.label.name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TARGET_PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          set_output() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            labels="${REQUIRED_LABELS:-$REQUIRED_LABEL}"
            if [[ "$EVENT_ACTION" != "labeled" ]]; then
              set_output publish false
              exit 0
            fi

            channels=legacy
            matched=false
            if [[ "$LABEL_NAME" == "cyclops-staging" ]]; then
              channels=staging
              matched=true
            elif [[ "$LABEL_NAME" == "cyclops-ab" ]]; then
              channels="production staging"
              matched=true
            else
              while IFS= read -r label; do
                label="${label#"${label%%[![:space:]]*}"}"
                label="${label%"${label##*[![:space:]]}"}"
                if [[ -n "$label" && "$LABEL_NAME" == "$label" ]]; then
                  matched=true
                  break
                fi
              done < <(printf '%s\n' "$labels" | tr ',' '\n')
            fi

            if [[ "$matched" != "true" ]]; then
              set_output publish false
              exit 0
            fi
            set_output pr_number "$PR_NUMBER"
            set_output sha "$PR_HEAD_SHA"
            set_output channels "$channels"

          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PERM=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission')
            if [[ "$PERM" != "admin" ]]; then
              echo "::error::Only admins can trigger ad-hoc audits (got: $PERM)"
              exit 1
            fi

            if [[ -n "$TARGET_PR_NUMBER" && "$TARGET_PR_NUMBER" != "0" ]]; then
              SHA=$(gh api "repos/$REPO/pulls/$TARGET_PR_NUMBER" --jq '.head.sha')
              set_output pr_number "$TARGET_PR_NUMBER"
              set_output sha "$SHA"
            elif [[ -n "$BRANCH" ]]; then
              SHA=$(gh api "repos/$REPO/commits/$BRANCH" --jq '.sha')
              set_output sha "$SHA"
            else
              echo "::error::Either branch or pr-number must be provided"
              exit 1
            fi
            set_output channels legacy
          else
            set_output publish false
            exit 0
          fi

          set_output publish true

      - name: Publish event
        if: steps.target.outputs.publish == 'true'
        env:
          EVENTS_KEY: ${{ secrets.EVENTS_KEY }}
          EVENTS_CERT: ${{ secrets.EVENTS_CERT }}
          EVENTS_ARGS: ${{ secrets.EVENTS_ARGS }}
          REPO: ${{ github.repository }}
          TARGET_PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          RUNNER_CHANNELS: ${{ steps.target.outputs.channels }}
        run: |
          set -euo pipefail

          printf '%s' "$EVENTS_KEY" > "$RUNNER_TEMP/key"
          printf '%s' "$EVENTS_CERT" > "$RUNNER_TEMP/cert"

          events_args=()
          while IFS= read -r -d '' arg; do
            events_args+=("$arg")
          done < <(
            env -i PATH="$PATH" python3 -I -S -c '
          import shlex
          import sys

          for arg in shlex.split(sys.stdin.read()):
              sys.stdout.buffer.write(arg.encode() + b"\0")
          ' <<< "$EVENTS_ARGS"
          )
          if (( ${#events_args[@]} == 0 )); then
            echo "::error::EVENTS_ARGS must contain at least one curl argument"
            exit 1
          fi

          child_env=(PATH="$PATH")
          for name in \
            HTTP_PROXY HTTPS_PROXY NO_PROXY ALL_PROXY \
            http_proxy https_proxy no_proxy all_proxy \
            SSL_CERT_FILE SSL_CERT_DIR CURL_CA_BUNDLE
          do
            if [[ -n "${!name:-}" ]]; then
              child_env+=("$name=${!name}")
            fi
          done

          publish_failures=()
          for runner_channel in ${RUNNER_CHANNELS:-legacy}; do
            run_label=""
            if [[ "$runner_channel" != "legacy" ]]; then
              run_label="pr-${TARGET_PR_NUMBER}-${TARGET_SHA:0:12}-${runner_channel}"
            fi

            # The single-quoted program contains jq variables, not shell expansions.
            # shellcheck disable=SC2016
            if ! env -i PATH="$PATH" jq -n \
              --arg repo "$REPO" \
              --arg sha "$TARGET_SHA" \
              --arg pr "$TARGET_PR_NUMBER" \
              --arg runner_channel "$runner_channel" \
              --arg run_label "$run_label" \
              '{
                repository: $repo,
                event: "pr_audit",
                data: (
                  {sha: $sha}
                  + (if $pr != "" then {pr_number: ($pr | tonumber)} else {} end)
                  + (if $runner_channel != "legacy" then {runner_channel: $runner_channel, run_label: $run_label} else {} end)
                )
              }' \
            | env -i "${child_env[@]}" curl -sf -o /dev/null -X POST "${events_args[@]}" \
                -H "Content-Type: application/json" \
                --key "$RUNNER_TEMP/key" \
                --cert "$RUNNER_TEMP/cert" \
                -d @-; then
              publish_failures+=("$runner_channel")
            fi
          done

          if (( ${#publish_failures[@]} > 0 )); then
            printf '::error::Failed to publish pr_audit event for channel(s): %s\n' "${publish_failures[*]}"
            exit 1
          fi

  require-completed-audit:
    if: >-
      inputs.require-completed-audit &&
      (
        github.event_name == 'pull_request_target' ||
        (
          github.event_name == 'pull_request_review' &&
          github.event.review.user.id == 258930814 &&
          startsWith(github.event.review.body, ':eye: **Cyclops Review**') &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        )
      )
    concurrency:
      group: pr-audit-gate-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: read
      statuses: write
    steps:
      - name: Secure runner
        uses: $/actions/secure-runner

      - name: Report audit status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const repoFullName = `${context.repo.owner}/${context.repo.repo}`;
            const cyclopsBotId = 258930814; // tempoxyz-bot
            const fork = pull.head.repo?.full_name !== repoFullName;
            const dependabot = pull.user.login === 'dependabot[bot]';
            let completedReview;

            if (!fork && !dependabot) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                per_page: 100,
              });
              completedReview = reviews.find(review =>
                review.user?.id === cyclopsBotId &&
                review.body?.startsWith(':eye: **Cyclops Review**')
              );
            }

            const passed = fork || dependabot || completedReview;
            const description = fork
              ? 'External fork PR is exempt from Cyclops audit'
              : dependabot
                ? 'Dependabot PR is exempt from Cyclops audit'
                : completedReview
                  ? 'A Cyclops audit completed for this pull request'
                  : 'Waiting for a completed Cyclops audit';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: pull.head.sha,
              state: passed ? 'success' : 'pending',
              context: 'Cyclops audit run',
              description,
              target_url: completedReview?.html_url ?? pull.html_url,
            });

  pass-merge-group-audit:
    if: inputs.require-completed-audit && github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      statuses: write
    steps:
      - name: Secure runner
        uses: $/actions/secure-runner

      - name: Pass merge group
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The audit is enforced on the pull request before it can enter
            // the merge queue, so merge group commits pass through.
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.merge_group.head_sha,
              state: 'success',
              context: 'Cyclops audit run',
              description: 'Audit enforced on the pull request',
            });
