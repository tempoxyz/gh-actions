name: Pull request audit

on:
  workflow_call:
    inputs:
      required-label:
        description: Label required to trigger audit event publishing. Kept for compatibility; use required-labels for multiple labels.
        required: false
        type: string
        default: cyclops
      required-labels:
        description: Comma or newline-separated labels that trigger audit event publishing.
        required: false
        type: string
      branch:
        description: Branch to audit when called from workflow_dispatch.
        required: false
        type: string
      pr-number:
        description: PR number to audit when called from workflow_dispatch.
        required: false
        type: number
      environment:
        description: GitHub Environment name used to gate audit publishing.
        required: false
        type: string
      require-completed-audit:
        description: Require a completed tempoxyz-bot Cyclops review before merge.
        required: false
        type: boolean
        default: false
      env:
        description: Audit environment (staging, prod, production, or ab).
        required: false
        type: string
        default: prod
      audit-on-push:
        description: Also publish when a non-draft, same-repo PR is opened, pushed, reopened, or marked ready.
        required: false
        type: boolean
        default: false
    secrets:
      EVENTS_KEY:
        required: true
      EVENTS_CERT:
        required: true
      EVENTS_ARGS:
        required: true

permissions:
  id-token: write

jobs:
  publish:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request_target' &&
        inputs.audit-on-push &&
        contains(fromJSON('["opened", "synchronize", "reopened", "ready_for_review"]'), github.event.action)
      )
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@392079a54ac0240e1b21417eca38b7c0a50bf55d # 2026-10-01T18-10-09Z-392079a5

      - name: Resolve target
        id: target
        env:
          ACTOR: ${{ github.actor }}
          AUDIT_ENV: ${{ inputs.env }}
          AUDIT_ON_PUSH: ${{ inputs.audit-on-push }}
          REQUIRED_LABEL: ${{ inputs.required-label }}
          REQUIRED_LABELS: ${{ inputs.required-labels }}
          BRANCH: ${{ inputs.branch }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          LABEL_NAME: ${{ github.event.label.name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TARGET_PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail

          # prod omits runner_channel so sensors keep legacy routing.
          case "$(printf '%s' "$AUDIT_ENV" | tr '[:upper:]' '[:lower:]')" in
            staging) runner_channel=staging ;;
            ab) runner_channel=ab ;;
            prod|production) runner_channel="" ;;
            *)
              echo "::error::Invalid env input (must be staging, prod, production, or ab)"
              exit 1
              ;;
          esac
          echo "runner_channel=$runner_channel" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$EVENT_ACTION" == "labeled" ]]; then
              labels="${REQUIRED_LABELS:-$REQUIRED_LABEL}"
              matched=false
              while IFS= read -r label; do
                label="${label#"${label%%[![:space:]]*}"}"
                label="${label%"${label##*[![:space:]]}"}"
                if [[ -n "$label" && "$LABEL_NAME" == "$label" ]]; then
                  matched=true
                  break
                fi
              done < <(printf '%s\n' "$labels" | tr ',' '\n')

              if [[ "$matched" != "true" ]]; then
                echo "publish=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            elif [[ "$AUDIT_ON_PUSH" == "true" &&
                    "$EVENT_ACTION" =~ ^(opened|synchronize|reopened|ready_for_review)$ ]]; then
              if [[ "$PR_DRAFT" == "true" || "$PR_HEAD_REPO" != "$REPO" ]]; then
                echo "publish=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"

          elif [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            # GitHub starts no pull_request runs while a PR conflicts with its base, so publish those pushes here.
            if [[ "$AUDIT_ON_PUSH" != "true" ||
                  ! "$EVENT_ACTION" =~ ^(opened|synchronize|reopened|ready_for_review)$ ||
                  "$PR_DRAFT" == "true" || "$PR_HEAD_REPO" != "$REPO" ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # mergeable is null until GitHub finishes the test merge.
            mergeable=null
            for _ in $(seq 12); do
              mergeable=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.mergeable')
              [[ "$mergeable" != "null" ]] && break
              sleep 5
            done
            if [[ "$mergeable" != "false" ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"

          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PERM=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission')
            if [[ "$PERM" != "admin" ]]; then
              echo "::error::Only admins can trigger ad-hoc audits (got: $PERM)"
              exit 1
            fi

            if [[ -n "$TARGET_PR_NUMBER" && "$TARGET_PR_NUMBER" != "0" ]]; then
              SHA=$(gh api "repos/$REPO/pulls/$TARGET_PR_NUMBER" --jq '.head.sha')
              echo "pr_number=$TARGET_PR_NUMBER" >> "$GITHUB_OUTPUT"
              echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            elif [[ -n "$BRANCH" ]]; then
              SHA=$(gh api "repos/$REPO/commits/$BRANCH" --jq '.sha')
              echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Either branch or pr-number must be provided"
              exit 1
            fi
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish event
        if: steps.target.outputs.publish == 'true'
        env:
          EVENTS_KEY: ${{ secrets.EVENTS_KEY }}
          EVENTS_CERT: ${{ secrets.EVENTS_CERT }}
          EVENTS_ARGS: ${{ secrets.EVENTS_ARGS }}
          REPO: ${{ github.repository }}
          RUNNER_CHANNEL: ${{ steps.target.outputs.runner_channel }}
          TARGET_PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail

          printf '%s' "$EVENTS_KEY" > "$RUNNER_TEMP/key"
          printf '%s' "$EVENTS_CERT" > "$RUNNER_TEMP/cert"

          events_args=()
          while IFS= read -r -d '' arg; do
            events_args+=("$arg")
          done < <(
            env -i PATH="$PATH" python3 -I -S -c '
          import shlex
          import sys

          for arg in shlex.split(sys.stdin.read()):
              sys.stdout.buffer.write(arg.encode() + b"\0")
          ' <<< "$EVENTS_ARGS"
          )
          if (( ${#events_args[@]} == 0 )); then
            echo "::error::EVENTS_ARGS must contain at least one curl argument"
            exit 1
          fi

          child_env=(PATH="$PATH")
          for name in \
            HTTP_PROXY HTTPS_PROXY NO_PROXY ALL_PROXY \
            http_proxy https_proxy no_proxy all_proxy \
            SSL_CERT_FILE SSL_CERT_DIR CURL_CA_BUNDLE
          do
            # ${!name+x} is set-but-possibly-empty detection that bash 3.2 (the
            # macOS system bash used by the local test) understands; -v needs 4.2.
            if [[ -n "${!name+x}" ]]; then
              child_env+=("$name=${!name}")
            fi
          done

          # The single-quoted program contains jq variables, not shell expansions.
          # shellcheck disable=SC2016
          env -i PATH="$PATH" jq -n \
            --arg repo "$REPO" \
            --arg sha "$TARGET_SHA" \
            --arg pr "$TARGET_PR_NUMBER" \
            --arg runner_channel "${RUNNER_CHANNEL:-}" \
            '{
              repository: $repo,
              event: "pr_audit",
              data: (
                {sha: $sha}
                + (if $pr != "" then {pr_number: ($pr | tonumber)} else {} end)
                + (if $runner_channel != "" then {runner_channel: $runner_channel} else {} end)
              )
            }' \
          | env -i "${child_env[@]}" curl -sf -o /dev/null -X POST "${events_args[@]}" \
              -H "Content-Type: application/json" \
              --key "$RUNNER_TEMP/key" \
              --cert "$RUNNER_TEMP/cert" \
              -d @-

  require-completed-audit:
    if: >-
      inputs.require-completed-audit &&
      (
        github.event_name == 'pull_request_target' ||
        (
          github.event_name == 'pull_request_review' &&
          github.event.review.user.id == 258930814 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        )
      )
    concurrency:
      group: pr-audit-gate-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: read
      statuses: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@392079a54ac0240e1b21417eca38b7c0a50bf55d # 2026-10-01T18-10-09Z-392079a5

      - name: Report audit status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const repoFullName = `${context.repo.owner}/${context.repo.repo}`;
            const cyclopsBotId = 258930814; // tempoxyz-bot
            const fork = pull.head.repo?.full_name !== repoFullName;
            const dependabot = pull.user.login === 'dependabot[bot]';
            let completedReview;

            if (!fork && !dependabot) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                per_page: 100,
              });
              completedReview = reviews.find(review =>
                review.user?.id === cyclopsBotId &&
                review.body?.replace(/^<!-- cyclops:review [^\r\n]* -->\r?\n/, '')
                  .trimStart()
                  .startsWith(':eye: **Cyclops Review**')
              );
            }

            const passed = fork || dependabot || completedReview;
            const description = fork
              ? 'External fork PR is exempt from Cyclops audit'
              : dependabot
                ? 'Dependabot PR is exempt from Cyclops audit'
                : completedReview
                  ? 'A Cyclops audit completed for this pull request'
                  : 'Waiting for a completed Cyclops audit';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: pull.head.sha,
              state: passed ? 'success' : 'pending',
              context: 'Cyclops audit run',
              description,
              target_url: completedReview?.html_url ?? pull.html_url,
            });

  pass-merge-group-audit:
    if: inputs.require-completed-audit && github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      statuses: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@392079a54ac0240e1b21417eca38b7c0a50bf55d # 2026-10-01T18-10-09Z-392079a5

      - name: Pass merge group
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The audit is enforced on the pull request before it can enter
            // the merge queue, so merge group commits pass through.
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.merge_group.head_sha,
              state: 'success',
              context: 'Cyclops audit run',
              description: 'Audit enforced on the pull request',
            });
