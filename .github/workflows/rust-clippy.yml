name: rust clippy

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: Rust toolchain used for cargo clippy.
        required: false
        type: string
        default: nightly
      flags:
        description: Flags passed to cargo clippy.
        required: false
        type: string
        default: --all-targets --all-features --locked
      runner:
        description: Runner used for cargo clippy.
        required: false
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Timeout for each job.
        required: false
        type: number
        default: 30
      checkout-submodules:
        description: Submodule checkout mode passed to actions/checkout.
        required: false
        type: string
        default: "false"

permissions: {}

jobs:
  clippy:
    # Call the reusable workflow at the published, pinned commit.
    uses: tempoxyz/gh-actions/.github/workflows/rust-lint.yml@ddde9bacfffed2574debefdeee00747b3d2c6087 # 2026-09-24T20-02-12Z-ddde9bac
    permissions:
      contents: read
      id-token: write
    with:
      run-clippy: true
      run-fmt: false
      run-typos: false
      run-deny: false
      rust-toolchain: ${{ inputs.rust-toolchain }}
      clippy-flags: ${{ inputs.flags }}
      clippy-runner: ${{ inputs.runner }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      checkout-submodules: ${{ inputs.checkout-submodules }}
