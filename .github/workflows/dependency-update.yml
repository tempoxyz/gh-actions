name: Dependency Update and Repair

on:
  workflow_call:
    inputs:
      adapter-script:
        description: Tracked standalone Python adapter on the caller base branch; implements resolve/apply.
        type: string
        required: true
      base-branch:
        description: Caller default branch; the trusted adapter source, schedule ref and PR base.
        type: string
        default: main
      requested-ref:
        description: Optional upstream ref/tag passed to the trusted adapter as UPDATE_REQUESTED_REF.
        type: string
        default: ""
      sts-policy:
        description: Caller-repository policy granting contents/PR write to this workflow.
        type: string
        required: true
      rust-toolchains:
        description: Whitespace-separated exact Rust versions or dated nightlies; first is the default. Installs rustfmt and Clippy.
        type: string
        required: true
      nextest-version:
        description: Exact cargo-nextest release installed on the runner.
        type: string
        default: "0.9.127"
      codex-version:
        description: Exact @openai/codex npm version installed on the runner.
        type: string
        default: "0.162.0"
      codex-model:
        description: Codex model override; empty uses the pinned CLI default.
        type: string
        default: ""
      codex-effort:
        description: Codex reasoning effort override; empty uses the model default.
        type: string
        default: ""
      native-packages:
        description: Whitespace-separated apt packages required by the Rust workspace.
        type: string
        default: build-essential pkg-config libssl-dev clang libclang-dev mold
      runner:
        type: string
        default: ubuntu-latest
      environment:
        description: Caller environment for the Codex credential and STS trust subject.
        type: string
        default: dependency-updates
      local-checks:
        description: Newline-separated verification commands, parsed without a shell.
        type: string
        required: true
      allowed-paths:
        description: Newline-separated globs for Rust/Cargo changes; metadata/configuration are denied.
        type: string
        required: true
      repair-instructions:
        type: string
        default: Fix dependency API compatibility without weakening invariants or tests.
      required-workflows:
        description: Nonempty newline-separated workflow paths; each must pass for the exact candidate SHA.
        type: string
        required: true
      max-local-repairs:
        type: number
        default: 3
      max-ci-repairs:
        type: number
        default: 3
      repair-budget-minutes:
        description: Runner time for checks and repairs (at most 150); CI waiting uses the rest of the 180-minute job.
        type: number
        default: 120
    secrets:
      CODEX_API_KEY:
        required: true
    outputs:
      pull-request-number:
        value: ${{ jobs.update.outputs.pull-request-number }}
      pull-request-url:
        value: ${{ jobs.update.outputs.pull-request-url }}
      head-sha:
        value: ${{ jobs.update.outputs.head-sha }}
      status:
        value: ${{ jobs.update.outputs.status }}

permissions: {}

jobs:
  update:
    if: >-
      github.ref == format('refs/heads/{0}', inputs.base-branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    outputs:
      pull-request-number: ${{ steps.update.outputs.pull-request-number }}
      pull-request-url: ${{ steps.update.outputs.pull-request-url }}
      head-sha: ${{ steps.update.outputs.head-sha }}
      status: ${{ steps.update.outputs.status }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@22f68514ca39af6de7309037b7df07a02ce160a9 # 2026-10-16T06-53-07Z-22f68514
      - name: Checkout trusted caller base branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          ref: ${{ inputs.base-branch }}
          path: caller
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout matching shared implementation
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gh-actions
          persist-credentials: false
      - name: Install Rust, Codex and native dependencies
        env:
          RUST_TOOLCHAINS: ${{ inputs.rust-toolchains }}
          NEXTEST_VERSION: ${{ inputs.nextest-version }}
          CODEX_VERSION: ${{ inputs.codex-version }}
          NATIVE_PACKAGES: ${{ inputs.native-packages }}
        run: python3 -I .gh-actions/actions/dependency-update/setup_tools.py
      - name: Install cargo-nextest
        uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@22f68514ca39af6de7309037b7df07a02ce160a9 # 2026-10-16T06-53-07Z-22f68514
        with:
          tool: cargo-nextest@${{ inputs.nextest-version }}
      - name: Prepare, repair, publish and verify CI
        id: update
        env:
          DEPENDENCY_UPDATE_CONFIG: ${{ toJSON(inputs) }}
          GH_TOKEN: ${{ github.token }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          CODEX_MODEL: ${{ inputs.codex-model }}
          CODEX_EFFORT: ${{ inputs.codex-effort }}
        run: |
          python3 -I .gh-actions/actions/dependency-update/update.py \
            --source "$GITHUB_WORKSPACE/caller" --shared "$GITHUB_WORKSPACE/.gh-actions"
