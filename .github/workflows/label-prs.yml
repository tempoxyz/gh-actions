name: Label PRs

on:
  workflow_call:
    secrets:
      STEP_SECURITY_STS_PRD_URL:
        description: "StepSecurity API key used to read attached Harden Runner policies."
        required: true

permissions:
  id-token: write

jobs:
  label-prs:
    name: Label PRs
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - name: Harden the runner with the StepSecurity policy store
        uses: tempoxyz/gh-actions/actions/harden-runner@5006e0ee3f89173e45e2ab30e2fa2e2ff3713d80
        with:
          sts-url: ${{ secrets.STEP_SECURITY_STS_PRD_URL }} # zizmor: ignore[secrets-outside-env] Harden Runner requires this organization secret as an action input.

      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gh-actions
          persist-credentials: false

      - name: Label PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label_pr = require('./.gh-actions/.github/scripts/label_pr.js')
            await label_pr({github, context})
