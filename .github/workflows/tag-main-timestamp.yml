name: Tag Main Timestamp

on:
  push:
    branches: [main]

permissions:
  id-token: write

jobs:
  tag:
    name: Tag main revision
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Secure runner
        uses: $/actions/secure-runner

      - name: Checkout pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Create timestamp tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$tag" "$REVISION" --message "Main branch at $tag"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" "refs/tags/$tag"
