name: Close Stale PRs

on:
  workflow_call:

permissions: {}

jobs:
  stale:
    permissions:
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@aaec1d2a49380949d267946d343f0cb9440248b7 # 2026-10-16T03-27-40Z-aaec1d2a

      - name: Close stale PRs
        uses: actions/stale@b5d41d4e1d5dceea10e7104786b73624c18a190f # v10.2.0
        with:
          days-before-pr-stale: 7
          days-before-pr-close: 3
          stale-pr-message: "This PR has been marked stale due to 7 days of inactivity."
          close-pr-message: "Closed due to inactivity. Reopen if still needed."
          stale-pr-label: stale
          exempt-draft-pr: false
          operations-per-run: 120
          days-before-issue-stale: -1
          days-before-issue-close: -1
