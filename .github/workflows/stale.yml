name: Close Stale PRs

on:
  workflow_call:
    inputs:
      days-before-pr-stale:
        description: Days of inactivity before a PR is labeled stale
        required: false
        default: 7
        type: number
      days-before-pr-close:
        description: Days after being labeled stale before a PR is closed
        required: false
        default: 3
        type: number
      exempt-pr-labels:
        description: Comma-separated labels that exempt a PR from being marked stale or closed
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  stale:
    permissions:
      actions: write # lets actions/stale delete its _state cache between runs
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@68a1e4645c9596fee5398dd1e2ba07f0a4aa6a71 # 2026-10-20T04-40-18Z-68a1e464

      - name: Close stale PRs
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-pr-stale: ${{ inputs.days-before-pr-stale }}
          days-before-pr-close: ${{ inputs.days-before-pr-close }}
          stale-pr-message: "This PR has been marked stale due to ${{ inputs.days-before-pr-stale }} days of inactivity."
          close-pr-message: "Closed due to inactivity. Reopen if still needed."
          stale-pr-label: stale
          exempt-pr-labels: ${{ inputs.exempt-pr-labels }}
          exempt-draft-pr: false
          operations-per-run: 120
          days-before-issue-stale: -1
          days-before-issue-close: -1
