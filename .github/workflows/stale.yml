name: Close Stale PRs

on:
  workflow_call:

permissions: {}

jobs:
  stale:
    permissions:
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@a4fa1d51aa4014d86628f43b1dff8ba88219e04d # 2026-10-15T00-03-55Z-a4fa1d51

      - name: Close stale PRs
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-pr-stale: 7
          days-before-pr-close: 3
          stale-pr-message: "This PR has been marked stale due to 7 days of inactivity."
          close-pr-message: "Closed due to inactivity. Reopen if still needed."
          stale-pr-label: stale
          exempt-draft-pr: false
          operations-per-run: 120
          days-before-issue-stale: -1
          days-before-issue-close: -1
