name: Scan GitHub Actions

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: Scan GitHub Actions
    uses: tempoxyz/gh-actions/.github/workflows/scan-github-actions.yml@68a1e4645c9596fee5398dd1e2ba07f0a4aa6a71 # 2026-10-20T04-40-18Z-68a1e464
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      # vendor/ holds copies of upstream actions; they are reviewed via vendor-manifest.yml,
      # not linted to this repo's standards.
      paths: ".github actions"
      pinact: true
      verify-pin-comments: true
