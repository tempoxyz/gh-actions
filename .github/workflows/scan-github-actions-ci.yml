name: Scan GitHub Actions

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: Scan GitHub Actions
    uses: tempoxyz/gh-actions/.github/workflows/scan-github-actions.yml@70385c1498b84428d55291dc53c7352e98b6e6ee # pr-256-sts-transport-rust-workflows
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      # vendor/ holds copies of upstream actions; they are reviewed via vendor-manifest.yml,
      # not linted to this repo's standards.
      paths: ".github actions"
      pinact: true
      verify-pin-comments: true
