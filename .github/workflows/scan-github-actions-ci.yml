name: Scan GitHub Actions

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: Scan GitHub Actions
    uses: tempoxyz/gh-actions/.github/workflows/scan-github-actions.yml@ddde9bacfffed2574debefdeee00747b3d2c6087 # 2026-09-24T20-02-12Z-ddde9bac
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      # vendor/ holds copies of upstream actions; they are reviewed via vendor-manifest.yml,
      # not linted to this repo's standards.
      paths: ".github actions"
      pinact: true
      verify-pin-comments: true
