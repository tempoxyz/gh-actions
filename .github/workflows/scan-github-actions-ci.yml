name: Scan GitHub Actions

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: Scan GitHub Actions
    uses: tempoxyz/gh-actions/.github/workflows/scan-github-actions.yml@392079a54ac0240e1b21417eca38b7c0a50bf55d # 2026-10-01T18-10-09Z-392079a5
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      # vendor/ holds copies of upstream actions; they are reviewed via vendor-manifest.yml,
      # not linted to this repo's standards.
      paths: ".github actions"
      pinact: true
      verify-pin-comments: true
