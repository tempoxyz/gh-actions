name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write

jobs:
  scan-github-actions:
    name: Scan GitHub Actions
    uses: ./.github/workflows/scan-github-actions.yml
    permissions:
      id-token: write
      actions: read
      contents: read
    secrets:
      STEP_SECURITY_STS_PRD_URL: ${{ secrets.STEP_SECURITY_STS_PRD_URL }}
    with:
      # vendor/ holds copies of upstream actions; they are reviewed via vendor-manifest.yml,
      # not linted to this repo's standards.
      paths: ".github actions"
      pinact: true

  vendor-check:
    name: Vendor check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Harden the runner with the StepSecurity policy store
        uses: tempoxyz/gh-actions/actions/harden-runner@9f72170b927ba7f69cbeca429b31861edf4070b6
        with:
          sts-url: ${{ secrets.STEP_SECURITY_STS_PRD_URL }} # zizmor: ignore[secrets-outside-env] Harden Runner requires this organization secret as an action input.

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rebuilds every vendored action from vendor-manifest.yml into a temp dir (fetching the
      # pinned upstream commits) and fails on any difference to vendor/ or the README table.
      - name: Verify vendor/ matches vendor-manifest.yml
        run: node vendor/sync.mjs --check

      - name: Run vendor tooling tests
        run: node --test vendor/lib.test.js
