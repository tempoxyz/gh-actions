name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write

jobs:
  vendor-check:
    name: Vendor check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@ee2960a6cc25d99bda45614135bfe1197d879bac # 2026-09-26T06-46-03Z-ee2960a6

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rebuilds every vendored action from vendor-manifest.yml into a temp dir (fetching the
      # pinned upstream commits) and fails on any difference to vendor/ or the README table.
      - name: Verify vendor/ matches vendor-manifest.yml
        run: node vendor/sync.mjs --check

      - name: Run vendor tooling tests
        run: node --test vendor/lib.test.js

      # ensure-secure-runner ships @actions/workflow-parser as a committed esbuild bundle. Rebuild
      # it from the lockfile (verifying registry signatures and provenance attestations first)
      # and fail if the committed file differs, so a dependency bump cannot land without its bundle.
      - name: Verify the bundled workflow parser matches package-lock.json
        working-directory: actions/ensure-secure-runner
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          # `npm audit signatures` installs nothing; it fetches the registry's signing keys and
          # per-package signature metadata, which the Aegis proxy does not serve. Run
          # it against the registry directly by dropping the shim directory from PATH, exactly
          # as the shim itself does before handing off to sfw.
          PATH="$(echo "$PATH" | tr ':' '\n' | grep -vxF "${SFW_SHIM_DIR:-}" | paste -sd: -)" npm audit signatures
          node build.mjs --check
