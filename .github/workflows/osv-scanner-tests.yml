name: Native OSV Tests

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  native:
    name: Native OSV (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@afd6ea052fb1953e4e9df3c406f28c3f3d1ab8fc # 2026-09-29T00-29-36Z-afd6ea05
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        shell: bash
        run: node --test actions/osv-scanner-action/*.test.js
      - name: Verify native installation, scanning, and reporting
        shell: bash
        run: node actions/osv-scanner-action/integration.mjs
