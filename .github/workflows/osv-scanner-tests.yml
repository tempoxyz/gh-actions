name: Native OSV Tests

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  native:
    name: Native OSV (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@a4fa1d51aa4014d86628f43b1dff8ba88219e04d # 2026-10-15T00-03-55Z-a4fa1d51
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          persist-credentials: false
      - name: Unit tests
        shell: bash
        run: node --test actions/osv-scanner-action/*.test.js
      - name: Verify native installation, scanning, and reporting
        shell: bash
        run: node actions/osv-scanner-action/integration.mjs
