name: Native OSV Tests

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  native:
    name: Native OSV (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@aaec1d2a49380949d267946d343f0cb9440248b7 # 2026-10-16T03-27-40Z-aaec1d2a
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          persist-credentials: false
      - name: Unit tests
        shell: bash
        run: node --test actions/osv-scanner-action/*.test.js
      - name: Verify native installation, scanning, and reporting
        shell: bash
        run: node actions/osv-scanner-action/integration.mjs
