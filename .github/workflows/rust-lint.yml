name: rust lint

on:
  workflow_call:
    inputs:
      run-clippy:
        description: Run cargo clippy.
        required: false
        type: boolean
        default: true
      run-fmt:
        description: Run cargo fmt.
        required: false
        type: boolean
        default: true
      run-typos:
        description: Run typos.
        required: false
        type: boolean
        default: true
      run-deny:
        description: Run cargo deny.
        required: false
        type: boolean
        default: true
      clippy-runner:
        description: Runner used for cargo clippy.
        required: false
        type: string
        default: depot-ubuntu-latest-4
      fmt-runner:
        description: Runner used for cargo fmt.
        required: false
        type: string
        default: depot-ubuntu-latest
      typos-runner:
        description: Runner used for typos.
        required: false
        type: string
        default: depot-ubuntu-latest
      deny-runner:
        description: Runner used for cargo deny.
        required: false
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Timeout for each lint job.
        required: false
        type: number
        default: 30
      checkout-submodules:
        description: Submodule checkout mode passed to actions/checkout.
        required: false
        type: string
        default: "false"
      rust-toolchain:
        description: Rust toolchain used for clippy and fmt.
        required: false
        type: string
        default: nightly
      deny-rust-toolchain:
        description: Rust toolchain installed on the deny runner and used inside the cargo-deny container.
        required: false
        type: string
        default: stable
      clippy-flags:
        description: Flags passed to cargo clippy.
        required: false
        type: string
        default: --all-targets --all-features --locked
      fmt-flags:
        description: Flags passed to cargo fmt.
        required: false
        type: string
        default: --all --check
      deny-flags:
        description: Additional flags passed to cargo deny check all.
        required: false
        type: string
        default: --all-features
permissions:
  id-token: write

jobs:
  clippy:
    if: ${{ inputs.run-clippy }}
    uses: ./.github/workflows/rust-clippy.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    permissions:
      id-token: write
      contents: read
    with:
      runner: ${{ inputs.clippy-runner }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      rust-toolchain: ${{ inputs.rust-toolchain }}
      flags: ${{ inputs.clippy-flags }}
      checkout-submodules: ${{ inputs.checkout-submodules }}

  fmt:
    if: ${{ inputs.run-fmt }}
    uses: ./.github/workflows/rust-fmt.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    permissions:
      id-token: write
      contents: read
    with:
      runner: ${{ inputs.fmt-runner }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      rust-toolchain: ${{ inputs.rust-toolchain }}
      flags: ${{ inputs.fmt-flags }}

  typos:
    if: ${{ inputs.run-typos }}
    uses: ./.github/workflows/rust-typos.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    permissions:
      id-token: write
      contents: read
    with:
      runner: ${{ inputs.typos-runner }}
      timeout-minutes: ${{ inputs.timeout-minutes }}

  deny:
    if: ${{ inputs.run-deny }}
    uses: ./.github/workflows/rust-deny.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    permissions:
      id-token: write
      contents: read
    with:
      runner: ${{ inputs.deny-runner }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      rust-toolchain: ${{ inputs.deny-rust-toolchain }}
      flags: ${{ inputs.deny-flags }}

  lint-success:
    name: lint success
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    if: always()
    needs:
      - clippy
      - fmt
      - typos
      - deny
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@392079a54ac0240e1b21417eca38b7c0a50bf55d # 2026-10-01T18-10-09Z-392079a5

      - name: Decide whether the needed jobs succeeded or failed
        uses: tempoxyz/gh-actions/actions/check-needs@392079a54ac0240e1b21417eca38b7c0a50bf55d # 2026-10-01T18-10-09Z-392079a5
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: >-
            ${{ !inputs.run-clippy && 'clippy' || '' }}
            ${{ !inputs.run-fmt && 'fmt' || '' }}
            ${{ !inputs.run-typos && 'typos' || '' }}
            ${{ !inputs.run-deny && 'deny' || '' }}
