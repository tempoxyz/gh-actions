name: rust fmt

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: Rust toolchain used for cargo fmt.
        required: false
        type: string
        default: nightly
      flags:
        description: Flags passed to cargo fmt.
        required: false
        type: string
        default: --all --check
      runner:
        description: Runner used for cargo fmt.
        required: false
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Timeout for each job.
        required: false
        type: number
        default: 30

permissions: {}

jobs:
  fmt:
    # A relative reusable-workflow reference uses the same commit as this wrapper.
    uses: tempoxyz/gh-actions/.github/workflows/rust-lint.yml@e8f9d5c23ab43d0645c6d50fb73e98b362cdec02 # 2026-09-22T08-14-13Z-e8f9d5c2
    permissions:
      contents: read
      id-token: write
    with:
      run-clippy: false
      run-fmt: true
      run-typos: false
      run-deny: false
      rust-toolchain: ${{ inputs.rust-toolchain }}
      fmt-flags: ${{ inputs.flags }}
      fmt-runner: ${{ inputs.runner }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
