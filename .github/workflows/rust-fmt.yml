name: rust fmt

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: Rust toolchain used for cargo fmt.
        required: false
        type: string
        default: nightly
      flags:
        description: Flags passed to cargo fmt.
        required: false
        type: string
        default: --all --check
      runner:
        description: Runner used for cargo fmt.
        required: false
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Timeout for each job.
        required: false
        type: number
        default: 30

permissions: {}

jobs:
  fmt:
    # Call the reusable workflow at the published, pinned commit.
    uses: tempoxyz/gh-actions/.github/workflows/rust-lint.yml@ee2960a6cc25d99bda45614135bfe1197d879bac # 2026-09-26T06-46-03Z-ee2960a6
    permissions:
      contents: read
      id-token: write
    with:
      run-clippy: false
      run-fmt: true
      run-typos: false
      run-deny: false
      rust-toolchain: ${{ inputs.rust-toolchain }}
      fmt-flags: ${{ inputs.flags }}
      fmt-runner: ${{ inputs.runner }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
