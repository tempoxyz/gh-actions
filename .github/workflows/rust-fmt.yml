name: rust fmt

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: Rust toolchain used for cargo fmt.
        required: false
        type: string
        default: nightly
      flags:
        description: Flags passed to cargo fmt.
        required: false
        type: string
        default: --all --check
      runner:
        description: Runner used for cargo fmt.
        required: false
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Timeout for each job.
        required: false
        type: number
        default: 30

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  fmt:
    name: fmt
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@68a1e4645c9596fee5398dd1e2ba07f0a4aa6a71 # 2026-10-20T04-40-18Z-68a1e464

      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        env:
          RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - name: Run fmt
        run: |
          # FMT_FLAGS is a space-separated flag list that must word-split.
          # shellcheck disable=SC2086
          cargo fmt $FMT_FLAGS
        env:
          FMT_FLAGS: ${{ inputs.flags }}
