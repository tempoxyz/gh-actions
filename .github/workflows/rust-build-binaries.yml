name: rust build binaries

on:
  workflow_call:
    inputs:
      binaries:
        description: Newline-separated binary names to build and upload.
        required: true
        type: string
      profile:
        description: Cargo build profile.
        required: true
        type: string
      runs-on:
        description: Runner used for build jobs.
        required: false
        type: string
        default: depot-ubuntu-latest-16
      timeout-minutes:
        description: Timeout for each build job.
        required: false
        type: number
        default: 60
      rust-toolchain:
        description: Rust toolchain used for builds.
        required: false
        type: string
        default: stable
      checkout-submodules:
        description: Submodule checkout mode passed to actions/checkout.
        required: false
        type: string
        default: "false"
      artifact-path-template:
        description: Artifact path template. Use {profile} and {binary} placeholders.
        required: false
        type: string
        default: target/{profile}/{binary}
      retention-days:
        description: Artifact retention in days.
        required: false
        type: number
        default: 7

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  resolve:
    name: resolve binaries
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      binaries: ${{ steps.binaries.outputs.json }}
    steps:
      - name: Resolve binary matrix
        id: binaries
        env:
          BINARIES: ${{ inputs.binaries }}
        run: |
          json=$(
            printf '%s\n' "$BINARIES" \
              | jq -R -s -c 'split("\n") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))'
          )
          if [ "$json" = "[]" ]; then
            echo "::error::binaries input must contain at least one binary"
            exit 1
          fi
          echo "json=$json" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.binary }})
    needs: resolve
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      RUSTC_WRAPPER: sccache
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        binary: ${{ fromJSON(needs.resolve.outputs.binaries) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.checkout-submodules }}
      - name: Install Rust toolchain
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          toolchain: ${{ inputs.rust-toolchain }}
      - name: Install mold linker
        env:
          MOLD_VERSION: "2.42.0"
          MOLD_SHA256_X86_64: f5ed2f6e31d1ada4f07fe766fe0de7a73104d1c5cdc59086fcecc16a43720b6d
          MOLD_SHA256_AARCH64: 3c9a0a3624aac8a2007569ae50c33b3129a0f0ae8bcc974aeee2f8939d295190
        run: |
          set -euo pipefail
          # mold publishes no checksums, signatures or attestations, so the release tarball digests
          # are pinned here and change together with MOLD_VERSION (test.yml keeps this block in
          # step with the copy in .github/workflows/rust-build-binaries.yml).
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64)  EXPECTED="$MOLD_SHA256_X86_64" ;;
            aarch64) EXPECTED="$MOLD_SHA256_AARCH64" ;;
            *) echo "::error::mold: unsupported architecture $ARCH"; exit 1 ;;
          esac
          ASSET="mold-${MOLD_VERSION}-${ARCH}-linux.tar.gz"
          TMP="${RUNNER_TEMP:?}/mold"
          mkdir -p "$TMP"
          curl -fsSL --retry 3 -o "$TMP/$ASSET" "https://github.com/rui314/mold/releases/download/v${MOLD_VERSION}/${ASSET}"
          echo "$EXPECTED  $TMP/$ASSET" | sha256sum -c
          SUDO=""
          [ "$(id -u)" = 0 ] || SUDO=sudo
          $SUDO tar -C /usr/local --strip-components=1 --no-overwrite-dir -xzf "$TMP/$ASSET"
          # Make mold the default linker, as rui314/setup-mold did.
          if [ "$(realpath /usr/bin/ld)" != /usr/local/bin/mold ]; then
            $SUDO ln -sf /usr/local/bin/mold "$(realpath /usr/bin/ld)"
          fi
          mold --version
      - name: Enable sccache
        uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@6f436eb3a168279692739e8c0c9fdb52b94bfae7
      - name: Build
        env:
          BINARY: ${{ matrix.binary }}
          PROFILE: ${{ inputs.profile }}
        run: cargo build --bin "$BINARY" --profile "$PROFILE"
      - name: Resolve artifact path
        id: artifact
        env:
          TEMPLATE: ${{ inputs.artifact-path-template }}
          BINARY: ${{ matrix.binary }}
          PROFILE: ${{ inputs.profile }}
        run: |
          path="${TEMPLATE//\{profile\}/$PROFILE}"
          path="${path//\{binary\}/$BINARY}"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: binary-upload
        with:
          if-no-files-found: error
          name: ${{ matrix.binary }}
          path: ${{ steps.artifact.outputs.path }}
          retention-days: ${{ inputs.retention-days }}
