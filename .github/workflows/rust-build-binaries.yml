name: rust build binaries

on:
  workflow_call:
    inputs:
      binaries:
        description: Newline-separated binary names to build and upload.
        required: true
        type: string
      profile:
        description: Cargo build profile.
        required: true
        type: string
      runs-on:
        description: Runner used for build jobs.
        required: false
        type: string
        default: depot-ubuntu-latest-16
      timeout-minutes:
        description: Timeout for each build job.
        required: false
        type: number
        default: 60
      rust-toolchain:
        description: Rust toolchain used for builds.
        required: false
        type: string
        default: stable
      checkout-submodules:
        description: Submodule checkout mode passed to actions/checkout.
        required: false
        type: string
        default: "false"
      artifact-path-template:
        description: Artifact path template. Use {profile} and {binary} placeholders.
        required: false
        type: string
        default: target/{profile}/{binary}
      retention-days:
        description: Artifact retention in days.
        required: false
        type: number
        default: 7
permissions:
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  resolve:
    name: resolve binaries
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    outputs:
      binaries: ${{ steps.binaries.outputs.json }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@68a1e4645c9596fee5398dd1e2ba07f0a4aa6a71 # 2026-10-20T04-40-18Z-68a1e464

      - name: Resolve binary matrix
        id: binaries
        env:
          BINARIES: ${{ inputs.binaries }}
        run: |
          json=$(
            printf '%s\n' "$BINARIES" \
              | jq -R -s -c 'split("\n") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))'
          )
          if [ "$json" = "[]" ]; then
            echo "::error::binaries input must contain at least one binary"
            exit 1
          fi
          echo "json=$json" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.binary }})
    needs: resolve
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      RUSTC_WRAPPER: sccache
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        binary: ${{ fromJSON(needs.resolve.outputs.binaries) }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@68a1e4645c9596fee5398dd1e2ba07f0a4aa6a71 # 2026-10-20T04-40-18Z-68a1e464

      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          persist-credentials: false
          submodules: ${{ inputs.checkout-submodules }}
      - name: Install Rust toolchain
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@68a1e4645c9596fee5398dd1e2ba07f0a4aa6a71 # 2026-10-20T04-40-18Z-68a1e464
        with:
          toolchain: ${{ inputs.rust-toolchain }}
      - name: Install mold linker
        env:
          GH_TOKEN: ${{ github.token }}
          MOLD_VERSION: "2.42.1"
          MOLD_SHA256_X86_64: 6ff270c9bf07d2bec5c98aa324eb7c4daf6a1a4d815c05ff1708049616047855
          MOLD_SHA256_AARCH64: 16b025652d3d7456689e6025a77e1903bb2a15e7630877c26cc133f5df95b9c6
        run: |
          set -euo pipefail
          # BEGIN generated download-release helper
          # Source this file; each call isolates its traps and temporary files.
          download_release() (
            set -euo pipefail

            # Only the delivery route changes. The caller must verify the checksum and
            # release-workflow provenance before extracting or exposing these bytes.
            repository=${1:?repository required}
            tag=${2:?release tag required}
            asset=${3:?asset name required}
            destination=${4:?destination required}
            case "$repository" in
              suzuki-shunsuke/pinact|rhysd/actionlint|rui314/mold) ;;
              *) echo "::error::download-release: unsupported repository" >&2; exit 1 ;;
            esac
            if [[ ! "$tag" =~ ^[a-zA-Z0-9._-]+$ || ! "$asset" =~ ^[a-zA-Z0-9._-]+$ ]]; then
              echo "::error::download-release: invalid release tag or asset name" >&2
              exit 1
            fi

            # An interrupted transfer must never leave a partial file at the destination.
            partial=$(mktemp "${destination}.XXXXXX")
            download_pid=
            # shellcheck disable=SC2317,SC2329 # Called by the EXIT trap through cleanup.
            stop_download() {
              if [[ -n "$download_pid" ]]; then
                kill "$download_pid" 2>/dev/null || true
                for ((i = 0; i < 5; i++)); do
                  kill -0 "$download_pid" 2>/dev/null || break
                  sleep 1
                done
                if kill -0 "$download_pid" 2>/dev/null; then
                  kill -KILL "$download_pid" 2>/dev/null || true
                fi
                wait "$download_pid" 2>/dev/null || true
                download_pid=
              fi
            }
            # shellcheck disable=SC2317,SC2329 # Called indirectly by the EXIT trap.
            cleanup() {
              # Repeated cancellation must not interrupt the forced kill, wait or removal.
              trap '' INT TERM
              trap - EXIT
              stop_download
              rm -f "$partial"
              exit "$1"
            }
            trap 'cleanup "$?"' EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM
            status=0
            response=$(curl -fsSL --proto '=https' --proto-redir '=https' \
              --connect-timeout 10 --speed-limit 1024 --speed-time 60 --retry 3 --retry-max-time 180 \
              --write-out '%{http_code} %{http_connect}' -o "$partial" \
              "https://github.com/$repository/releases/download/$tag/$asset") || status=$?
            read -r http proxy <<< "$response"
            if [[ "$status" == 0 ]]; then
              mv "$partial" "$destination"
              exit 0
            fi

            # Missing assets, authorization denials and certificate errors are not outages
            # to route around. Retry only transient HTTP or interrupted transport failures.
            # A proxy CONNECT denial may be reported as curl 56 with HTTP 000. Check
            # both statuses before interpreting a curl transport error as recoverable.
            # A failed redirect connection retains the preceding 3xx response; allow that
            # only for the HTTP response, never for a refused proxy CONNECT.
            for field in http proxy; do
              case "$field:${!field}" in
                *:000|*:2[0-9][0-9]|*:408|*:429|*:500|*:502|*:503|*:504|http:301|http:302|http:303|http:307|http:308) ;;
                *)
                  echo "::error::download-release: $asset HTTP $http / proxy CONNECT $proxy; refusing fallback" >&2
                  exit "$status"
                  ;;
              esac
            done
            case "$status:$http" in
              22:408|22:429|22:500|22:502|22:503|22:504|6:*|7:*|18:*|28:*|52:*|55:*|56:*) ;;
              *)
                echo "::error::download-release: $asset download failed (curl $status, HTTP $http); refusing fallback" >&2
                exit "$status"
                ;;
            esac

            echo "::warning::download-release: $asset download failed (curl $status, HTTP $http); trying the official release asset API" >&2
            # The fixed repository, exact tag/name match and numeric ID keep the fallback
            # on this release. gh handles authentication without forwarding a token ourselves.
            query="select(.tag_name == \"$tag\" and .draft == false) | .assets[] | select(.name == \"$asset\") | .id"
            id=$(timeout --kill-after=5s 30s gh api --hostname github.com "repos/$repository/releases/tags/$tag" --jq "$query")
            if [[ ! "$id" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::download-release: release must contain exactly one asset named $asset" >&2
              exit 1
            fi
            # gh streams the response to disk. Bound inactivity rather than elapsed time,
            # so a large archive on a slow but progressing connection can finish.
            : > "$partial"
            gh api --hostname github.com -H 'Accept: application/octet-stream' \
              "repos/$repository/releases/assets/$id" > "$partial" &
            download_pid=$!
            last_size=0
            progress_at=$SECONDS
            while kill -0 "$download_pid" 2>/dev/null; do
              size=$(stat -c %s -- "$partial")
              if ((size > last_size)); then
                last_size=$size
                progress_at=$SECONDS
              fi
              if ((SECONDS - progress_at >= 60)) && kill -0 "$download_pid" 2>/dev/null; then
                echo "::error::download-release: $asset API download made no progress for 60 seconds" >&2
                exit 124
              fi
              sleep 1
            done
            status=0
            wait "$download_pid" || status=$?
            download_pid=
            if [[ "$status" != 0 ]]; then exit "$status"; fi
            mv "$partial" "$destination"
          )
          # END generated download-release helper
          # mold publishes no checksums, signatures or attestations, so the release tarball digests
          # are pinned here and change together with MOLD_VERSION (test.yml keeps this block in
          # step with the copy in .github/workflows/rust-build-binaries.yml).
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64)  EXPECTED="$MOLD_SHA256_X86_64" ;;
            aarch64) EXPECTED="$MOLD_SHA256_AARCH64" ;;
            *) echo "::error::mold: unsupported architecture $ARCH"; exit 1 ;;
          esac
          ASSET="mold-${MOLD_VERSION}-${ARCH}-linux.tar.gz"
          TMP="${RUNNER_TEMP:?}/mold"
          mkdir -p "$TMP"
          download_release rui314/mold "v${MOLD_VERSION}" "$ASSET" "$TMP/$ASSET"
          echo "$EXPECTED  $TMP/$ASSET" | sha256sum -c
          SUDO=""
          [ "$(id -u)" = 0 ] || SUDO=sudo
          $SUDO tar -C /usr/local --strip-components=1 --no-overwrite-dir -xzf "$TMP/$ASSET"
          # Make mold the default linker, as rui314/setup-mold did.
          if [ "$(realpath /usr/bin/ld)" != /usr/local/bin/mold ]; then
            $SUDO ln -sf /usr/local/bin/mold "$(realpath /usr/bin/ld)"
          fi
          mold --version
      - name: Enable sccache
        uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@68a1e4645c9596fee5398dd1e2ba07f0a4aa6a71 # 2026-10-20T04-40-18Z-68a1e464
      - name: Build
        env:
          BINARY: ${{ matrix.binary }}
          PROFILE: ${{ inputs.profile }}
        run: cargo build --locked --bin "$BINARY" --profile "$PROFILE"
      - name: Resolve artifact path
        id: artifact
        env:
          TEMPLATE: ${{ inputs.artifact-path-template }}
          BINARY: ${{ matrix.binary }}
          PROFILE: ${{ inputs.profile }}
        run: |
          path="${TEMPLATE//\{profile\}/$PROFILE}"
          path="${path//\{binary\}/$BINARY}"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: binary-upload
        with:
          if-no-files-found: error
          name: ${{ matrix.binary }}
          path: ${{ steps.artifact.outputs.path }}
          retention-days: ${{ inputs.retention-days }}
