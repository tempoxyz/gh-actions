name: dependencies

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: "Rust toolchain; same syntax as dtolnay/rust-toolchain"
        default: "nightly"
        required: false
        type: "string"
      title:
        description: "PR title"
        default: "chore(deps): weekly `cargo update`"
        required: false
        type: "string"

permissions: {}

env:
  BRANCH: cargo-update
  BODY: |
    Automation to keep dependencies in `Cargo.lock` current.

    <details><summary><strong>cargo update log</strong></summary>
    <p>

    ```log
    $cargo_update_log
    ```

    </p>
    </details>

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    # The update branch is pushed and the PR opened with a short-lived GitHub
    # App token minted via github-sts rather than the built-in GITHUB_TOKEN,
    # which is not allowed to create pull requests. Callers must grant these
    # permissions on the reusable-workflow job and carry a trust policy at
    # .github/sts/cargo-update-pr.sts.yaml granting contents: write and
    # pull_requests: write to their own workflow.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - name: cargo update
        # Remove first line that always just says "Updating crates.io index"
        run: cargo update --color never --verbose 2>&1 | sed '/crates.io index/d' | tee -a cargo_update.log

      - name: Craft commit message and PR body
        id: msg
        env:
          PR_TITLE: ${{ inputs.title }}
        run: |
          cargo_update_log="$(cat cargo_update.log)"
          export cargo_update_log

          {
            echo "commit_message<<EOF"
            printf "%s\n\n%s\n" "$PR_TITLE" "$cargo_update_log"
            echo "EOF"

            echo "body<<EOF"
            echo "$BODY" | envsubst
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Checked out at the reusable workflow's own revision (the label-prs
      # pattern), so the github-sts action always matches this workflow and
      # needs no separate SHA pin.
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gh-actions
          persist-credentials: false

      - name: Fetch GitHub token via STS
        id: sts
        uses: ./.gh-actions/actions/github-sts
        with:
          policy: cargo-update-pr

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.sts.outputs.token }}
          author: tempo-github-sts[bot] <312736176+tempo-github-sts[bot]@users.noreply.github.com>
          committer: tempo-github-sts[bot] <312736176+tempo-github-sts[bot]@users.noreply.github.com>
          add-paths: ./Cargo.lock
          commit-message: ${{ steps.msg.outputs.commit_message }}
          title: ${{ inputs.title }}
          body: ${{ steps.msg.outputs.body }}
          branch: ${{ env.BRANCH }}
