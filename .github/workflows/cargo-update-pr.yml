name: dependencies

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: "Rust toolchain; same syntax as dtolnay/rust-toolchain"
        default: "nightly"
        required: false
        type: "string"
      title:
        description: "PR title"
        default: "chore(deps): weekly `cargo update`"
        required: false
        type: "string"
      min-publish-age:
        description: "Cooldown: resolve only registry releases at least this old, e.g. `7 days` (Cargo's registry.global-min-publish-age); empty disables it"
        default: "7 days"
        required: false
        type: "string"
permissions:
  id-token: write

env:
  BRANCH: cargo-update
  BODY: |
    Automation to keep dependencies in `Cargo.lock` current.

    <details><summary><strong>cargo update log</strong></summary>
    <p>

    ```log
    $cargo_update_log
    ```

    </p>
    </details>

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    # The update branch is pushed and the PR opened with a short-lived GitHub
    # App token minted via github-sts rather than the built-in GITHUB_TOKEN,
    # which is not allowed to create pull requests. Callers must grant these
    # permissions on the reusable-workflow job and carry a trust policy at
    # .github/sts/cargo-update-pr.sts.yaml granting contents: write and
    # pull_requests: write to their own workflow.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@68a1e4645c9596fee5398dd1e2ba07f0a4aa6a71 # 2026-10-20T04-40-18Z-68a1e464

      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@68a1e4645c9596fee5398dd1e2ba07f0a4aa6a71 # 2026-10-20T04-40-18Z-68a1e464
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      # Cargo resolves only releases older than min-publish-age. Locked versions newer than that
      # (often a fix added with a policy exception) and packages no release within the cooldown
      # can satisfy are held at their locked version; everything else is updated.
      - name: cargo update
        env:
          MIN_PUBLISH_AGE: ${{ inputs.min-publish-age }}
        run: |
          set -euo pipefail
          if [ -n "$MIN_PUBLISH_AGE" ]; then
            # min-publish-age is stable since Cargo 1.100 (nightly needs no -Z flag); older Cargo
            # silently ignores the setting, so refuse to run without the cooldown.
            minor="$(cargo --version | sed -nE 's/^cargo 1\.([0-9]+).*/\1/p')"
            if [ -z "$minor" ] || [ "$minor" -lt 100 ]; then
              echo "::error::min-publish-age needs Cargo 1.100 or newer (or nightly); got $(cargo --version). Set min-publish-age: \"\" to update without a cooldown."
              exit 1
            fi
            export CARGO_REGISTRY_GLOBAL_MIN_PUBLISH_AGE="$MIN_PUBLISH_AGE"
          fi

          # Prints "yes" if name@version is yanked on crates.io, "no" if not, "unknown" otherwise.
          yanked() {
            local name="${1,,}" path
            case "${#name}" in
              1) path="1/$name" ;;
              2) path="2/$name" ;;
              3) path="3/${name:0:1}/$name" ;;
              *) path="${name:0:2}/${name:2:2}/$name" ;;
            esac
            local out
            if out="$(curl --proto '=https' --fail --silent --show-error --retry 3 "https://index.crates.io/$path" \
                | jq -r --arg v "$2" 'select(.vers == $v) | if .yanked then "yes" else "no" end')" && [ -n "$out" ]; then
              echo "$out"
            else
              echo unknown
            fi
          }

          # Packages kept at their locked version, by name, with the reason.
          declare -A held=()
          cp Cargo.lock Cargo.lock.orig
          for attempt in $(seq 1 10); do
            cp Cargo.lock.orig Cargo.lock
            args=()
            if [ "${#held[@]}" -gt 0 ]; then
              # Unlock every locked package with a source (registry, sparse or git) except the held
            # ones, by fully qualified package ID so duplicate names stay unambiguous. Read Cargo.lock
            # rather than `cargo metadata`, which leaves out dependencies of non-default features,
            # and write a file first so a failure stops the step instead of running a full update.
            python3 - "${!held[@]}" > update.specs <<'PY'
          import sys, tomllib
          held = set(sys.argv[1:])
          with open("Cargo.lock", "rb") as f:
              lock = tomllib.load(f)
          for pkg in lock.get("package", []):
              source = pkg.get("source")
              if source and pkg["name"] not in held:
                  print(source.split("#", 1)[0] + "#" + pkg["name"] + "@" + pkg["version"])
          PY
            while read -r id; do args+=(-p "$id"); done < update.specs
            if [ "${#args[@]}" = 0 ]; then
              echo "::error::no unheld packages to update"
              exit 1
            fi
          fi
            if ! cargo update --color never --verbose "${args[@]}" > update.out 2>&1; then
              # A requirement only releases newer than the cooldown can meet (for example, every older
              # compatible version was yanked) fails the whole update: hold that package instead.
              pkg="$(sed -nE 's/^error: failed to select a version for the requirement .([^ ]+) = .*/\1/p' update.out | head -n1)"
              if [ -z "$pkg" ] || [ -n "${held[$pkg]:-}" ] || [ "$attempt" = 10 ]; then
                cat update.out
                exit 1
              fi
              held[$pkg]="no release satisfies its requirement within the cooldown"
              continue
            fi
            # The cooldown also downgrades locked versions younger than it. Those were reviewed when
            # they went in (often a fix added with a policy exception), so hold them, unless the locked
            # version was yanked, in which case Cargo is right to move off it.
            added=0
            while read -r name old; do
              if [ -n "${held[$name]:-}" ]; then continue; fi
              case "$(yanked "$name" "$old")" in
                no) held[$name]="locked v$old is newer than the cooldown"; added=1 ;;
                yes) ;;
                *) echo "::warning::could not check whether $name v$old is yanked; letting Cargo downgrade it" ;;
              esac
            done < <(sed -nE 's/^ *Downgrading ([^ ]+) v([^ ]+) -> .*/\1 \2/p' update.out)
            if [ "$added" = 0 ]; then break; fi
            if [ "$attempt" = 10 ]; then
              echo "::error::cargo update did not settle after $attempt attempts"
              exit 1
            fi
          done
          rm -f Cargo.lock.orig

          # Remove the line that always just says "Updating crates.io index"
          sed '/crates.io index/d' update.out > cargo_update.log
          rm -f update.out update.specs
          if [ "${#held[@]}" -gt 0 ]; then
            {
              echo
              echo "Held at their locked versions:"
              for name in "${!held[@]}"; do echo "  $name: ${held[$name]}"; done | sort
            } >> cargo_update.log
          fi
          cat cargo_update.log

      # The first-party PR action below fails when there is nothing to commit, so skip the
      # remaining steps when `cargo update` left Cargo.lock untouched.
      - name: Detect Cargo.lock changes
        id: changes
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already up to date; no pull request needed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Craft PR body
        if: steps.changes.outputs.changed == 'true'
        id: msg
        run: |
          cargo_update_log="$(cat cargo_update.log)"
          export cargo_update_log

          {
            echo "body<<EOF"
            echo "$BODY" | envsubst
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch GitHub token via STS
        if: steps.changes.outputs.changed == 'true'
        id: sts
        uses: tempoxyz/gh-actions/actions/github-sts@68a1e4645c9596fee5398dd1e2ba07f0a4aa6a71 # 2026-10-20T04-40-18Z-68a1e464
        with:
          policy: cargo-update-pr

      # First-party replacement for peter-evans/create-pull-request. The commit is created
      # server-side, authored by the STS App and signed by GitHub, so author/committer inputs are
      # not needed. The composite takes a single-line commit headline; the cargo update log stays
      # in the PR body.
      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: tempoxyz/gh-actions/actions/create-pull-request@68a1e4645c9596fee5398dd1e2ba07f0a4aa6a71 # 2026-10-20T04-40-18Z-68a1e464
        with:
          token: ${{ steps.sts.outputs.token }}
          branch: ${{ env.BRANCH }}
          commit-message: ${{ inputs.title }}
          title: ${{ inputs.title }}
          body: ${{ steps.msg.outputs.body }}
          add-paths: Cargo.lock
