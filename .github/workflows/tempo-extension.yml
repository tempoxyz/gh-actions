name: tempo extension

# Builds a `tempo` CLI extension (`tempo <name>` runs the `tempo-<name>` binary)
# for each target, and when publishing signs, attests, and uploads the binaries
# and a minisign-signed manifest to cli.tempo.xyz, where the launcher installs
# them from. The caller supplies the build command; this workflow owns
# checksums, SBOMs, provenance, signing, and upload.

on:
  workflow_call:
    inputs:
      package:
        description: Extension binary name, `tempo-<name>`. Users run it as `tempo <name>`.
        required: true
        type: string
      version:
        description: Release version without a leading `v`, for example `0.17.0`.
        required: true
        type: string
      description:
        description: One-line description written into the signed manifest.
        required: true
        type: string
      build-command:
        description: >-
          Command that writes one target's binary to `$EXTENSION_OUTPUT`. It runs from the
          repository root with `EXTENSION_PACKAGE`, `EXTENSION_VERSION`, `EXTENSION_OS`
          (`linux` or `darwin`), `EXTENSION_ARCH` (`amd64` or `arm64`), `EXTENSION_SUFFIX`
          (`<os>-<arch>`), and `EXTENSION_OUTPUT` set.
        required: true
        type: string
      ref:
        description: Ref of the calling repository to build. Defaults to the triggering commit.
        required: false
        type: string
        default: ""
      install-command:
        description: Dependency install command run before each build.
        required: false
        type: string
        default: pnpm install --frozen-lockfile
      node-version:
        description: Node.js version for the build. pnpm comes from corepack and the `packageManager` field.
        required: false
        type: string
        default: "22"
      targets:
        description: Whitespace-separated targets from `linux-amd64 linux-arm64 darwin-amd64 darwin-arm64`.
        required: false
        type: string
        default: linux-amd64 linux-arm64 darwin-amd64 darwin-arm64
      smoke-test-args:
        description: Arguments passed to each binary its build host can run. Empty skips the smoke test.
        required: false
        type: string
        default: --version
      skill-file:
        description: Optional agent skill (`SKILL.md`) path, signed into the manifest and published beside it.
        required: false
        type: string
        default: ""
      publish:
        description: Sign, attest, and publish. When false, only build and upload workflow artifacts.
        required: false
        type: boolean
        default: false
      artifact-run-id:
        description: Previous main-branch run whose attested build artifacts should be reused. Zero builds fresh artifacts.
        required: false
        type: number
        default: 0
      promote-latest:
        description: Update latest pointers after uploading immutable versioned objects. Disable for manual recovery.
        required: false
        type: boolean
        default: true
      environment:
        description: GitHub environment that holds the publishing secrets.
        required: false
        type: string
        default: release
      base-url:
        description: Public base URL extensions are served from.
        required: false
        type: string
        default: https://cli.tempo.xyz/extensions
      bucket:
        description: R2 bucket behind `base-url`.
        required: false
        type: string
        default: tempo-cli
      cloudflare-sts-policy:
        description: >-
          Cloudflare STS trust policy that mints a short-lived R2 token for `bucket`. Required when
          publishing.
        required: false
        type: string
        default: ""
      cloudflare-sts-account:
        description: Cloudflare account alias that owns `bucket`.
        required: false
        type: string
        default: prd
    # Keep this in the caller's `environment` under exactly this name: a job that declares
    # an environment reads its secrets directly, and callers cannot pass environment secrets.
    secrets:
      RELEASE_SIGNING_KEY:
        description: Base64-encoded minisign secret key for extension manifests. Required when publishing.
        required: false

permissions: {}

jobs:
  resolve:
    name: resolve targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    outputs:
      matrix: ${{ steps.matrix.outputs.json }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d3efa0f3c3121a949e342d9a52240f988fbfd4ee # 2026-10-01T21-14-33Z-d3efa0f3

      - name: Validate inputs and resolve the build matrix
        id: matrix
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
          PACKAGE: ${{ inputs.package }}
          TARGETS: ${{ inputs.targets }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::artifact-run-id must be a nonnegative integer"
            exit 1
          fi
          # Both values become R2 object keys and manifest URLs, so keep them path-safe.
          if [[ ! "$PACKAGE" =~ ^tempo-[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::package must look like tempo-<name>, got: $PACKAGE"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::version must be semver without a leading v, got: $VERSION"
            exit 1
          fi
          # macos-latest is arm64, so darwin-amd64 is cross-built and not smoke tested.
          include='[]'
          for target in $TARGETS; do
            case "$target" in
              linux-amd64) runner=ubuntu-latest; runnable=true ;;
              linux-arm64) runner=ubuntu-24.04-arm; runnable=true ;;
              darwin-amd64) runner=macos-latest; runnable=false ;;
              darwin-arm64) runner=macos-latest; runnable=true ;;
              *) echo "::error::unsupported target: $target"; exit 1 ;;
            esac
            include=$(jq -c \
              --arg suffix "$target" --arg runner "$runner" --argjson runnable "$runnable" \
              '. + [{suffix: $suffix, os: ($suffix | split("-")[0]), arch: ($suffix | split("-")[1]), runner: $runner, runnable: $runnable}]' \
              <<<"$include")
          done
          if [ "$include" = '[]' ]; then
            echo "::error::targets must name at least one target"
            exit 1
          fi
          echo "json={\"include\":$include}" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.suffix }})
    needs: resolve
    if: inputs.artifact-run-id == 0
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      EXTENSION_ARCH: ${{ matrix.arch }}
      EXTENSION_OS: ${{ matrix.os }}
      EXTENSION_OUTPUT: artifacts/${{ inputs.package }}-${{ matrix.suffix }}
      EXTENSION_PACKAGE: ${{ inputs.package }}
      EXTENSION_SUFFIX: ${{ matrix.suffix }}
      EXTENSION_VERSION: ${{ inputs.version }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d3efa0f3c3121a949e342d9a52240f988fbfd4ee # 2026-10-01T21-14-33Z-d3efa0f3

      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@7f84f1d52d0c56afb45c62fee31a93b843cea4d6 # Untagged upstream snapshot from 2026-09-25
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        timeout-minutes: 10
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$INSTALL_COMMAND"

      - name: Build
        timeout-minutes: 15
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$EXTENSION_OUTPUT")"
          bash -euo pipefail -c "$BUILD_COMMAND"
          if [ ! -x "$EXTENSION_OUTPUT" ]; then
            echo "::error::build-command did not write an executable to $EXTENSION_OUTPUT"
            exit 1
          fi

      - name: Smoke test
        if: matrix.runnable && inputs.smoke-test-args != ''
        env:
          SMOKE_TEST_ARGS: ${{ inputs.smoke-test-args }}
        run: |
          set -euo pipefail
          # Word splitting is intended: the input is an argument list.
          # shellcheck disable=SC2086
          "./$EXTENSION_OUTPUT" $SMOKE_TEST_ARGS

      - name: Generate sha256
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$EXTENSION_OUTPUT" > "$EXTENSION_OUTPUT.sha256"
          else
            shasum -a 256 "$EXTENSION_OUTPUT" > "$EXTENSION_OUTPUT.sha256"
          fi
          cat "$EXTENSION_OUTPUT.sha256"

      - name: Generate SBOM (SPDX-JSON)
        if: inputs.publish
        uses: tempoxyz/gh-actions/vendor/anchore/sbom-action@392079a54ac0240e1b21417eca38b7c0a50bf55d # 2026-10-01T18-10-09Z-392079a5
        with:
          file: ${{ env.EXTENSION_OUTPUT }}
          format: spdx-json
          output-file: ${{ env.EXTENSION_OUTPUT }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        if: inputs.publish
        uses: actions/attest@a0eb68d51f3a5d373e107cfa9c8455ba800479cd # main
        with:
          subject-path: ${{ env.EXTENSION_OUTPUT }}
          sbom-path: ${{ env.EXTENSION_OUTPUT }}.spdx.json

      - name: Attest build provenance (SLSA v1)
        if: inputs.publish
        uses: actions/attest@a0eb68d51f3a5d373e107cfa9c8455ba800479cd # main
        with:
          subject-path: ${{ env.EXTENSION_OUTPUT }}

      - name: Install cosign
        if: inputs.publish
        uses: tempoxyz/gh-actions/vendor/sigstore/cosign-installer@392079a54ac0240e1b21417eca38b7c0a50bf55d # 2026-10-01T18-10-09Z-392079a5

      - name: Sign binary with cosign (keyless)
        if: inputs.publish
        run: cosign sign-blob --yes --bundle "$EXTENSION_OUTPUT.sigstore.json" "$EXTENSION_OUTPUT"

      - name: Record artifact source and checksums
        if: inputs.publish
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const childProcess = require('node:child_process');
          const path = require('node:path');
          const output = process.env.EXTENSION_OUTPUT;
          const files = Object.fromEntries(fs.readdirSync('artifacts').filter(name => name.startsWith(path.basename(output))).sort().map(name => [name, crypto.createHash('sha256').update(fs.readFileSync(path.join('artifacts', name))).digest('hex')]));
          const source = childProcess.execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          fs.writeFileSync(`${output}.receipt.json`, JSON.stringify({files, package: process.env.EXTENSION_PACKAGE, run: process.env.GITHUB_RUN_ID, source, version: process.env.EXTENSION_VERSION}));
          NODE

      - name: Attest artifact receipt
        if: inputs.publish
        uses: actions/attest@a0eb68d51f3a5d373e107cfa9c8455ba800479cd # main
        with:
          subject-path: ${{ env.EXTENSION_OUTPUT }}.receipt.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: ${{ inputs.package }}-${{ matrix.suffix }}
          path: artifacts/${{ inputs.package }}-${{ matrix.suffix }}*

  # Reusable-workflow permissions are checked for every job, skipped or not, so publishing
  # stays read-only and build-only callers need no write access to contents.
  publish:
    name: publish
    needs: [resolve, build]
    if: always() && !cancelled() && inputs.publish && needs.resolve.result == 'success' && (needs.build.result == 'success' || (inputs.artifact-run-id > 0 && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
    env:
      AWS_MAX_ATTEMPTS: "10"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RETRY_MODE: standard
      PACKAGE: ${{ inputs.package }}
      SKILL_FILE: ${{ inputs.skill-file }}
      URL_PREFIX: ${{ inputs.base-url }}/${{ inputs.package }}
      VERSION: ${{ inputs.version }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
      TARGETS: ${{ inputs.targets }}
      PROMOTE_LATEST: ${{ inputs.promote-latest }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d3efa0f3c3121a949e342d9a52240f988fbfd4ee # 2026-10-01T21-14-33Z-d3efa0f3

      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # main
        with:
          merge-multiple: true
          path: artifacts
          pattern: ${{ inputs.package }}-*
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact-run-id > 0 && inputs.artifact-run-id || github.run_id }}

      - name: Verify saved artifact provenance and checksums
        if: inputs.artifact-run-id > 0
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" > "$RUNNER_TEMP/artifact-run.json"
          jq -e --arg branch "$default_branch" '.head_branch == $branch and (.event == "workflow_run" or .event == "workflow_dispatch" or .event == "push")' "$RUNNER_TEMP/artifact-run.json" >/dev/null
          for target in $TARGETS; do
            receipt="artifacts/${PACKAGE}-${target}.receipt.json"
            gh attestation verify "$receipt" --repo "$GITHUB_REPOSITORY" --signer-workflow tempoxyz/gh-actions/.github/workflows/tempo-extension.yml --source-ref "refs/heads/$default_branch"
          done
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const childProcess = require('node:child_process');
          const path = require('node:path');
          const source = childProcess.execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          const allowed = new Set();
          for (const target of process.env.TARGETS.trim().split(/\s+/)) {
            const prefix = `${process.env.PACKAGE}-${target}`;
            const receiptName = `${prefix}.receipt.json`;
            const receipt = JSON.parse(fs.readFileSync(path.join('artifacts', receiptName), 'utf8'));
            if (receipt.source !== source || receipt.version !== process.env.VERSION || receipt.package !== process.env.PACKAGE || receipt.run !== process.env.ARTIFACT_RUN_ID) throw new Error(`Artifact source mismatch: ${target}`);
            for (const name of [prefix, `${prefix}.sha256`, `${prefix}.spdx.json`, `${prefix}.sigstore.json`]) if (!receipt.files[name]) throw new Error(`Incomplete artifact: ${name}`);
            for (const [name, digest] of Object.entries(receipt.files)) {
              if (path.basename(name) !== name || !name.startsWith(prefix) || !/^[0-9a-f]{64}$/.test(digest)) throw new Error(`Invalid receipt file: ${name}`);
              const actual = crypto.createHash('sha256').update(fs.readFileSync(path.join('artifacts', name))).digest('hex');
              if (actual !== digest) throw new Error(`Artifact checksum mismatch: ${name}`);
              allowed.add(name);
            }
            allowed.add(receiptName);
          }
          for (const name of fs.readdirSync('artifacts')) if (!allowed.has(name)) throw new Error(`Unexpected artifact: ${name}`);
          NODE

      - name: Check publishing inputs
        env:
          CLOUDFLARE_STS_POLICY: ${{ inputs.cloudflare-sts-policy }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::publishing needs the RELEASE_SIGNING_KEY secret"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_STS_POLICY" ]; then
            echo "::error::publishing needs the cloudflare-sts-policy input"
            exit 1
          fi
          if [ -n "$SKILL_FILE" ] && [ ! -f "$SKILL_FILE" ]; then
            echo "::error::skill-file not found: $SKILL_FILE"
            exit 1
          fi

      - name: Checkout release signing tool
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          path: wallet-release-tools
          persist-credentials: false
          # wallet-rs is archived, so this last commit is final; `tempo-sign` still builds from it.
          ref: e8e37d999324ac3619f26d9b8485803310af52a1 # main
          repository: tempoxyz/wallet-rs

      - name: Build release signer
        timeout-minutes: 20
        working-directory: wallet-release-tools
        run: |
          set -euo pipefail
          rustup default stable
          cargo build --locked --release -p tempo-sign

      - name: Sign manifest
        env:
          DESCRIPTION: ${{ inputs.description }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          key="${RUNNER_TEMP:?}/release.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s' "$RELEASE_SIGNING_KEY" | base64 -d > "$key")

          args=(
            --key-file "$key"
            --artifacts-dir artifacts
            --version "$VERSION"
            --base-url "$URL_PREFIX"
            --description "$DESCRIPTION"
            --output "artifacts/${PACKAGE}-manifest.json"
          )
          if [ -n "$SKILL_FILE" ]; then
            args+=(
              --skill "${URL_PREFIX}/v${VERSION}/SKILL.md"
              --skill-sha256 "$(sha256sum "$SKILL_FILE" | cut -d' ' -f1)"
              --skill-file "$SKILL_FILE"
            )
          fi
          ./wallet-release-tools/target/release/tempo-sign sign "${args[@]}"

      # Mint the token only after the slow signer build so its lifetime covers just the upload.
      - name: Fetch R2 token
        id: cloudflare-sts
        uses: tempoxyz/gh-actions/actions/cloudflare-sts@392079a54ac0240e1b21417eca38b7c0a50bf55d # 2026-10-01T18-10-09Z-392079a5
        with:
          account: ${{ inputs.cloudflare-sts-account }}
          policy: ${{ inputs.cloudflare-sts-policy }}
          ttl: 20m

      - name: Derive R2 credentials
        env:
          ACCOUNT_ID: ${{ steps.cloudflare-sts.outputs.account-id }}
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare-sts.outputs.token }}
        run: |
          set -euo pipefail
          # R2 S3 credentials are the token ID and the SHA-256 of the token value:
          # https://developers.cloudflare.com/r2/api/tokens/#get-s3-api-credentials-from-an-api-token
          access_key_id=$(curl -fsS --retry 3 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/tokens/verify" | jq -er '.result.id')
          secret_access_key=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$access_key_id"
          echo "::add-mask::$secret_access_key"
          {
            echo "AWS_ACCESS_KEY_ID=${access_key_id}"
            echo "AWS_ENDPOINT_URL=https://${ACCOUNT_ID}.r2.cloudflarestorage.com"
            echo "AWS_SECRET_ACCESS_KEY=${secret_access_key}"
          } >> "$GITHUB_ENV"

      - name: Upload to R2
        timeout-minutes: 10
        env:
          BUCKET: ${{ inputs.bucket }}
        run: |
          set -euo pipefail

          # Object keys mirror the public URL path: https://host/extensions/tempo-x -> extensions/tempo-x.
          prefix="${URL_PREFIX#*://*/}"
          versioned="${prefix}/v${VERSION}"

          # Versioned objects are immutable. A conditional PutObject (If-None-Match: *) writes only
          # when the key is absent, so no publish can replace one; it must be a single PUT because
          # R2 accepts no conditions on multipart completion.
          put_immutable() {
            local source="$1" key="$2" content_type="${3:-}"
            local attempt output local_sha remote_sha
            local -a args=(s3api put-object --bucket "$BUCKET" --key "$key" --body "$source" --if-none-match '*')
            [ -z "$content_type" ] || args+=(--content-type "$content_type")
            for attempt in 1 2 3; do
              if output=$(aws "${args[@]}" 2>&1 >/dev/null); then
                echo "Uploaded ${key}"
                return 0
              fi
              # 412 means the key exists: a rerun of the same build matches byte for byte.
              if grep -q PreconditionFailed <<<"$output"; then
                local_sha=$(sha256sum "$source" | cut -d' ' -f1)
                remote_sha=$(aws s3 cp "s3://${BUCKET}/${key}" - --only-show-errors | sha256sum | cut -d' ' -f1)
                if [ "$remote_sha" = "$local_sha" ]; then
                  echo "Verified existing immutable object: ${key}"
                  return 0
                fi
                echo "::error::immutable object collision at ${key} (expected ${local_sha}, found ${remote_sha})"
                return 1
              fi
              echo "::warning::upload failed for ${key} (attempt ${attempt}/3): ${output}"
              [ "$attempt" -eq 3 ] || sleep $((attempt * 10))
            done
            echo "::error::upload failed after 3 attempts: ${key}"
            return 1
          }

          # The latest pointers are meant to move, so they overwrite.
          put_latest() {
            local source="$1" key="$2" content_type="${3:-}"
            local -a args=(s3 cp "$source" "s3://${BUCKET}/${key}" --only-show-errors)
            [ -z "$content_type" ] || args+=(--content-type "$content_type")
            aws "${args[@]}"
          }

          for file in "artifacts/${PACKAGE}"-linux-* "artifacts/${PACKAGE}"-darwin-*; do
            [ -f "$file" ] || continue
            # Receipts bind CI provenance, not public release content or immutable R2 keys.
            [[ "$file" == *.receipt.json ]] && continue
            put_immutable "$file" "${versioned}/$(basename "$file")"
          done
          put_immutable "artifacts/${PACKAGE}-manifest.json" "${versioned}/manifest.json"
          if [ -n "$SKILL_FILE" ]; then
            put_immutable "$SKILL_FILE" "${versioned}/SKILL.md" text/markdown
          fi

          # The latest pointers move last, after every versioned object exists.
          if [ "$PROMOTE_LATEST" = true ]; then
            put_latest "artifacts/${PACKAGE}-manifest.json" "${prefix}/manifest.json"
            printf '%s\n' "$VERSION" > "artifacts/${PACKAGE}-VERSION"
            put_latest "artifacts/${PACKAGE}-VERSION" "${prefix}/VERSION" text/plain
          else
            echo "Recovery uploaded versioned objects without changing latest pointers."
          fi

          echo "Released ${PACKAGE}@${VERSION}"
