name: tempo extension

# Builds a `tempo` CLI extension (`tempo <name>` runs the `tempo-<name>` binary)
# for each target, and when publishing signs, attests, and uploads the binaries
# and a minisign-signed manifest to cli.tempo.xyz, where the launcher installs
# them from. The caller supplies the build command; this workflow owns
# checksums, SBOMs, provenance, signing, and upload.

on:
  workflow_call:
    inputs:
      package:
        description: Extension binary name, `tempo-<name>`. Users run it as `tempo <name>`.
        required: true
        type: string
      version:
        description: Release version without a leading `v`, for example `0.17.0`.
        required: true
        type: string
      description:
        description: One-line description written into the signed manifest.
        required: true
        type: string
      build-command:
        description: >-
          Command that writes one target's binary to `$EXTENSION_OUTPUT`. It runs from the
          repository root with `EXTENSION_PACKAGE`, `EXTENSION_VERSION`, `EXTENSION_OS`
          (`linux` or `darwin`), `EXTENSION_ARCH` (`amd64` or `arm64`), `EXTENSION_SUFFIX`
          (`<os>-<arch>`), and `EXTENSION_OUTPUT` set.
        required: true
        type: string
      ref:
        description: Ref of the calling repository to build. Defaults to the triggering commit.
        required: false
        type: string
        default: ""
      install-command:
        description: Dependency install command run before each build.
        required: false
        type: string
        default: pnpm install --frozen-lockfile
      node-version:
        description: Node.js version for the build. pnpm comes from corepack and the `packageManager` field.
        required: false
        type: string
        default: "22"
      targets:
        description: Whitespace-separated targets from `linux-amd64 linux-arm64 darwin-amd64 darwin-arm64`.
        required: false
        type: string
        default: linux-amd64 linux-arm64 darwin-amd64 darwin-arm64
      smoke-test-args:
        description: Arguments passed to each binary its build host can run. Empty skips the smoke test.
        required: false
        type: string
        default: --version
      skill-file:
        description: Optional agent skill (`SKILL.md`) path, signed into the manifest and published beside it.
        required: false
        type: string
        default: ""
      publish:
        description: Sign, attest, and publish. When false, only build and upload workflow artifacts.
        required: false
        type: boolean
        default: false
      environment:
        description: GitHub environment that holds the publishing secrets.
        required: false
        type: string
        default: release
      base-url:
        description: Public base URL extensions are served from.
        required: false
        type: string
        default: https://cli.tempo.xyz/extensions
      bucket:
        description: R2 bucket behind `base-url`.
        required: false
        type: string
        default: tempo-cli
      signing-tool-ref:
        description: tempoxyz/wallet-rs commit that builds `tempo-sign`.
        required: false
        type: string
        default: e8e37d999324ac3619f26d9b8485803310af52a1
    secrets:
      RELEASE_SIGNING_KEY:
        description: Base64-encoded minisign secret key for extension manifests. Required when publishing.
        required: false
      R2_ACCESS_KEY_ID:
        description: R2 access key ID. Required when publishing.
        required: false
      R2_SECRET_ACCESS_KEY:
        description: R2 secret access key. Required when publishing.
        required: false
      CF_ACCOUNT_ID:
        description: Cloudflare account ID that owns the R2 bucket. Required when publishing.
        required: false

permissions: {}

jobs:
  resolve:
    name: resolve targets
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    outputs:
      matrix: ${{ steps.matrix.outputs.json }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Validate inputs and resolve the build matrix
        id: matrix
        env:
          PACKAGE: ${{ inputs.package }}
          TARGETS: ${{ inputs.targets }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Both values become R2 object keys and manifest URLs, so keep them path-safe.
          if [[ ! "$PACKAGE" =~ ^tempo-[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::package must look like tempo-<name>, got: $PACKAGE"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::version must be semver without a leading v, got: $VERSION"
            exit 1
          fi
          # macos-latest is arm64, so darwin-amd64 is cross-built and not smoke tested.
          include='[]'
          for target in $TARGETS; do
            case "$target" in
              linux-amd64) runner=ubuntu-latest; runnable=true ;;
              linux-arm64) runner=ubuntu-24.04-arm; runnable=true ;;
              darwin-amd64) runner=macos-latest; runnable=false ;;
              darwin-arm64) runner=macos-latest; runnable=true ;;
              *) echo "::error::unsupported target: $target"; exit 1 ;;
            esac
            include=$(jq -c \
              --arg suffix "$target" --arg runner "$runner" --argjson runnable "$runnable" \
              '. + [{suffix: $suffix, os: ($suffix | split("-")[0]), arch: ($suffix | split("-")[1]), runner: $runner, runnable: $runnable}]' \
              <<<"$include")
          done
          if [ "$include" = '[]' ]; then
            echo "::error::targets must name at least one target"
            exit 1
          fi
          echo "json={\"include\":$include}" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.suffix }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      EXTENSION_ARCH: ${{ matrix.arch }}
      EXTENSION_OS: ${{ matrix.os }}
      EXTENSION_OUTPUT: artifacts/${{ inputs.package }}-${{ matrix.suffix }}
      EXTENSION_PACKAGE: ${{ inputs.package }}
      EXTENSION_SUFFIX: ${{ matrix.suffix }}
      EXTENSION_VERSION: ${{ inputs.version }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$INSTALL_COMMAND"

      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$EXTENSION_OUTPUT")"
          bash -euo pipefail -c "$BUILD_COMMAND"
          if [ ! -x "$EXTENSION_OUTPUT" ]; then
            echo "::error::build-command did not write an executable to $EXTENSION_OUTPUT"
            exit 1
          fi

      - name: Smoke test
        if: matrix.runnable && inputs.smoke-test-args != ''
        env:
          SMOKE_TEST_ARGS: ${{ inputs.smoke-test-args }}
        run: |
          set -euo pipefail
          # Word splitting is intended: the input is an argument list.
          # shellcheck disable=SC2086
          "./$EXTENSION_OUTPUT" $SMOKE_TEST_ARGS

      - name: Generate sha256
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$EXTENSION_OUTPUT" > "$EXTENSION_OUTPUT.sha256"
          else
            shasum -a 256 "$EXTENSION_OUTPUT" > "$EXTENSION_OUTPUT.sha256"
          fi
          cat "$EXTENSION_OUTPUT.sha256"

      - name: Generate SBOM (SPDX-JSON)
        if: inputs.publish
        uses: tempoxyz/gh-actions/vendor/anchore/sbom-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          file: ${{ env.EXTENSION_OUTPUT }}
          format: spdx-json
          output-file: ${{ env.EXTENSION_OUTPUT }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.EXTENSION_OUTPUT }}
          sbom-path: ${{ env.EXTENSION_OUTPUT }}.spdx.json

      - name: Attest build provenance (SLSA v1)
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.EXTENSION_OUTPUT }}

      - name: Install cosign
        if: inputs.publish
        uses: tempoxyz/gh-actions/vendor/sigstore/cosign-installer@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Sign binary with cosign (keyless)
        if: inputs.publish
        run: cosign sign-blob --yes --bundle "$EXTENSION_OUTPUT.sigstore.json" "$EXTENSION_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: ${{ inputs.package }}-${{ matrix.suffix }}
          path: artifacts/${{ inputs.package }}-${{ matrix.suffix }}*

  # Reusable-workflow permissions are checked for every job, skipped or not, so publishing
  # stays read-only and build-only callers need no write access to contents.
  publish:
    name: publish
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_MAX_ATTEMPTS: "10"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RETRY_MODE: standard
      PACKAGE: ${{ inputs.package }}
      SKILL_FILE: ${{ inputs.skill-file }}
      URL_PREFIX: ${{ inputs.base-url }}/${{ inputs.package }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: artifacts
          pattern: ${{ inputs.package }}-*

      - name: Check publishing secrets
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in RELEASE_SIGNING_KEY R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY CF_ACCOUNT_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::publishing needs these secrets: ${missing[*]}"
            exit 1
          fi
          if [ -n "$SKILL_FILE" ] && [ ! -f "$SKILL_FILE" ]; then
            echo "::error::skill-file not found: $SKILL_FILE"
            exit 1
          fi

      - name: Checkout release signing tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wallet-release-tools
          persist-credentials: false
          ref: ${{ inputs.signing-tool-ref }}
          repository: tempoxyz/wallet-rs

      - name: Build release signer
        working-directory: wallet-release-tools
        run: |
          set -euo pipefail
          rustup default stable
          cargo build --locked --release -p tempo-sign

      - name: Sign manifest
        env:
          DESCRIPTION: ${{ inputs.description }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          key="${RUNNER_TEMP:?}/release.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s' "$RELEASE_SIGNING_KEY" | base64 -d > "$key")

          args=(
            --key-file "$key"
            --artifacts-dir artifacts
            --version "$VERSION"
            --base-url "$URL_PREFIX"
            --description "$DESCRIPTION"
            --output "artifacts/${PACKAGE}-manifest.json"
          )
          if [ -n "$SKILL_FILE" ]; then
            args+=(
              --skill "${URL_PREFIX}/v${VERSION}/SKILL.md"
              --skill-sha256 "$(sha256sum "$SKILL_FILE" | cut -d' ' -f1)"
              --skill-file "$SKILL_FILE"
            )
          fi
          ./wallet-release-tools/target/release/tempo-sign sign "${args[@]}"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_ENDPOINT_URL: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUCKET: ${{ inputs.bucket }}
        run: |
          set -euo pipefail

          aws configure set default.s3.multipart_threshold 8MB
          aws configure set default.s3.multipart_chunksize 8MB

          # Object keys mirror the public URL path: https://host/extensions/tempo-x -> extensions/tempo-x.
          prefix="s3://${BUCKET}/${URL_PREFIX#*://*/}"
          versioned="${prefix}/v${VERSION}"

          # Versioned objects are immutable: an existing object must match byte for byte, so a
          # rerun is safe but a different build can never replace a published version.
          upload() {
            local source="$1" destination="$2" content_type="${3:-}" immutable="${4:-false}"
            local attempt local_sha remote_sha
            local -a args
            if [ "$immutable" = "true" ]; then
              local_sha=$(sha256sum "$source" | cut -d' ' -f1)
              if remote_sha=$(aws s3 cp "$destination" - --only-show-errors 2>/dev/null | sha256sum | cut -d' ' -f1); then
                if [ "$remote_sha" = "$local_sha" ]; then
                  echo "Verified existing immutable object: ${destination}"
                  return 0
                fi
                echo "::error::immutable object collision at ${destination} (expected ${local_sha}, found ${remote_sha})"
                return 1
              fi
            fi
            for attempt in 1 2 3; do
              args=(s3 cp "$source" "$destination" --only-show-errors)
              [ -z "$content_type" ] || args+=(--content-type "$content_type")
              if aws "${args[@]}"; then
                return 0
              fi
              if [ "$immutable" = "true" ] && remote_sha=$(aws s3 cp "$destination" - --only-show-errors 2>/dev/null | sha256sum | cut -d' ' -f1) && [ "$remote_sha" = "$local_sha" ]; then
                echo "Verified immutable object after an ambiguous upload response: ${destination}"
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::upload failed for ${destination}; retrying $((attempt + 1))/3"
                sleep $((attempt * 10))
              fi
            done
            echo "::error::upload failed after 3 attempts: ${destination}"
            return 1
          }

          for file in "artifacts/${PACKAGE}"-linux-* "artifacts/${PACKAGE}"-darwin-*; do
            [ -f "$file" ] || continue
            upload "$file" "${versioned}/$(basename "$file")" "" true
          done
          upload "artifacts/${PACKAGE}-manifest.json" "${versioned}/manifest.json" "" true
          if [ -n "$SKILL_FILE" ]; then
            upload "$SKILL_FILE" "${versioned}/SKILL.md" text/markdown true
          fi

          # The latest pointers move last, after every versioned object exists.
          upload "artifacts/${PACKAGE}-manifest.json" "${prefix}/manifest.json"
          printf '%s\n' "$VERSION" > "artifacts/${PACKAGE}-VERSION"
          upload "artifacts/${PACKAGE}-VERSION" "${prefix}/VERSION" text/plain

          echo "Released ${PACKAGE}@${VERSION}"
