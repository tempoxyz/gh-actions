name: Scan GitHub Actions

on:
  workflow_call:
    inputs:
      paths:
        description: "Whitespace-separated paths for zizmor to scan. Defaults to `.` (the whole repo), so first-party workflows and actions anywhere (e.g. across a monorepo) are covered. Narrow it (e.g. to `.github/`) to exclude vendored or third-party trees."
        required: false
        type: string
        default: "."
      config:
        description: "Path to a zizmor configuration file for overrides. When empty and the repository has no zizmor config of its own, a default that disables the ref-version-mismatch audit is used (pins to tempoxyz/gh-actions cannot carry a matching version comment)."
        required: false
        type: string
        default: ""
      actionlint:
        description: "Run actionlint (workflow syntax, expression, and shellcheck/pyflakes checks) in addition to the zizmor security scan."
        required: false
        type: boolean
        default: true
      pinact:
        description: "Run pinact policy checks in addition to the zizmor security scan."
        required: false
        type: boolean
        default: false
      pin-config:
        description: Path to a pinact configuration file.
        required: false
        type: string
        default: .pinact.yaml
      pin-no-api:
        description: Perform offline pin validation without API-based comment or minimum-age verification.
        required: false
        type: boolean
        default: false
      verify-pin-comments:
        description: Use the GitHub API to verify that semver version comments resolve to the pinned SHA.
        required: false
        type: boolean
        default: false
      verify-pin-min-age:
        description: Verify current pins against the configured minimum age.
        required: false
        type: boolean
        default: true
      pin-min-age:
        description: Default minimum age in days for pinned action commits.
        required: false
        type: number
        default: 7

permissions: {}

jobs:
  # zizmor annotations, actionlint, and optional pinact checks are read-only, so
  # this workflow never requests `security-events: write` and callers only need
  # read scopes.
  # SARIF upload to code scanning is available via the composite action instead
  # (see actions/scan-github-actions), which runs in a job you control.
  scan-github-actions:
    name: Scan GitHub Actions
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinact config
        if: ${{ inputs.pinact }}
        id: pinact-config
        env:
          CONFIG: ${{ inputs.pin-config }}
          MIN_AGE: ${{ inputs.pin-min-age }}
        run: |
          set -euo pipefail

          policy="$RUNNER_TEMP/pinact-policy.yaml"
          printf 'version: 3\nmin_age:\n  value: %s\n' "$MIN_AGE" > "$policy"
          echo "global-config=$policy" >> "$GITHUB_OUTPUT"

          if [[ -z "$CONFIG" ]]; then
            echo "config=" >> "$GITHUB_OUTPUT"
          elif [[ -f "$CONFIG" ]]; then
            echo "config=$CONFIG" >> "$GITHUB_OUTPUT"
          elif [[ "$CONFIG" == ".pinact.yaml" ]]; then
            echo "config=" >> "$GITHUB_OUTPUT"
          else
            echo "::error file=$CONFIG::pinact config file does not exist"
            exit 1
          fi

      # pinact is installed from its GitHub release and verified against the release checksums,
      # the same way actions/setup-pinact does it (test.yml keeps the two versions identical).
      # The composite cannot be used from here: a reusable workflow would have to check this
      # repository out into the caller's workspace, and the scanners below would then scan it.
      - name: Install pinact
        if: ${{ inputs.pinact }}
        env:
          PINACT_VERSION: v4.1.1
          GH_TOKEN: ${{ github.token }}
        run: | # zizmor: ignore[github-env] INSTALL_DIR is created under RUNNER_TEMP, not derived from user input.
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          ASSET="pinact_linux_${ARCH}.tar.gz"
          CHECKSUMS="pinact_${PINACT_VERSION#v}_checksums.txt"
          BASE_URL="https://github.com/suzuki-shunsuke/pinact/releases/download/${PINACT_VERSION}"
          INSTALL_DIR="$RUNNER_TEMP/pinact-bin"
          mkdir -p "$INSTALL_DIR"
          curl -fsSL -o "$INSTALL_DIR/$ASSET" "$BASE_URL/$ASSET"
          curl -fsSL -o "$INSTALL_DIR/$CHECKSUMS" "$BASE_URL/$CHECKSUMS"
          grep "  $ASSET$" "$INSTALL_DIR/$CHECKSUMS" > "$INSTALL_DIR/$ASSET.sha256"
          (cd "$INSTALL_DIR" && sha256sum -c "$ASSET.sha256")
          # Attestation check as in actions/setup-pinact: provenance from the pinact repository
          # at this tag, signed by its shared release workflow.
          gh attestation verify "$INSTALL_DIR/$ASSET" \
            --repo suzuki-shunsuke/pinact \
            --signer-workflow suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml \
            --source-ref "refs/tags/${PINACT_VERSION}"
          tar -xzf "$INSTALL_DIR/$ASSET" -C "$INSTALL_DIR" pinact
          chmod +x "$INSTALL_DIR/pinact"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"

      # Flags mirror the former pinact-action inputs: fix=false, no_api, verify, verify_min_age,
      # config. GITHUB_TOKEN drives the API-based comment and minimum-age verification.
      - name: Check action pin policy
        if: ${{ inputs.pinact }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PINACT_GLOBAL_CONFIG: ${{ steps.pinact-config.outputs.global-config }}
          CONFIG: ${{ steps.pinact-config.outputs.config }}
          NO_API: ${{ inputs.pin-no-api }}
          VERIFY: ${{ !inputs.pin-no-api && inputs.verify-pin-comments }}
          VERIFY_MIN_AGE: ${{ !inputs.pin-no-api && inputs.verify-pin-min-age }}
        run: |
          set -euo pipefail
          args=(-fix=false)
          [[ -n "$CONFIG" ]] && args+=(-c "$CONFIG")
          [[ "$NO_API" == "true" ]] && args+=(--no-api)
          [[ "$VERIFY" == "true" ]] && args+=(--verify)
          [[ "$VERIFY_MIN_AGE" == "true" ]] && args+=(--verify-min-age)
          pinact run "${args[@]}"

      # Default zizmor policy when the caller ships no zizmor config. Pins to this repository
      # can never carry a version comment that matches a tag (gh-actions publishes none), so
      # zizmor's ref-version-mismatch audit reports every commented pin as mismatched, a
      # medium-severity finding that fails the scan. Comment correctness for third-party pins is
      # pinact's job (`verify-pin-comments`). A repo that wants the audit back adds its own
      # .github/zizmor.yml or passes `config`.
      - name: Resolve zizmor config
        id: zizmor-config
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          if [[ -n "$CONFIG" ]]; then
            echo "config=$CONFIG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for f in .github/zizmor.yml .github/zizmor.yaml zizmor.yml zizmor.yaml; do
            if [[ -f "$f" ]]; then
              echo "using the repository's own $f"
              echo "config=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          # zizmor-action runs zizmor in a container that mounts only the workspace (read-only,
          # at /workspace), so the file has to live inside the checkout and be passed relatively.
          cfg=".zizmor-default.yml"
          printf 'rules:\n  ref-version-mismatch:\n    disable: true\n' > "$GITHUB_WORKSPACE/$cfg"
          echo "config=$cfg" >> "$GITHUB_OUTPUT"

      - name: Scan GitHub Actions
        if: ${{ !cancelled() }}
        uses: tempoxyz/gh-actions/vendor/zizmorcore/zizmor-action@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          inputs: ${{ inputs.paths }}
          persona: regular
          online-audits: true
          advanced-security: false
          annotations: true
          config: ${{ steps.zizmor-config.outputs.config }}
          token: ${{ github.token }}

      - name: Lint GitHub Actions
        if: ${{ !cancelled() && inputs.actionlint }}
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color
