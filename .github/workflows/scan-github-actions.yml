name: Scan GitHub Actions

on:
  workflow_call:
    inputs:
      paths:
        description: "Whitespace-separated paths for zizmor to scan. Defaults to `.` (the whole repo), so first-party workflows and actions anywhere (e.g. across a monorepo) are covered. Narrow it (e.g. to `.github/`) to exclude vendored or third-party trees."
        required: false
        type: string
        default: "."
      config:
        description: "Path to a zizmor configuration file for overrides. When empty, zizmor discovers a repository configuration when present."
        required: false
        type: string
        default: ""
      actionlint:
        description: "Run actionlint (workflow syntax, expression, and shellcheck/pyflakes checks) in addition to the zizmor security scan."
        required: false
        type: boolean
        default: true
      ensure-secure-runner:
        description: "Check that jobs start with secure-runner. Set false to skip the presence check and its annotations and summary."
        required: false
        type: boolean
        default: true
      secure-runner-fail-on-violation:
        description: "Fail when a job does not start with secure-runner. Set false to report violations without blocking CI; existing runner protection is unchanged."
        required: false
        type: boolean
        default: true
      pinact:
        description: "Run pinact policy checks in addition to the zizmor security scan."
        required: false
        type: boolean
        default: true
      pin-config:
        description: Path to a pinact configuration file.
        required: false
        type: string
        default: .pinact.yaml
      pin-no-api:
        description: Perform offline pin validation without API-based comment or minimum-age verification.
        required: false
        type: boolean
        default: false
      verify-pin-comments:
        description: Use the GitHub API to require tag comments and verify that they resolve to the pinned SHA.
        required: false
        type: boolean
        default: true
      verify-pin-min-age:
        description: Verify current pins against the configured minimum age.
        required: false
        type: boolean
        default: true
      pin-min-age:
        description: Default minimum age in days for pinned action commits.
        required: false
        type: number
        default: 7
      skip:
        description: "Skip the scan. The job reports as skipped, which satisfies a required status check."
        required: false
        type: boolean
        default: false
permissions:
  id-token: write

jobs:
  # zizmor annotations, actionlint, and pinact checks are read-only. This
  # workflow never requests security-events: write.
  # SARIF upload to code scanning is available via the composite action instead
  # (see actions/scan-github-actions), which runs in a job you control.
  scan-github-actions:
    name: Scan GitHub Actions
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: read
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@68a1e4645c9596fee5398dd1e2ba07f0a4aa6a71 # 2026-10-20T04-40-18Z-68a1e464

      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          persist-credentials: false

      - name: Ensure every job starts with secure-runner
        if: ${{ inputs.ensure-secure-runner }}
        uses: tempoxyz/gh-actions/actions/ensure-secure-runner@68a1e4645c9596fee5398dd1e2ba07f0a4aa6a71 # 2026-10-20T04-40-18Z-68a1e464
        with:
          fail-on-violation: ${{ inputs.secure-runner-fail-on-violation }}

      - name: Resolve pinact config
        if: ${{ inputs.pinact }}
        id: pinact-config
        env:
          CONFIG: ${{ inputs.pin-config }}
          MIN_AGE: ${{ inputs.pin-min-age }}
        run: |
          set -euo pipefail

          policy="$RUNNER_TEMP/pinact-policy.yaml"
          printf 'version: 3\nmin_age:\n  value: %s\n' "$MIN_AGE" > "$policy"
          printf 'rules:\n  - min_age: 0\n    conditions:\n      - expr: ActionName matches "^tempoxyz/gh-actions(/|$)"\n' >> "$policy"
          echo "global-config=$policy" >> "$GITHUB_OUTPUT"

          if [[ -z "$CONFIG" ]]; then
            echo "config=" >> "$GITHUB_OUTPUT"
          elif [[ -f "$CONFIG" ]]; then
            echo "config=$CONFIG" >> "$GITHUB_OUTPUT"
          elif [[ "$CONFIG" == ".pinact.yaml" ]]; then
            echo "config=" >> "$GITHUB_OUTPUT"
          else
            echo "::error file=$CONFIG::pinact config file does not exist"
            exit 1
          fi

      # pinact is installed from its GitHub release and verified against the release checksums,
      # the same way actions/setup-pinact does it (test.yml keeps the two versions identical).
      # The composite cannot be used from here: a reusable workflow would have to check this
      # repository out into the caller's workspace, and the scanners below would then scan it.
      - name: Install pinact
        if: ${{ inputs.pinact }}
        env:
          PINACT_VERSION: v5.0.1
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
        run: | # zizmor: ignore[github-env] INSTALL_DIR is created under RUNNER_TEMP, not derived from user input.
          set -euo pipefail
          # BEGIN generated download-release helper
          # Source this file; each call isolates its traps and temporary files.
          download_release() (
            set -euo pipefail

            # Only the delivery route changes. The caller must verify the checksum and
            # release-workflow provenance before extracting or exposing these bytes.
            repository=${1:?repository required}
            tag=${2:?release tag required}
            asset=${3:?asset name required}
            destination=${4:?destination required}
            case "$repository" in
              suzuki-shunsuke/pinact|rhysd/actionlint|rui314/mold) ;;
              *) echo "::error::download-release: unsupported repository" >&2; exit 1 ;;
            esac
            if [[ ! "$tag" =~ ^[a-zA-Z0-9._-]+$ || ! "$asset" =~ ^[a-zA-Z0-9._-]+$ ]]; then
              echo "::error::download-release: invalid release tag or asset name" >&2
              exit 1
            fi

            # An interrupted transfer must never leave a partial file at the destination.
            partial=$(mktemp "${destination}.XXXXXX")
            download_pid=
            # shellcheck disable=SC2317 # Called by the EXIT trap through cleanup.
            stop_download() {
              if [[ -n "$download_pid" ]]; then
                kill "$download_pid" 2>/dev/null || true
                for ((i = 0; i < 5; i++)); do
                  kill -0 "$download_pid" 2>/dev/null || break
                  sleep 1
                done
                if kill -0 "$download_pid" 2>/dev/null; then
                  kill -KILL "$download_pid" 2>/dev/null || true
                fi
                wait "$download_pid" 2>/dev/null || true
                download_pid=
              fi
            }
            # shellcheck disable=SC2317 # Called indirectly by the EXIT trap.
            cleanup() {
              # Repeated cancellation must not interrupt the forced kill, wait or removal.
              trap '' INT TERM
              trap - EXIT
              stop_download
              rm -f "$partial"
              exit "$1"
            }
            trap 'cleanup "$?"' EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM
            status=0
            response=$(curl -fsSL --proto '=https' --proto-redir '=https' \
              --connect-timeout 10 --speed-limit 1024 --speed-time 60 --retry 3 --retry-max-time 180 \
              --write-out '%{http_code} %{http_connect}' -o "$partial" \
              "https://github.com/$repository/releases/download/$tag/$asset") || status=$?
            read -r http proxy <<< "$response"
            if [[ "$status" == 0 ]]; then
              mv "$partial" "$destination"
              exit 0
            fi

            # Missing assets, authorization denials and certificate errors are not outages
            # to route around. Retry only transient HTTP or interrupted transport failures.
            # A proxy CONNECT denial may be reported as curl 56 with HTTP 000. Check
            # both statuses before interpreting a curl transport error as recoverable.
            # A failed redirect connection retains the preceding 3xx response; allow that
            # only for the HTTP response, never for a refused proxy CONNECT.
            for field in http proxy; do
              case "$field:${!field}" in
                *:000|*:2[0-9][0-9]|*:408|*:429|*:500|*:502|*:503|*:504|http:301|http:302|http:303|http:307|http:308) ;;
                *)
                  echo "::error::download-release: $asset HTTP $http / proxy CONNECT $proxy; refusing fallback" >&2
                  exit "$status"
                  ;;
              esac
            done
            case "$status:$http" in
              22:408|22:429|22:500|22:502|22:503|22:504|6:*|7:*|18:*|28:*|52:*|55:*|56:*) ;;
              *)
                echo "::error::download-release: $asset download failed (curl $status, HTTP $http); refusing fallback" >&2
                exit "$status"
                ;;
            esac

            echo "::warning::download-release: $asset download failed (curl $status, HTTP $http); trying the official release asset API" >&2
            # The fixed repository, exact tag/name match and numeric ID keep the fallback
            # on this release. gh handles authentication without forwarding a token ourselves.
            query="select(.tag_name == \"$tag\" and .draft == false) | .assets[] | select(.name == \"$asset\") | .id"
            id=$(timeout --kill-after=5s 30s gh api --hostname github.com "repos/$repository/releases/tags/$tag" --jq "$query")
            if [[ ! "$id" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::download-release: release must contain exactly one asset named $asset" >&2
              exit 1
            fi
            # gh streams the response to disk. Bound inactivity rather than elapsed time,
            # so a large archive on a slow but progressing connection can finish.
            : > "$partial"
            gh api --hostname github.com -H 'Accept: application/octet-stream' \
              "repos/$repository/releases/assets/$id" > "$partial" &
            download_pid=$!
            last_size=0
            progress_at=$SECONDS
            while kill -0 "$download_pid" 2>/dev/null; do
              size=$(stat -c %s -- "$partial")
              if ((size > last_size)); then
                last_size=$size
                progress_at=$SECONDS
              fi
              if ((SECONDS - progress_at >= 60)) && kill -0 "$download_pid" 2>/dev/null; then
                echo "::error::download-release: $asset API download made no progress for 60 seconds" >&2
                exit 124
              fi
              sleep 1
            done
            status=0
            wait "$download_pid" || status=$?
            download_pid=
            if [[ "$status" != 0 ]]; then exit "$status"; fi
            mv "$partial" "$destination"
          )
          # END generated download-release helper
          case "$(uname -m)" in
            x86_64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          ASSET="pinact_linux_${ARCH}.tar.gz"
          CHECKSUMS="pinact_${PINACT_VERSION#v}_checksums.txt"
          INSTALL_DIR="$RUNNER_TEMP/pinact-bin"
          mkdir -p "$INSTALL_DIR"
          download_release suzuki-shunsuke/pinact "$PINACT_VERSION" "$ASSET" "$INSTALL_DIR/$ASSET"
          download_release suzuki-shunsuke/pinact "$PINACT_VERSION" "$CHECKSUMS" "$INSTALL_DIR/$CHECKSUMS"
          grep "  $ASSET$" "$INSTALL_DIR/$CHECKSUMS" > "$INSTALL_DIR/$ASSET.sha256"
          (cd "$INSTALL_DIR" && sha256sum -c "$ASSET.sha256")
          # Attestation check as in actions/setup-pinact: provenance from the pinact repository
          # at this tag, signed by its shared release workflow.
          gh attestation verify "$INSTALL_DIR/$ASSET" \
            --repo suzuki-shunsuke/pinact \
            --signer-workflow suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml \
            --source-ref "refs/tags/${PINACT_VERSION}"
          tar -xzf "$INSTALL_DIR/$ASSET" -C "$INSTALL_DIR" pinact
          chmod +x "$INSTALL_DIR/pinact"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"

      # Flags mirror the former pinact-action inputs: fix=false, no_api, verify, verify_min_age,
      # config. GITHUB_TOKEN drives the API-based comment and minimum-age verification.
      - name: Check action pin policy
        if: ${{ inputs.pinact }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PINACT_GLOBAL_CONFIG: ${{ steps.pinact-config.outputs.global-config }}
          CONFIG: ${{ steps.pinact-config.outputs.config }}
          NO_API: ${{ inputs.pin-no-api }}
          VERIFY: ${{ !inputs.pin-no-api && inputs.verify-pin-comments }}
          VERIFY_MIN_AGE: ${{ !inputs.pin-no-api && inputs.verify-pin-min-age }}
        run: |
          set -euo pipefail
          args=(--fix=false)
          [[ -n "$CONFIG" ]] && args+=(-c "$CONFIG")
          [[ "$NO_API" == "true" ]] && args+=(--no-api)
          [[ "$VERIFY" == "true" ]] && args+=(--verify-comment)
          [[ "$VERIFY_MIN_AGE" == "true" ]] && args+=(--verify-min-age)
          pinact run "${args[@]}"

      - name: Scan GitHub Actions
        if: ${{ !cancelled() }}
        uses: tempoxyz/gh-actions/vendor/zizmorcore/zizmor-action@68a1e4645c9596fee5398dd1e2ba07f0a4aa6a71 # 2026-10-20T04-40-18Z-68a1e464
        with:
          inputs: ${{ inputs.paths }}
          persona: regular
          online-audits: true
          advanced-security: false
          annotations: true
          config: ${{ inputs.config }}
          token: ${{ github.token }}

      - name: Install actionlint
        if: ${{ !cancelled() && inputs.actionlint }}
        # actionlint publishes release checksums but no attestations, so the tarball digests are pinned
        # here (the same approach as mold). Bump ACTIONLINT_VERSION and both digests together.
        env:
          GH_TOKEN: ${{ github.token }}
        run: | # zizmor: ignore[github-env] INSTALL_DIR is created under RUNNER_TEMP, not derived from user input.
          set -euo pipefail
          # BEGIN generated download-release helper
          # Source this file; each call isolates its traps and temporary files.
          download_release() (
            set -euo pipefail

            # Only the delivery route changes. The caller must verify the checksum and
            # release-workflow provenance before extracting or exposing these bytes.
            repository=${1:?repository required}
            tag=${2:?release tag required}
            asset=${3:?asset name required}
            destination=${4:?destination required}
            case "$repository" in
              suzuki-shunsuke/pinact|rhysd/actionlint|rui314/mold) ;;
              *) echo "::error::download-release: unsupported repository" >&2; exit 1 ;;
            esac
            if [[ ! "$tag" =~ ^[a-zA-Z0-9._-]+$ || ! "$asset" =~ ^[a-zA-Z0-9._-]+$ ]]; then
              echo "::error::download-release: invalid release tag or asset name" >&2
              exit 1
            fi

            # An interrupted transfer must never leave a partial file at the destination.
            partial=$(mktemp "${destination}.XXXXXX")
            download_pid=
            # shellcheck disable=SC2317 # Called by the EXIT trap through cleanup.
            stop_download() {
              if [[ -n "$download_pid" ]]; then
                kill "$download_pid" 2>/dev/null || true
                for ((i = 0; i < 5; i++)); do
                  kill -0 "$download_pid" 2>/dev/null || break
                  sleep 1
                done
                if kill -0 "$download_pid" 2>/dev/null; then
                  kill -KILL "$download_pid" 2>/dev/null || true
                fi
                wait "$download_pid" 2>/dev/null || true
                download_pid=
              fi
            }
            # shellcheck disable=SC2317 # Called indirectly by the EXIT trap.
            cleanup() {
              # Repeated cancellation must not interrupt the forced kill, wait or removal.
              trap '' INT TERM
              trap - EXIT
              stop_download
              rm -f "$partial"
              exit "$1"
            }
            trap 'cleanup "$?"' EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM
            status=0
            response=$(curl -fsSL --proto '=https' --proto-redir '=https' \
              --connect-timeout 10 --speed-limit 1024 --speed-time 60 --retry 3 --retry-max-time 180 \
              --write-out '%{http_code} %{http_connect}' -o "$partial" \
              "https://github.com/$repository/releases/download/$tag/$asset") || status=$?
            read -r http proxy <<< "$response"
            if [[ "$status" == 0 ]]; then
              mv "$partial" "$destination"
              exit 0
            fi

            # Missing assets, authorization denials and certificate errors are not outages
            # to route around. Retry only transient HTTP or interrupted transport failures.
            # A proxy CONNECT denial may be reported as curl 56 with HTTP 000. Check
            # both statuses before interpreting a curl transport error as recoverable.
            # A failed redirect connection retains the preceding 3xx response; allow that
            # only for the HTTP response, never for a refused proxy CONNECT.
            for field in http proxy; do
              case "$field:${!field}" in
                *:000|*:2[0-9][0-9]|*:408|*:429|*:500|*:502|*:503|*:504|http:301|http:302|http:303|http:307|http:308) ;;
                *)
                  echo "::error::download-release: $asset HTTP $http / proxy CONNECT $proxy; refusing fallback" >&2
                  exit "$status"
                  ;;
              esac
            done
            case "$status:$http" in
              22:408|22:429|22:500|22:502|22:503|22:504|6:*|7:*|18:*|28:*|52:*|55:*|56:*) ;;
              *)
                echo "::error::download-release: $asset download failed (curl $status, HTTP $http); refusing fallback" >&2
                exit "$status"
                ;;
            esac

            echo "::warning::download-release: $asset download failed (curl $status, HTTP $http); trying the official release asset API" >&2
            # The fixed repository, exact tag/name match and numeric ID keep the fallback
            # on this release. gh handles authentication without forwarding a token ourselves.
            query="select(.tag_name == \"$tag\" and .draft == false) | .assets[] | select(.name == \"$asset\") | .id"
            id=$(timeout --kill-after=5s 30s gh api --hostname github.com "repos/$repository/releases/tags/$tag" --jq "$query")
            if [[ ! "$id" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::download-release: release must contain exactly one asset named $asset" >&2
              exit 1
            fi
            # gh streams the response to disk. Bound inactivity rather than elapsed time,
            # so a large archive on a slow but progressing connection can finish.
            : > "$partial"
            gh api --hostname github.com -H 'Accept: application/octet-stream' \
              "repos/$repository/releases/assets/$id" > "$partial" &
            download_pid=$!
            last_size=0
            progress_at=$SECONDS
            while kill -0 "$download_pid" 2>/dev/null; do
              size=$(stat -c %s -- "$partial")
              if ((size > last_size)); then
                last_size=$size
                progress_at=$SECONDS
              fi
              if ((SECONDS - progress_at >= 60)) && kill -0 "$download_pid" 2>/dev/null; then
                echo "::error::download-release: $asset API download made no progress for 60 seconds" >&2
                exit 124
              fi
              sleep 1
            done
            status=0
            wait "$download_pid" || status=$?
            download_pid=
            if [[ "$status" != 0 ]]; then exit "$status"; fi
            mv "$partial" "$destination"
          )
          # END generated download-release helper
          ACTIONLINT_VERSION="1.7.12"
          case "$(uname -m)" in
            x86_64)        ARCH=amd64; SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8" ;;
            aarch64|arm64) ARCH=arm64; SHA256="325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6" ;;
            *) echo "::error::actionlint: unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          ASSET="actionlint_${ACTIONLINT_VERSION}_linux_${ARCH}.tar.gz"
          INSTALL_DIR="${RUNNER_TEMP:?}/actionlint-bin"
          mkdir -p "$INSTALL_DIR"
          download_release rhysd/actionlint "v${ACTIONLINT_VERSION}" "$ASSET" "$INSTALL_DIR/$ASSET"
          echo "${SHA256}  ${INSTALL_DIR}/${ASSET}" | sha256sum --check --strict
          tar -xzf "$INSTALL_DIR/$ASSET" -C "$INSTALL_DIR" actionlint
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Lint GitHub Actions
        if: ${{ !cancelled() && inputs.actionlint }}
        run: actionlint -color
