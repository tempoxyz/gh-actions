name: Aegis installation benchmark

on:
  push:
    branches: [centaur/use-dpkg-for-aegis-1790621072]
    paths:
      - .github/workflows/aegis-install-benchmark.yml
      - actions/secure-runner-benchmark/**

permissions:
  contents: read
  id-token: write

jobs:
  benchmark:
    name: ${{ matrix.variant }} sample ${{ matrix.sample }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        variant: [apt, dpkg]
        sample: [1, 2, 3]
    steps:
      - name: Measure Secure Runner and Aegis installation
        uses: tempoxyz/gh-actions/actions/secure-runner-benchmark@52cabc29b4fa1966c7a689783178414050f404c5
        with:
          variant: ${{ matrix.variant }}
          aegis-version: v0.19.0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify allowed package
        run: node actions/aegis/npm-install.cjs allow

      - name: Verify blocked package
        id: blocked
        continue-on-error: true
        run: node actions/aegis/npm-install.cjs block

      - name: Require policy block
        env:
          BLOCK_OUTCOME: ${{ steps.blocked.outcome }}
        run: test "$BLOCK_OUTCOME" = failure

      - name: Preserve measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aegis-install-${{ matrix.variant }}-${{ matrix.sample }}
          path: ${{ runner.temp }}/aegis-install-benchmark.json
          retention-days: 7
