# Tagging each commit ensures when we reference commits in other repos that
# we can always include a tag which prevents referencing phantom commits from
# fork PRs.

name: Tag Release

on:
  push:
    branches: [main]

permissions:
  id-token: write

jobs:
  tag:
    name: Tag release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@68a1e4645c9596fee5398dd1e2ba07f0a4aa6a71 # 2026-10-20T04-40-18Z-68a1e464

      - name: Checkout pushed revision
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Create timestamp tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="$(date -u +'%Y-%m-%dT%H-%M-%SZ')-${REVISION:0:8}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$tag" "$REVISION" --message "Main branch at $tag"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" "refs/tags/$tag"
