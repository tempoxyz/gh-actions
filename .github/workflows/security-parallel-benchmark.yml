name: Security setup parallel benchmark

on:
  push:
    branches: [centaur/parallel-security-setup-1790622195]
    paths:
      - .github/workflows/security-parallel-benchmark.yml

permissions:
  contents: read
  id-token: write

jobs:
  benchmark:
    name: ${{ matrix.variant }} ${{ matrix.os }} sample ${{ matrix.sample }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        variant: [serial, parallel]
        sample: [1, 2, 3]
        include:
          - os: macos-latest
            variant: parallel
            sample: 1
          - os: windows-latest
            variant: parallel
            sample: 1
    steps:
      - name: Measure Secure Runner setup
        uses: tempoxyz/gh-actions/actions/secure-runner-benchmark@cf9869385aefcc842f2ee9f1d52ba98d125e77a7
        with:
          variant: ${{ matrix.variant }}
          aegis-version: v0.19.0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify allowed package
        run: node actions/aegis/npm-install.cjs allow

      - name: Verify blocked package
        id: blocked
        continue-on-error: true
        run: node actions/aegis/npm-install.cjs block

      - name: Require policy block
        shell: bash
        env:
          BLOCK_OUTCOME: ${{ steps.blocked.outcome }}
        run: test "$BLOCK_OUTCOME" = failure

      - name: Preserve measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-setup-${{ matrix.os }}-${{ matrix.variant }}-${{ matrix.sample }}
          path: ${{ runner.temp }}/parallel-benchmark.json
          retention-days: 7
