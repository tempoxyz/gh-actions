name: rust deny

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: Rust toolchain installed on the runner and used inside the cargo-deny container.
        required: false
        type: string
        default: stable
      flags:
        description: Additional flags passed to cargo deny check all.
        required: false
        type: string
        default: --all-features
      runner:
        description: Runner used for cargo deny.
        required: false
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Timeout for each job.
        required: false
        type: number
        default: 30

permissions: {}

jobs:
  deny:
    # Call the reusable workflow at the published, pinned commit.
    uses: tempoxyz/gh-actions/.github/workflows/rust-lint.yml@bd66336ead0e97e3939428f526dc61fb43db0996 # 2026-09-25T20-13-44Z-bd66336e
    permissions:
      contents: read
      id-token: write
    with:
      run-clippy: false
      run-fmt: false
      run-typos: false
      run-deny: true
      deny-rust-toolchain: ${{ inputs.rust-toolchain }}
      deny-flags: ${{ inputs.flags }}
      deny-runner: ${{ inputs.runner }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
