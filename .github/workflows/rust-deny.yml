name: rust deny

on:
  workflow_call:
    inputs:
      secure-runner-warning-annotations:
        description: Emit Secure Runner setup and cleanup warning annotations.
        required: false
        type: boolean
        default: true
      rust-toolchain:
        description: Rust toolchain installed on the runner and used inside the cargo-deny container.
        required: false
        type: string
        default: stable
      flags:
        description: Additional flags passed to cargo deny check all.
        required: false
        type: string
        default: --all-features
      runner:
        description: Runner used for cargo deny.
        required: false
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Timeout for each job.
        required: false
        type: number
        default: 30

permissions: {}

jobs:
  deny:
    # Call the reusable workflow at the published, pinned commit.
    uses: tempoxyz/gh-actions/.github/workflows/rust-lint.yml@224ca8e9a057a9b9cddd4ae0ff9d378f73881ec3
    permissions:
      contents: read
      id-token: write
    with:
      secure-runner-warning-annotations: ${{ inputs.secure-runner-warning-annotations }}
      run-clippy: false
      run-fmt: false
      run-typos: false
      run-deny: true
      deny-rust-toolchain: ${{ inputs.rust-toolchain }}
      deny-flags: ${{ inputs.flags }}
      deny-runner: ${{ inputs.runner }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
