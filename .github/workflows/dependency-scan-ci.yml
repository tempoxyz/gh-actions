name: Dependency Scan

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  scan:
    name: Dependency Scan (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: tempoxyz/gh-actions/.github/workflows/dependency-scan.yml@7e2ea6e1a8f5a22f16c2d4b389ffde25da93fa1b # 2026-09-22T22-21-59Z-7e2ea6e1
    with:
      runs-on: ${{ matrix.os }}
      artifact-name: dependency-scan-${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
