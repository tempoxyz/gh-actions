name: Dependency Scan

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  scan:
    name: Dependency Scan (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: tempoxyz/gh-actions/.github/workflows/dependency-scan.yml@20ff54f9bb27cd6cf604937d28fa73d8501be28d # 2026-09-23T03-41-39Z-20ff54f9
    with:
      runs-on: ${{ matrix.os }}
      artifact-name: dependency-scan-${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
