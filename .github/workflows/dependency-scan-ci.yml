name: Dependency Scan

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  scan:
    name: Dependency Scan (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: tempoxyz/gh-actions/.github/workflows/dependency-scan.yml@cfdaf2e39309260bff640fb06cf1ab2f9f57386b # 2026-09-25T04-44-11Z-cfdaf2e3
    with:
      runs-on: ${{ matrix.os }}
      artifact-name: dependency-scan-${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
