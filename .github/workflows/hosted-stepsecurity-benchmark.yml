name: Hosted StepSecurity post benchmark
on:
  push:
    branches: [centaur/benchmark-hosted-stepsecurity-1790651000]
    paths: [.github/workflows/hosted-stepsecurity-benchmark.yml]
permissions:
  contents: read
  id-token: write
jobs:
  benchmark:
    name: ${{ matrix.os }} ${{ matrix.variant }} sample ${{ matrix.sample }} self-hosted=${{ matrix.self-hosted || false }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        variant: [baseline, parallel]
        sample: [1, 2, 3, 4, 5]
        include:
          - {os: ubuntu-24.04, variant: parallel, sample: 6, self-hosted: true}
          - {os: macos-15, variant: parallel, sample: 1}
          - {os: windows-2025, variant: parallel, sample: 1}
    steps:
      - name: Secure Runner baseline
        if: matrix.variant == 'baseline'
        uses: tempoxyz/gh-actions/actions/secure-runner@35d79331be9c751f6386316614d75c3a4bb1dddb
        with:
          aegis-version: v0.19.0
          benchmark-variant: baseline
      - name: Secure Runner hosted fast path
        if: matrix.variant == 'parallel'
        uses: tempoxyz/gh-actions/actions/secure-runner@d4eb5e156692de8811971755ad075883cf63cd17
        with:
          aegis-version: v0.19.0
          benchmark-variant: parallel
          benchmark-self-hosted: ${{ matrix.self-hosted || false }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify allowed package
        run: node actions/aegis/npm-install.cjs allow
      - name: Verify malware policy block
        shell: bash
        run: |
          set +e
          set -uo pipefail
          node actions/aegis/npm-install.cjs block > "$RUNNER_TEMP/policy-block.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/policy-block.log"
          test "$status" -ne 0
          grep -Eiq '403|malware|security policy' "$RUNNER_TEMP/policy-block.log"
