name: Dependency Review

on:
  workflow_call:
    inputs:
      # Empty strings preserve upstream defaults and config-file settings.
      # Only the three opinionated boolean defaults override config-file values.
      fail-on-severity:
        description: "Don't block PRs below this severity. Possible values are `low`, `moderate`, `high`, `critical`."
        required: false
        type: string
      fail-on-scopes:
        description: "Dependency scopes to block PRs on. Comma-separated list. Possible values are 'unknown', 'runtime', and 'development' (e.g. \"runtime, development\")"
        required: false
        type: string
      base-ref:
        description: "The base git ref to be used for this check. Has a default value when the workflow event is `pull_request` or `pull_request_target`. Must be provided otherwise."
        required: false
        type: string
      head-ref:
        description: "The head git ref to be used for this check. Has a default value when the workflow event is `pull_request` or `pull_request_target`. Must be provided otherwise."
        required: false
        type: string
      config-file:
        description: "A path to the configuration file for the action."
        required: false
        type: string
      allow-licenses:
        description: "Comma-separated list of allowed licenses (e.g. \"MIT, GPL 3.0, BSD 2 Clause\")"
        required: false
        type: string
      deny-licenses:
        description: "Comma-separated list of forbidden licenses (e.g. \"MIT, GPL 3.0, BSD 2 Clause\")"
        required: false
        type: string
      allow-dependencies-licenses:
        description: "Comma-separated list of dependencies in purl format (e.g. \"pkg:npm/express, pkg:pypi/pycrypto\"). These dependencies will be permitted to use any license, no matter what license policy is enforced otherwise."
        required: false
        type: string
      allow-ghsas:
        description: "Comma-separated list of allowed GitHub Advisory IDs (e.g. \"GHSA-abcd-1234-5679, GHSA-efgh-1234-5679\")"
        required: false
        type: string
      license-check:
        description: "A boolean to determine if license checks should be performed"
        required: false
        type: string
      vulnerability-check:
        description: "A boolean to determine if vulnerability checks should be performed"
        required: false
        type: string
      comment-summary-in-pr:
        description: "Determines if the summary is posted as a comment in the PR itself. Setting this to `always` or `on-failure` requires you to give the workflow `pull-requests: write` permissions"
        required: false
        type: string
      deny-packages:
        description: "A comma-separated list of package URLs to deny (e.g. \"pkg:npm/express, pkg:pypi/pycrypto\"). If version specified, only deny matching packages and version; else, deny all regardless of version."
        required: false
        type: string
      deny-groups:
        description: "A comma-separated list of package URLs for group(s)/namespace(s) to deny (e.g. \"pkg:npm/express/, pkg:pypi/pycrypto/\"). Please note that the group name must be followed by a `/`."
        required: false
        type: string
      retry-on-snapshot-warnings:
        description: "Whether to retry on snapshot warnings"
        required: false
        type: boolean
        default: true
      retry-on-snapshot-warnings-timeout:
        description: "Number of seconds to wait before stopping snapshot retries."
        required: false
        type: string
      warn-only:
        description: "When set to `true` this action will always complete with success, overriding the `fail-on-severity` parameter."
        required: false
        type: boolean
        default: true
      show-openssf-scorecard:
        description: "Show a summary of the OpenSSF Scorecard scores."
        required: false
        type: string
      warn-on-openssf-scorecard-level:
        description: "Numeric threshold for the OpenSSF Scorecard score. If the score is below this threshold, the action will warn you."
        required: false
        type: string
      show-patched-versions:
        description: "When set to `true`, the vulnerability summary table will include a column showing the first patched version for each vulnerability."
        required: false
        type: boolean
        default: true
    secrets:
      repo-token:
        description: Optional repository token; defaults to github.token.
        required: false
      external-repo-token:
        description: Token for reading a configuration file from another private repository.
        required: false
    outputs:
      comment-content:
        description: Prepared dependency report comment
        value: ${{ jobs.dependency-review.outputs.comment-content }}
      dependency-changes:
        description: All dependency changes (JSON)
        value: ${{ jobs.dependency-review.outputs.dependency-changes }}
      vulnerable-changes:
        description: Vulnerable dependency changes (JSON)
        value: ${{ jobs.dependency-review.outputs.vulnerable-changes }}
      invalid-license-changes:
        description: Invalid license dependency changes (JSON)
        value: ${{ jobs.dependency-review.outputs.invalid-license-changes }}
      denied-changes:
        description: Denied dependency changes (JSON)
        value: ${{ jobs.dependency-review.outputs.denied-changes }}

permissions: {}

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      # Needed when comment-summary-in-pr is enabled inline or in config-file.
      pull-requests: write
    outputs:
      comment-content: ${{ steps.review.outputs.comment-content }}
      dependency-changes: ${{ steps.review.outputs.dependency-changes }}
      vulnerable-changes: ${{ steps.review.outputs.vulnerable-changes }}
      invalid-license-changes: ${{ steps.review.outputs.invalid-license-changes }}
      denied-changes: ${{ steps.review.outputs.denied-changes }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@de8817e2eae66bc85468011ba8c7a9c2792570d1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        id: review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          repo-token: ${{ secrets.repo-token || github.token }} # zizmor: ignore[secrets-outside-env] Optional caller-supplied API token; this reporting workflow does not deploy.
          fail-on-severity: ${{ inputs.fail-on-severity }}
          fail-on-scopes: ${{ inputs.fail-on-scopes }}
          base-ref: ${{ inputs.base-ref }}
          head-ref: ${{ inputs.head-ref }}
          config-file: ${{ inputs.config-file }}
          allow-licenses: ${{ inputs.allow-licenses }}
          deny-licenses: ${{ inputs.deny-licenses }}
          allow-dependencies-licenses: ${{ inputs.allow-dependencies-licenses }}
          allow-ghsas: ${{ inputs.allow-ghsas }}
          external-repo-token: ${{ secrets.external-repo-token }} # zizmor: ignore[secrets-outside-env] Optional read token for shared configuration; no deployment environment.
          license-check: ${{ inputs.license-check }}
          vulnerability-check: ${{ inputs.vulnerability-check }}
          comment-summary-in-pr: ${{ inputs.comment-summary-in-pr }}
          deny-packages: ${{ inputs.deny-packages }}
          deny-groups: ${{ inputs.deny-groups }}
          retry-on-snapshot-warnings: ${{ inputs.retry-on-snapshot-warnings }}
          retry-on-snapshot-warnings-timeout: ${{ inputs.retry-on-snapshot-warnings-timeout }}
          warn-only: ${{ inputs.warn-only }}
          show-openssf-scorecard: ${{ inputs.show-openssf-scorecard }}
          warn-on-openssf-scorecard-level: ${{ inputs.warn-on-openssf-scorecard-level }}
          show-patched-versions: ${{ inputs.show-patched-versions }}
