            "account_id", "ai", "ai_search", "ai_search_namespaces", "analytics", "analytics_engine_datasets",
            "artifacts", "assets", "browser", "cache", "compatibility_date", "compatibility_flags", "connect",
            "containers", "d1_databases", "dispatch_namespaces", "durable_objects", "exports",
            "hyperdrive", "images", "keep_vars", "kv_namespaces", "limits", "logpush", "main", "migrations",
            "mtls_certificates", "name", "observability", "pipelines", "placement", "preview_urls", "queues",
            "r2_buckets", "ratelimits", "route", "routes", "secrets_store_secrets", "send_email",
            "services", "site", "tail_consumers", "triggers", "unsafe", "vars", "vectorize",
            "version_metadata", "vpc_services", "worker_loaders", "workers_dev", "workflows",
          ]);
