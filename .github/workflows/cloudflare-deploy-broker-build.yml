          }

          // Restrict every provider option before mapping it into the attested
          // manifest. Local connection strings and remote/raw overrides never
          // become deployment inputs.
          // Rate limits name only a namespace ID and a limit, and a Worker may
          // need more of them than of any resource binding. Brokers whose
          // MAX_RATE_LIMIT_BINDINGS is 20 accept them; older ones fail closed.
          function mapBindings(values, keys, map, max = 10) {
            invariant(Array.isArray(values), "bindings must be an array");
            invariant(values.length <= max, max === 10 ? "at most ten bindings of each type are supported" : `at most ${max} bindings of this type are supported`);
