          // explicit id adopts an existing namespace, which only an explicit
          // policy naming the same ID authorizes.
          const kv = (config.kv_namespaces ?? []).map((binding) => {
            invariant(isRecord(binding) && Object.keys(binding).every((key) => key === "binding" || key === "id"), "KV bindings accept only a binding name and an optional existing id; preview IDs, jurisdiction, remote, and unknown options are not supported");
            invariant(typeof binding.binding === "string" && bindingName.test(binding.binding), "KV binding name is invalid");
            if (binding.id === undefined) return { binding: binding.binding, provisioning: "new" };
