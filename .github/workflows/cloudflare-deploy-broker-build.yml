name: Build and attest Cloudflare Worker

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Repository-relative directory containing the Worker package"
        required: false
        type: string
        default: "."
      install-directory:
        description: "Repository-relative package and lockfile directory (pnpm-lock.yaml, bun.lock with an exact packageManager bun@x.y.z, or package-lock.json); defaults to working-directory"
        required: false
        type: string
        default: ""
      submodules:
        description: "Newline-separated repository-relative paths of submodules to check out, at the commits the repository records. Each must be declared in .gitmodules with a public https://github.com/ URL; nested submodules are not checked out"
        required: false
        type: string
        default: ""
      private-submodule:
        description: "Repository-relative path of one private submodule to check out, at the commit the repository records, with a read token from GitHub STS. It must be declared in .gitmodules with an https://github.com/ URL in the caller's organization"
        required: false
        type: string
        default: ""
      private-submodule-sts-policy:
        description: "GitHub STS trust policy, .github/sts/<policy>.sts.yaml in the private submodule's repository, that admits this job; required with private-submodule"
        required: false
        type: string
        default: ""
      pre-install-command:
        description: "Optional command run in install-directory after the package manager is set up and before the dependency install (no provider credentials), such as building a workspace package from a submodule"
        required: false
        type: string
        default: ""
      install-filter:
        description: "Optional newline-separated pnpm --filter selectors for the dependency install, such as web..., so a workspace installs only the Worker's packages (pnpm only)"
        required: false
        type: string
        default: ""
      build-command:
        description: "Optional application build command, run in working-directory before Wrangler packaging (no provider credentials)"
        required: false
        type: string
        default: ""
      wrangler-config:
        description: "Path to the Wrangler configuration, relative to working-directory"
        required: false
        type: string
        default: "wrangler.toml"
      wrangler-environment:
        description: "Optional Wrangler environment used to produce the attested configuration"
        required: false
        type: string
        default: ""
      dispatch-namespace:
        description: "Workers for Platforms dispatch namespace for a namespace script build"
        required: false
        type: string
        default: ""
      d1-migrations-directory:
        description: "Optional directory of D1 .sql migrations, relative to working-directory"
        required: false
        type: string
        default: ""
      publish-container-image:
        description: "Build the Wrangler Dockerfile and push an attested image to the private Tempo Docker Hub registry"
        required: false
        type: boolean
        default: false
      dockerhub-oidc-connection-id:
        description: "Docker Hub OIDC connection with read/write access to private Tempo repositories"
        required: false
        type: string
        default: ""
      artifact-name:
        description: "Unique safe name prefix for the uploaded artifact"
        required: false
        type: string
        default: "cloudflare-worker"
      unattested-artifact-directory:
        description: "Optional directory, relative to working-directory, uploaded after the attested artifact as <artifact-name>-unattested-<run>-<attempt>. It is never attested, verified or deployed: use it for build by-products, such as source maps, that a later job uploads elsewhere"
        required: false
        type: string
        default: ""
      build-cache-paths:
        description: "Newline-separated directories, relative to working-directory, restored before the build and saved after a successful one"
        required: false
        type: string
        default: ""
      build-cache-key-files:
        description: "Newline-separated tracked-file globs, relative to working-directory, that invalidate the build cache in addition to package.json and the lockfile"
        required: false
        type: string
        default: ""
    secrets:
      build-environment:
        description: "Optional NAME=value lines exported only to build-command, such as a client key the build compiles in. Names are upper case and can't be runner, shell or Node settings. Values end up wherever the build puts them, including the attested artifact"
        required: false
    outputs:
      artifact-id:
        description: "Immutable GitHub Actions artifact ID"
        value: ${{ jobs.build.outputs.artifact-id }}
      archive-digest:
        description: "SHA-256 digest emitted by actions/upload-artifact"
        value: ${{ jobs.build.outputs.archive-digest }}
      module-digest:
        description: "SHA-256 digest of the attested Worker module"
        value: ${{ jobs.build.outputs.module-digest }}
      d1-migrations-digest:
        description: "SHA-256 digest of the attested D1 migration manifest, or empty when disabled"
        value: ${{ jobs.build.outputs.d1-migrations-digest }}
      worker-configuration-digest:
        description: "SHA-256 digest of the attested canonical Worker configuration"
        value: ${{ jobs.build.outputs.worker-configuration-digest }}
      static-assets-digest:
        description: "SHA-256 digest of the attested static asset manifest, or empty when disabled"
        value: ${{ jobs.build.outputs.static-assets-digest }}
      modules-digest:
        description: "SHA-256 digest of the attested additional-module manifest, or empty when the Worker is a single module"
        value: ${{ jobs.build.outputs.modules-digest }}
      container-image-digest:
        description: "Digest of the pushed Container image, or empty when disabled"
        value: ${{ jobs.build.outputs.container-image-digest }}
      unattested-artifact-id:
        description: "GitHub Actions artifact ID of the unattested-artifact-directory upload, or empty when disabled"
        value: ${{ jobs.build.outputs.unattested-artifact-id }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      archive-digest: ${{ steps.upload.outputs.artifact-digest }}
      module-digest: ${{ steps.prepare.outputs.module-digest }}
      d1-migrations-digest: ${{ steps.prepare-migrations.outputs.migration-digest }}
      worker-configuration-digest: ${{ steps.prepare-configuration.outputs.configuration-digest }}
      static-assets-digest: ${{ steps.prepare-assets.outputs.assets-digest }}
      modules-digest: ${{ steps.prepare.outputs.modules-digest }}
      container-image-digest: ${{ steps.publish-container.outputs.image-digest }}
      unattested-artifact-id: ${{ steps.upload-unattested.outputs.artifact-id }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The checked-out commit records each submodule's commit, so the provenance's
      # source commit still pins the submodule's source. Checkout persisted no
      # credentials, so the fetch is anonymous, and only HTTPS is allowed, which
      # keeps it to the public GitHub URLs checked below.
      - name: Check out submodules
        if: ${{ inputs.submodules != '' }}
        shell: bash
        env:
          SUBMODULES: ${{ inputs.submodules }}
        run: |
          set -euo pipefail
          safe_path='^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'
          relative_segment='/(\.|\.\.)/'
          github_url='^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
          invalid() {
            echo "::error::$1" >&2
            exit 1
          }
          test -f .gitmodules || invalid "submodules is set, but the repository has no .gitmodules"
          # --null ends each entry with NUL and splits its key from its value with a
          # newline, so a submodule name may contain spaces.
          declare -A names=()
          while IFS= read -r -d '' entry; do
            key="${entry%%$'\n'*}"
            name="${key#submodule.}"
            names["${entry#*$'\n'}"]="${name%.path}"
          done < <(git config --null --file .gitmodules --get-regexp '^submodule\..+\.path$')
          paths=()
          while read -r path; do
            [[ -n "${path}" ]] || continue
            if [[ ! "${path}" =~ ${safe_path} ]] || [[ "/${path}/" =~ ${relative_segment} ]]; then
              invalid "submodule path ${path} must be a path inside the repository"
            fi
            [[ -n "${names[${path}]:-}" ]] || invalid "${path} is not a submodule path in .gitmodules"
            url="$(git config --file .gitmodules --get "submodule.${names[${path}]}.url")" ||
              invalid "submodule ${path} has no URL in .gitmodules"
            [[ "${url}" =~ ${github_url} ]] ||
              invalid "submodule ${path} must use a public https://github.com/ URL, not ${url}"
            [[ "$(git ls-files --stage -- "${path}" | cut -d ' ' -f 1)" == "160000" ]] ||
              invalid "${path} is not a submodule in this commit"
            paths+=("${path}")
          done <<< "${SUBMODULES}"
          (( ${#paths[@]} > 0 )) || invalid "submodules lists no paths"
          git -c protocol.allow=never -c protocol.https.allow=always \
            submodule update --init --checkout -- "${paths[@]}"
          git submodule status -- "${paths[@]}"

      # A private submodule is fetched like the public ones, at the recorded commit
      # and over HTTPS only. Its read token comes from GitHub STS under a policy in
      # the submodule's own repository, so that repository decides which callers
      # may read it. The token reaches only the one git process below, never a
      # config file, and the action revokes it when the job ends. Code this job
      # runs later can request the same token itself, as it could from any other
      # job of the caller the policy admits.
      - name: Resolve the private submodule
        id: private-submodule
        if: ${{ inputs.private-submodule != '' || inputs.private-submodule-sts-policy != '' }}
        shell: bash
        env:
          PRIVATE_SUBMODULE: ${{ inputs.private-submodule }}
          STS_POLICY: ${{ inputs.private-submodule-sts-policy }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          safe_path='^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'
          relative_segment='/(\.|\.\.)/'
          invalid() {
            echo "::error::$1" >&2
            exit 1
          }
          [[ -n "${PRIVATE_SUBMODULE}" && -n "${STS_POLICY}" ]] ||
            invalid "private-submodule and private-submodule-sts-policy must be set together"
          [[ "${STS_POLICY}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]] ||
            invalid "private-submodule-sts-policy is malformed"
          path="${PRIVATE_SUBMODULE}"
          if [[ ! "${path}" =~ ${safe_path} ]] || [[ "/${path}/" =~ ${relative_segment} ]]; then
            invalid "private-submodule ${path} must be a path inside the repository"
          fi
          test -f .gitmodules || invalid "private-submodule is set, but the repository has no .gitmodules"
          name=""
          while IFS= read -r -d '' entry; do
            key="${entry%%$'\n'*}"
            if [[ "${entry#*$'\n'}" == "${path}" ]]; then
              name="${key#submodule.}"
              name="${name%.path}"
            fi
          done < <(git config --null --file .gitmodules --get-regexp '^submodule\..+\.path$')
          [[ -n "${name}" ]] || invalid "${path} is not a submodule path in .gitmodules"
          url="$(git config --file .gitmodules --get "submodule.${name}.url")" ||
            invalid "submodule ${path} has no URL in .gitmodules"
          [[ "${url}" =~ ^https://github\.com/([A-Za-z0-9_.-]+)/([A-Za-z0-9_.-]+)$ ]] ||
            invalid "private submodule ${path} must use an https://github.com/ URL, not ${url}"
          owner="${BASH_REMATCH[1]}"
          repository="${BASH_REMATCH[2]%.git}"
          [[ "${owner,,}" == "${OWNER,,}" ]] ||
            invalid "private submodule ${path} must be in ${OWNER}, not ${owner}"
          [[ -n "${repository}" && "${repository}" != "." && "${repository}" != ".." ]] ||
            invalid "private submodule ${path} has a malformed repository name"
          [[ "$(git ls-files --stage -- "${path}" | cut -d ' ' -f 1)" == "160000" ]] ||
            invalid "${path} is not a submodule in this commit"
          {
            echo "scope=${owner}/${repository}"
            echo "url=${url}"
          } >> "${GITHUB_OUTPUT}"

      - name: Fetch a read token for the private submodule
        id: private-submodule-token
        if: ${{ inputs.private-submodule != '' }}
        uses: tempoxyz/gh-actions/actions/github-sts@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          scope: ${{ steps.private-submodule.outputs.scope }}
          policy: ${{ inputs.private-submodule-sts-policy }}
          ttl: 5m

      - name: Check out the private submodule
        if: ${{ inputs.private-submodule != '' }}
        shell: bash
        env:
          PRIVATE_SUBMODULE: ${{ inputs.private-submodule }}
          SUBMODULE_URL: ${{ steps.private-submodule.outputs.url }}
          TOKEN: ${{ steps.private-submodule-token.outputs.token }}
        run: |
          set -euo pipefail
          test -n "${TOKEN}"
          auth="$(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.${SUBMODULE_URL}.extraheader" \
          GIT_CONFIG_VALUE_0="Authorization: Basic ${auth}" \
            git -c protocol.allow=never -c protocol.https.allow=always \
              submodule update --init --checkout -- "${PRIVATE_SUBMODULE}"
          git submodule status -- "${PRIVATE_SUBMODULE}"

      - name: Validate build inputs
        id: validate
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          INSTALL_DIRECTORY: ${{ inputs.install-directory || inputs.working-directory }}
          BUILD_COMMAND: ${{ inputs.build-command }}
          WRANGLER_CONFIG: ${{ inputs.wrangler-config }}
          WRANGLER_ENVIRONMENT: ${{ inputs.wrangler-environment }}
          DISPATCH_NAMESPACE: ${{ inputs.dispatch-namespace }}
          D1_MIGRATIONS_DIRECTORY: ${{ inputs.d1-migrations-directory }}
          PUBLISH_CONTAINER_IMAGE: ${{ inputs.publish-container-image }}
          DOCKERHUB_OIDC_CONNECTION_ID: ${{ inputs.dockerhub-oidc-connection-id }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          INSTALL_FILTER: ${{ inputs.install-filter }}
          UNATTESTED_ARTIFACT_DIRECTORY: ${{ inputs.unattested-artifact-directory }}
          # Whether the secret is set, never its value.
          HAS_BUILD_ENVIRONMENT: ${{ secrets.build-environment != '' }}
        run: |
          set -euo pipefail
          # Only the build command receives build-environment, so without one the
          # values would be dropped silently, for example when Wrangler's own
          # build command builds the app.
          if [[ "${HAS_BUILD_ENVIRONMENT}" == "true" && -z "${BUILD_COMMAND}" ]]; then
            echo "::error::build-environment is set, but no build-command would receive it" >&2
            exit 1
          fi
          safe_path='^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'
          [[ "${WORKING_DIRECTORY}" =~ ${safe_path} ]]
          [[ "${UNATTESTED_ARTIFACT_DIRECTORY}" =~ ^$|${safe_path} ]]
          [[ ! "/${UNATTESTED_ARTIFACT_DIRECTORY}/" =~ /\.\.?/ ]]
          INSTALL_DIRECTORY="${INSTALL_DIRECTORY:-${WORKING_DIRECTORY}}"
          [[ "${INSTALL_DIRECTORY}" =~ ${safe_path} ]]
          [[ ! "/${INSTALL_DIRECTORY}/" =~ /\.\./ ]]
          [[ "${WRANGLER_CONFIG}" =~ ${safe_path} ]]
          [[ "${WRANGLER_ENVIRONMENT}" =~ ^$|^[a-z][a-z0-9_-]{0,31}$ ]]
          [[ ! "/${WORKING_DIRECTORY}/" =~ /\.\./ ]]
          [[ ! "/${WRANGLER_CONFIG}/" =~ /\.\./ ]]
          [[ "${DISPATCH_NAMESPACE}" =~ ^$|^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]
          [[ "${D1_MIGRATIONS_DIRECTORY}" =~ ^$|${safe_path}$ ]]
          [[ "${PUBLISH_CONTAINER_IMAGE}" =~ ^(true|false)$ ]]
          [[ "${DOCKERHUB_OIDC_CONNECTION_ID}" =~ ^$|^[0-9a-fA-F-]{36}$ ]]
          [[ "${ARTIFACT_NAME}" =~ ^[a-z0-9]([a-z0-9-]{0,62})$ ]]
          test -d "${WORKING_DIRECTORY}"
          if [[ -z "${BUILD_COMMAND:-}" ]]; then
            test -f "${WORKING_DIRECTORY}/${WRANGLER_CONFIG}"
          fi
          test -f "${INSTALL_DIRECTORY}/package.json"
          # Exactly one supported lockfile selects the package manager. Bun has no
          # pnpm-style version enforcement, so its version must be pinned exactly.
          lockfiles=0
          for lockfile in pnpm-lock.yaml bun.lock package-lock.json; do
            if [[ -e "${INSTALL_DIRECTORY}/${lockfile}" ]]; then lockfiles=$((lockfiles + 1)); fi
          done
          if (( lockfiles > 1 )); then
            echo "::error::install-directory has more than one of pnpm-lock.yaml, bun.lock and package-lock.json" >&2
            exit 1
          fi
          if [[ -f "${INSTALL_DIRECTORY}/pnpm-lock.yaml" ]]; then
            package_manager=pnpm
          elif [[ -f "${INSTALL_DIRECTORY}/package-lock.json" ]]; then
            package_manager=npm
          elif [[ -f "${INSTALL_DIRECTORY}/bun.lock" ]]; then
            bun_version="$(jq -r '.packageManager // ""' "${INSTALL_DIRECTORY}/package.json")"
            if [[ ! "${bun_version}" =~ ^bun@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::a Bun install-directory's package.json must set packageManager to an exact bun@x.y.z" >&2
              exit 1
            fi
            package_manager=bun
          else
            echo "::error::install-directory needs pnpm-lock.yaml, bun.lock or package-lock.json" >&2
            exit 1
          fi
          # Selectors are passed to pnpm as separate arguments, never through a
          # shell, and can't start with "-", so none can be read as another option.
          while read -r selector; do
            [[ -n "${selector}" ]] || continue
            if [[ "${package_manager}" != "pnpm" ]]; then
              echo "::error::install-filter needs a pnpm install-directory" >&2
              exit 1
            fi
            if [[ ! "${selector}" =~ ^[A-Za-z0-9@./_{}!^*][A-Za-z0-9@./_{}!^*-]*$ ]]; then
              echo "::error::install-filter selector ${selector} is malformed" >&2
              exit 1
            fi
          done <<< "${INSTALL_FILTER}"
          echo "package-manager=${package_manager}" >> "${GITHUB_OUTPUT}"
          if [[ "${PUBLISH_CONTAINER_IMAGE}" == "true" ]]; then
            test -n "${DOCKERHUB_OIDC_CONNECTION_ID}"
          fi
          if [[ -n "${D1_MIGRATIONS_DIRECTORY}" ]]; then
            test ! -L "${WORKING_DIRECTORY}/${D1_MIGRATIONS_DIRECTORY}"
            test -d "${WORKING_DIRECTORY}/${D1_MIGRATIONS_DIRECTORY}"
          fi

      - if: ${{ steps.validate.outputs.package-manager == 'pnpm' }}
        uses: tempoxyz/gh-actions/vendor/pnpm/action-setup@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          package_json_file: ${{ inputs.install-directory || inputs.working-directory }}/package.json

      # The version comes from packageManager, validated above. no-cache keeps
      # the Bun executable out of the repository-writable Actions cache.
      - if: ${{ steps.validate.outputs.package-manager == 'bun' }}
        uses: tempoxyz/gh-actions/vendor/oven-sh/setup-bun@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          bun-version-file: ${{ inputs.install-directory || inputs.working-directory }}/package.json
          no-cache: true

      # setup-node keys the pnpm store by the lockfile alone. A filtered install
      # fetches only part of the store, so it would save that part under the key a
      # full install restores; it runs without the cache instead.
      - if: ${{ steps.validate.outputs.package-manager == 'pnpm' && inputs.install-filter == '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: ${{ inputs.install-directory || inputs.working-directory }}/pnpm-lock.yaml

      - if: ${{ steps.validate.outputs.package-manager == 'pnpm' && inputs.install-filter != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false

      - if: ${{ steps.validate.outputs.package-manager != 'pnpm' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false

      - name: Prepare build cache
        if: ${{ inputs.build-cache-paths != '' }}
        id: build-cache
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          INSTALL_DIRECTORY: ${{ inputs.install-directory || inputs.working-directory }}
          BUILD_CACHE_PATHS: ${{ inputs.build-cache-paths }}
          BUILD_CACHE_KEY_FILES: ${{ inputs.build-cache-key-files }}
          # In a reusable workflow these identify the caller. GitHub already
          # scopes caches to a repository; the immutable repository ID keeps
          # keys distinct even if that scoping or a repository name changes.
          REPOSITORY_ID: ${{ github.repository_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          safe_path='^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'
          safe_glob='^[A-Za-z0-9._*-]+(/[A-Za-z0-9._*-]+)*$'
          relative_segment='/(\.|\.\.)/'
          git_segment='/\.git/'
          invalid() {
            echo "::error::$1" >&2
            exit 1
          }
          [[ "${REPOSITORY_ID}" =~ ^[1-9][0-9]*$ ]] || invalid "repository ID is malformed"
          [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]] || invalid "commit SHA is malformed"
          INSTALL_DIRECTORY="${INSTALL_DIRECTORY:-${WORKING_DIRECTORY}}"
          [[ "${INSTALL_DIRECTORY}" =~ ${safe_path} ]] || invalid "install-directory is malformed"
          [[ ! "/${INSTALL_DIRECTORY}/" =~ /\.\./ ]] || invalid "install-directory must stay inside the repository"
          # Validation already required exactly one of these lockfiles.
          lockfile=pnpm-lock.yaml
          if [[ -f "${INSTALL_DIRECTORY}/bun.lock" ]]; then lockfile=bun.lock; fi
          if [[ -f "${INSTALL_DIRECTORY}/package-lock.json" ]]; then lockfile=package-lock.json; fi
          cd "${WORKING_DIRECTORY}"

          paths=()
          while read -r path; do
            [[ -n "${path}" ]] || continue
            if [[ ! "${path}" =~ ${safe_path} ]] ||
              [[ "/${path}/" =~ ${relative_segment} ]] ||
              [[ "/${path}/" =~ ${git_segment} ]]; then
              invalid "build cache path ${path} must be a directory below working-directory"
            fi
            # Restored entries must never replace source the build compiles, including
            # the files of submodules checked out above.
            [[ -z "$(git ls-files --recurse-submodules -- "${path}")" ]] ||
              invalid "build cache path ${path} contains tracked files"
            # The cache is restored before the install, and npm ci deletes
            # node_modules, so a cache there would never be used.
            if [[ "${lockfile}" == "package-lock.json" && "/${path}/" == */node_modules/* ]]; then
              invalid "build cache path ${path} is under node_modules, which npm ci deletes before it installs"
            fi
            paths+=("${path}")
          done <<< "${BUILD_CACHE_PATHS}"
          (( ${#paths[@]} > 0 )) || invalid "build-cache-paths lists no directories"

          pathspecs=(package.json)
          # The shared lockfile may live above the app. Top-anchored pathspecs
          # keep it in the cache key without allowing caller-supplied traversal.
          install_prefix="${INSTALL_DIRECTORY#./}"
          if [[ "${install_prefix}" == "." ]]; then install_prefix=""; else install_prefix="${install_prefix}/"; fi
          pathspecs+=(":(top)${install_prefix}package.json" ":(top)${install_prefix}${lockfile}")
          while read -r pattern; do
            [[ -n "${pattern}" ]] || continue
            if [[ ! "${pattern}" =~ ${safe_glob} ]] ||
              [[ "/${pattern}/" =~ ${relative_segment} ]]; then
              invalid "build cache key file ${pattern} must be a glob below working-directory"
            fi
            pathspecs+=(":(glob)${pattern}")
          done <<< "${BUILD_CACHE_KEY_FILES}"

          # Every pattern must match a tracked file so a typo cannot silently
          # share one cache across configuration changes.
          git ls-files --error-unmatch -- "${pathspecs[@]}" > /dev/null ||
            invalid "every build cache key file pattern must match a tracked file"
          digest="$(
            {
              printf 'directory %s\n' "${WORKING_DIRECTORY}"
              printf 'path %s\n' "${paths[@]}"
              git ls-files -z -- "${pathspecs[@]}" \
                | LC_ALL=C sort -z \
                | xargs -0 sha256sum
            } | sha256sum | cut -d ' ' -f 1
          )"
          prefix="worker-build-v1-${REPOSITORY_ID}-${RUNNER_OS}-${digest}-"
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "key=${prefix}${COMMIT_SHA}"
            echo "restore-key=${prefix}"
            echo "paths<<${delimiter}"
            for path in "${paths[@]}"; do
              if [[ "${WORKING_DIRECTORY}" == "." ]]; then
                echo "${path}"
              else
                echo "${WORKING_DIRECTORY}/${path}"
              fi
            done
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

      - name: Restore build cache
        if: ${{ inputs.build-cache-paths != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.build-cache.outputs.paths }}
          key: ${{ steps.build-cache.outputs.key }}
          restore-keys: ${{ steps.build-cache.outputs.restore-key }}

      # Like build-command, this runs the repository's own code in this job with
      # no provider credentials. It can do nothing build-command can't already.
      - name: Prepare dependencies
        if: ${{ inputs.pre-install-command != '' }}
        shell: bash
        working-directory: ${{ inputs.install-directory || inputs.working-directory }}
        env:
          PRE_INSTALL_COMMAND: ${{ inputs.pre-install-command }}
        run: |
          set -euo pipefail
          bash --noprofile --norc -eo pipefail -c "${PRE_INSTALL_COMMAND}"

      - name: Install dependencies
        shell: bash
        env:
          INSTALL_DIRECTORY: ${{ inputs.install-directory || inputs.working-directory }}
          PACKAGE_MANAGER: ${{ steps.validate.outputs.package-manager }}
          INSTALL_FILTER: ${{ inputs.install-filter }}
        run: |
          set -euo pipefail
          cd "${INSTALL_DIRECTORY}"
          if [[ "${PACKAGE_MANAGER}" == "npm" ]]; then
            # npm ci installs exactly the lockfile. No dependency install script
            # runs, and npm cannot exempt the root package, so a project runs
            # its own lifecycle scripts from build-command.
            npm ci --ignore-scripts --no-audit --no-fund
          else
            # Validation allowed install-filter only for pnpm.
            args=(install --frozen-lockfile)
            while read -r selector; do
              [[ -n "${selector}" ]] || continue
              args+=(--filter "${selector}")
            done <<< "${INSTALL_FILTER}"
            "${PACKAGE_MANAGER}" "${args[@]}"
          fi

      # build-environment reaches only this step, and only the build command's
      # process: it is exported in this shell, never passed as arguments, and the
      # raw secret is unset first. The build command is the caller's own code,
      # which its other jobs can already run with the same secrets. GitHub masks
      # a multi-line secret line by line, so `NAME=value` but not a bare `value`;
      # each value is masked on its own before the build command can print it.
      - name: Build application
        if: ${{ inputs.build-command != '' }}
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
          BUILD_ENVIRONMENT: ${{ secrets.build-environment }}
        run: |
          set -euo pipefail
          names=()
          while IFS= read -r line || [[ -n "${line}" ]]; do
            # A secret saved with CRLF line endings would otherwise export each
            # value with a trailing carriage return.
            line="${line%$'\r'}"
            [[ -n "${line}" ]] || continue
            name="${line%%=*}"
            if [[ "${line}" != *=* || ! "${name}" =~ ^[A-Z][A-Z0-9_]{0,63}$ ]]; then
              echo "::error::build-environment lines must be NAME=value with an upper-case NAME" >&2
              exit 1
            fi
            case "${name}" in
              GITHUB_* | RUNNER_* | ACTIONS_* | INPUT_* | STATE_* | BASH_* | LD_* | DYLD_* | \
                CI | HOME | PATH | SHELL | PWD | OLDPWD | TMPDIR | ENV | IFS | PS4 | SHELLOPTS | \
                NODE_OPTIONS | NODE_PATH | NODE_EXTRA_CA_CERTS | BUILD_COMMAND | BUILD_ENVIRONMENT)
                echo "::error::build-environment cannot set ${name}" >&2
                exit 1
                ;;
            esac
            [[ ! " ${names[*]} " == *" ${name} "* ]] || {
              echo "::error::build-environment sets ${name} twice" >&2
              exit 1
            }
            names+=("${name}")
            value="${line#*=}"
            # Workflow commands unescape %25, so escape a literal % first.
            if [[ -n "${value}" ]]; then echo "::add-mask::${value//%/%25}"; fi
            export "${name}=${value}"
          done <<< "${BUILD_ENVIRONMENT}"
          unset BUILD_ENVIRONMENT line value
          if (( ${#names[@]} > 0 )); then echo "build-environment sets ${names[*]}"; fi
          bash --noprofile --norc -eo pipefail -c "${BUILD_COMMAND}"

      - name: Log in to Docker Hub via OIDC
        if: ${{ inputs.publish-container-image }}
        uses: tempoxyz/gh-actions/vendor/docker/login-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ inputs.dockerhub-oidc-connection-id }}
        with:
          username: tempoxyz

      - name: Build and publish Container image
        if: ${{ inputs.publish-container-image }}
        id: publish-container
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          WRANGLER_CONFIG: ${{ inputs.wrangler-config }}
          WRANGLER_ENVIRONMENT: ${{ inputs.wrangler-environment }}
        run: |
          set -euo pipefail
          cd "${WORKING_DIRECTORY}"
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { lstatSync, readFileSync, writeFileSync } from "node:fs";
          import { dirname, relative, resolve } from "node:path";
          import { unstable_readConfig } from "wrangler";

          function invariant(condition, message) {
            if (!condition) throw new Error(message);
          }
          const root = resolve(".");
          const configPath = resolve(process.env.WRANGLER_CONFIG);
          const environment = process.env.WRANGLER_ENVIRONMENT ?? "";
          const config = unstable_readConfig(
            { config: configPath, ...(environment === "" ? {} : { env: environment }) },
            { hideWarnings: true },
          );
          invariant(Array.isArray(config.containers) && config.containers.length === 1, "Container publishing requires exactly one Wrangler Container");
          const container = config.containers[0];
          invariant(typeof config.account_id === "string" && /^[0-9a-f]{32}$/.test(config.account_id), "Wrangler account_id must be explicit");
          invariant(typeof container.name === "string" && /^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(container.name), "Container name is invalid");
          invariant(typeof container.image === "string", "Container image must name a Dockerfile");
          const dockerfile = resolve(dirname(configPath), container.image);
          const context = resolve(dirname(configPath), container.image_build_context ?? dirname(container.image));
          for (const [path, kind] of [[dockerfile, "Dockerfile"], [context, "build context"]]) {
            const rel = relative(root, path);
            invariant(rel !== "" || kind === "build context", `${kind} must be within working-directory`);
            invariant(!rel.startsWith("..") && !rel.includes("/../"), `${kind} must be within working-directory`);
            invariant(!lstatSync(path).isSymbolicLink(), `${kind} cannot be a symlink`);
          }
          invariant(lstatSync(dockerfile).isFile(), "Container image must be a Dockerfile");
          invariant(lstatSync(context).isDirectory(), "Container build context must be a directory");
          const buildArgs = [];
          for (const [name, value] of Object.entries(container.image_vars ?? {}).sort(([left], [right]) => left.localeCompare(right))) {
            invariant(/^[A-Z][A-Z0-9_]{0,63}$/.test(name) && typeof value === "string" && value.length <= 4096, "Container image build arguments are invalid");
            buildArgs.push("--build-arg", `${name}=${value}`);
          }
          const repository = `docker.io/tempoxyz/${container.name}`;
          const tag = `${process.env.GITHUB_SHA}-${process.env.GITHUB_RUN_ATTEMPT}`;
          const metadata = resolve(process.env.RUNNER_TEMP, "container-build-metadata.json");
          const build = spawnSync("docker", [
            "buildx", "build",
            "--file", dockerfile,
            "--platform", "linux/amd64",
            "--provenance=false",
            "--sbom=false",
            "--push",
            "--metadata-file", metadata,
            "--tag", `${repository}:${tag}`,
            ...buildArgs,
            context,
          ], { stdio: "inherit" });
          if (build.error) throw build.error;
          if (build.status !== 0) throw new Error(`docker buildx build failed with status ${build.status}`);
          const result = JSON.parse(readFileSync(metadata, "utf8"));
          const digest = result["containerimage.digest"];
          invariant(typeof digest === "string" && /^sha256:[0-9a-f]{64}$/.test(digest), "Docker did not return a valid image digest");
          writeFileSync(process.env.GITHUB_OUTPUT, `image-reference=${repository}@${digest}\nimage-digest=${digest}\n`, { flag: "a" });
          NODE

      - name: Build Worker module
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          WRANGLER_CONFIG: ${{ inputs.wrangler-config }}
          WRANGLER_ENVIRONMENT: ${{ inputs.wrangler-environment }}
          DISPATCH_NAMESPACE: ${{ inputs.dispatch-namespace }}
          PACKAGE_MANAGER: ${{ steps.validate.outputs.package-manager }}
        run: |
          set -euo pipefail
          outdir="${RUNNER_TEMP}/cloudflare-worker-build"
          install -d "${outdir}"
          args=(deploy --dry-run --containers-rollout=none --config "${WRANGLER_CONFIG}" --outdir "${outdir}")
          if [[ -n "${WRANGLER_ENVIRONMENT}" ]]; then
            args+=(--env "${WRANGLER_ENVIRONMENT}")
          fi
          if [[ -n "${DISPATCH_NAMESPACE}" ]]; then
            args+=(--dispatch-namespace "${DISPATCH_NAMESPACE}")
          fi
          cd "${WORKING_DIRECTORY}"
          if [[ "${PACKAGE_MANAGER}" == "bun" ]]; then
            # --no-install runs only the locked Wrangler, never one bunx downloads.
            bun x --no-install wrangler "${args[@]}"
          elif [[ "${PACKAGE_MANAGER}" == "npm" ]]; then
            # --no runs only the locked Wrangler, never one npx downloads.
            npm exec --no -- wrangler "${args[@]}"
          else
            pnpm exec wrangler "${args[@]}"
          fi

      - name: Stage and hash Worker module
        id: prepare
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          WRANGLER_CONFIG: ${{ inputs.wrangler-config }}
          WRANGLER_ENVIRONMENT: ${{ inputs.wrangler-environment }}
        run: |
          set -euo pipefail
          cd "${WORKING_DIRECTORY:-.}"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { lstatSync, mkdirSync, readdirSync, readFileSync, writeFileSync } from "node:fs";
          import { dirname, join, parse, posix, relative, resolve } from "node:path";

          // The broker uploads index.js plus, when Wrangler emits them, the
          // additional modules its bundle imports (ES module chunks, Text,
          // Data and CompiledWasm). Every additional module is listed in an
          // attested manifest; single-module builds emit no manifest.
          const MAX_MODULES = 1000;
          const MAX_TOTAL_BYTES = 64 * 1024 * 1024;
          const build = resolve(process.env.RUNNER_TEMP, "cloudflare-worker-build");
          const artifact = resolve(process.env.RUNNER_TEMP, "cloudflare-worker-artifact");
          const output = process.env.GITHUB_OUTPUT;
          const codeUnit = (left, right) => (left < right ? -1 : left > right ? 1 : 0);
          let config;
          async function wranglerConfig() {
            if (config === undefined) {
              const { unstable_readConfig } = await import("wrangler");
              const environment = process.env.WRANGLER_ENVIRONMENT ?? "";
              config = unstable_readConfig(
                { config: resolve(process.env.WRANGLER_CONFIG), ...(environment === "" ? {} : { env: environment }) },
                { hideWarnings: true },
              );
            }
            return config;
          }

          const files = [];
          (function walk(directory) {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name);
              const name = relative(build, path).split("\\").join("/");
              const stat = lstatSync(path);
              if (stat.isSymbolicLink()) throw new Error(`Wrangler output contains a symlink: ${name}`);
              if (stat.isDirectory()) walk(path);
              else if (stat.isFile()) files.push(name);
              else throw new Error(`Wrangler output contains an unsupported file: ${name}`);
            }
          })(build);
          // Wrangler writes its bundle as <main name>.js and, under no_bundle,
          // copies the entry under its own file name. Only that file can be the
          // main module; any other top-level script is an additional module.
          const { main: entry, no_bundle: noBundle } = await wranglerConfig();
          if (typeof entry !== "string" || entry === "") throw new Error("Wrangler configuration has no main module");
          const main = noBundle === true ? parse(entry).base : `${parse(entry).name}.js`;
          if (!/\.m?js$/.test(main)) throw new Error(`Worker main module ${main} is not JavaScript`);
          if (!files.includes(main)) throw new Error(`Wrangler output does not contain the main module ${main}`);
          const present = new Set(files);
          // Source maps are never uploaded. README.md is Wrangler's own note.
          const additional = files
            .filter((name) => name !== main && name !== "README.md" && !(name.endsWith(".map") && present.has(name.slice(0, -4))))
            .sort(codeUnit);

          mkdirSync(artifact, { recursive: true });
          const mainBytes = readFileSync(join(build, main));
          writeFileSync(join(artifact, "index.js"), mainBytes, { mode: 0o644 });
          if (mainBytes.byteLength === 0) throw new Error("Worker main module is empty");
          let lines = `module-digest=${createHash("sha256").update(mainBytes).digest("hex")}\n`;

          if (additional.length > 0) {
            if (additional.length > MAX_MODULES) throw new Error(`Wrangler emitted ${additional.length} additional modules; at most ${MAX_MODULES} are supported`);
            // Wrangler matches a rule glob against the import specifier or the
            // source path, and neither survives into its output; only the file
            // name does. A **/*<suffix> or **/<file name> glob depends on the
            // file name alone, so only those can be classified exactly as
            // Wrangler did. Any other configured glob fails the build.
            const matcher = (glob) => {
              const match = /^\*\*\/(\*?)([A-Za-z0-9._-]+)$/.exec(glob);
              if (match === null) {
                throw new Error(`Wrangler module rule glob ${JSON.stringify(glob)} is unsupported; use **/*<suffix> or **/<file name>`);
              }
              const [, star, tail] = match;
              return star === "" ? (file) => file === tail : (file) => file.endsWith(tail);
            };
            const configured = (await wranglerConfig()).rules ?? [];
            // Wrangler's default rules follow the configured ones. The builder
            // also accepts ES module files, which Wrangler emits only through a
            // configured rule, and names CommonJS so that it fails clearly.
            // Wrangler strips the ?module query from module names, so **/*.wasm
            // covers its **/*.wasm?module default.
            const defaults = [
              { type: "Text", globs: ["**/*.txt", "**/*.html", "**/*.sql"] },
              { type: "Data", globs: ["**/*.bin"] },
              { type: "CompiledWasm", globs: ["**/*.wasm"] },
              { type: "ESModule", globs: ["**/*.js", "**/*.mjs"] },
              { type: "CommonJS", globs: ["**/*.cjs"] },
            ];
            // As in Wrangler's parseRules, a rule without fallthrough: true
            // removes every later rule of the same type.
            const completed = new Set();
            const rules = [];
            for (const rule of [...configured, ...defaults]) {
              if (completed.has(rule.type)) continue;
              rules.push({ type: rule.type, matchers: (rule.globs ?? []).map(matcher) });
              if (rule.fallthrough !== true) completed.add(rule.type);
            }
            const types = { ESModule: "esm", Text: "text", Data: "data", CompiledWasm: "compiled-wasm" };
            const classify = (name) => {
              // Wrangler prefixes copied non-JavaScript modules with a 40-hex content hash.
              const file = posix.basename(name).replace(/^[0-9a-f]{40}-/, "");
              for (const rule of rules) {
                if (!rule.matchers.some((matches) => matches(file))) continue;
                const type = types[rule.type];
                if (type === undefined) throw new Error(`Wrangler module ${name} has type ${rule.type}, which the deploy broker does not upload`);
                return type;
              }
              throw new Error(`Wrangler module ${name} matches no module rule`);
            };
            // The broker uploads the main module as index.js. An additional ES
            // module that imports it by Wrangler's file name would reference a
            // module that is never uploaded.
            const mainReferences = main === "index.js" ? [] : ['"', "'", "`"].map((quote) => `/${main}${quote}`);
            let totalBytes = mainBytes.byteLength;
            const modules = [];
            for (const name of additional) {
              const segments = name.split("/");
              if (
                !/^[A-Za-z0-9._-]+(?:\/[A-Za-z0-9._-]+)*$/.test(name) ||
                name.length > 256 ||
                name === "index.js" ||
                segments.some((segment) => segment === "." || segment === ".." || segment.length > 128)
              ) {
                throw new Error(`Wrangler module has an unsafe name: ${name}`);
              }
              const type = classify(name);
              const bytes = readFileSync(join(build, name));
              if (type === "esm") {
                const source = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
                if (mainReferences.some((reference) => source.includes(reference))) {
                  throw new Error(`Wrangler module ${name} references the main module as ${main}, which the deploy broker uploads as index.js`);
                }
              }
              totalBytes += bytes.byteLength;
              const staged = join(artifact, "modules", name);
              mkdirSync(dirname(staged), { recursive: true });
              writeFileSync(staged, bytes, { mode: 0o644 });
              modules.push({ name, type, sha256: createHash("sha256").update(bytes).digest("hex"), size: bytes.byteLength });
            }
            if (totalBytes > MAX_TOTAL_BYTES) throw new Error(`Worker modules total ${totalBytes} bytes; at most ${MAX_TOTAL_BYTES} are supported`);
            const manifest = `${JSON.stringify({ schemaVersion: 1, modules })}\n`;
            writeFileSync(join(artifact, "worker-modules.json"), manifest, { mode: 0o644 });
            lines += `modules-enabled=true\nmodules-digest=${createHash("sha256").update(manifest).digest("hex")}\n`;
          }
          writeFileSync(output, lines, { flag: "a" });
          NODE

      - name: Attest Worker module
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: index.js
          subject-digest: sha256:${{ steps.prepare.outputs.module-digest }}
          show-summary: false

      - name: Attest additional Worker modules
        if: ${{ steps.prepare.outputs.modules-enabled == 'true' }}
        id: attest-modules
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: worker-modules.json
          subject-digest: sha256:${{ steps.prepare.outputs.modules-digest }}
          show-summary: false

      - name: Stage and hash static assets
        id: prepare-assets
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          WRANGLER_CONFIG: ${{ inputs.wrangler-config }}
          WRANGLER_ENVIRONMENT: ${{ inputs.wrangler-environment }}
        run: |
          set -euo pipefail
          cd "${WORKING_DIRECTORY}"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import {
            copyFileSync,
            existsSync,
            lstatSync,
            mkdirSync,
            readFileSync,
            readdirSync,
            writeFileSync,
          } from "node:fs";
          import { dirname, extname, join, posix, relative, resolve } from "node:path";
          import { unstable_readConfig } from "wrangler";

          const output = process.env.GITHUB_OUTPUT;
          const configPath = resolve(process.env.WRANGLER_CONFIG);
          const environment = process.env.WRANGLER_ENVIRONMENT ?? "";
          const config = unstable_readConfig(
            { config: configPath, ...(environment === "" ? {} : { env: environment }) },
            { hideWarnings: true },
          );
          if (config.assets === undefined) {
            writeFileSync(output, "assets-enabled=false\n", { flag: "a" });
            process.exit(0);
          }
          if (typeof config.assets.directory !== "string" || typeof config.assets.binding !== "string") {
            throw new Error("static assets require explicit directory and binding values");
          }
          const root = resolve(dirname(configPath), config.assets.directory);
          if (!lstatSync(root).isDirectory()) throw new Error("static asset directory is not a directory");
          if (existsSync(join(root, ".assetsignore"))) {
            throw new Error(".assetsignore is not supported by the deploy broker");
          }
          const artifactRoot = resolve(process.env.RUNNER_TEMP, "cloudflare-worker-artifact");
          const stagedRoot = resolve(artifactRoot, "static-assets");
          const mediaTypes = new Map(Object.entries({
            ".css": "text/css; charset=utf-8",
            ".csv": "text/csv; charset=utf-8",
            ".gif": "image/gif",
            ".htm": "text/html; charset=utf-8",
            ".html": "text/html; charset=utf-8",
            ".ico": "image/x-icon",
            ".jpeg": "image/jpeg",
            ".jpg": "image/jpeg",
            ".js": "text/javascript; charset=utf-8",
            ".json": "application/json",
            ".map": "application/json",
            ".mjs": "text/javascript; charset=utf-8",
            ".png": "image/png",
            ".svg": "image/svg+xml",
            ".txt": "text/plain; charset=utf-8",
            ".wasm": "application/wasm",
            ".webp": "image/webp",
            ".woff": "font/woff",
            ".woff2": "font/woff2",
            ".xml": "application/xml",
          }));
          const files = [];
          function walk(directory) {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name);
              const stat = lstatSync(path);
              const name = relative(root, path).split("/").join(posix.sep);
              if (stat.isSymbolicLink()) throw new Error(`static asset path is a symlink: ${name}`);
              if (stat.isDirectory()) {
                walk(path);
                continue;
              }
              if (!stat.isFile() || ["_headers", "_redirects"].includes(name)) continue;
              if (name === "_worker.js" || name.startsWith("_worker.js/")) {
                throw new Error("static assets cannot expose a Pages _worker.js file");
              }
              const segments = name.split("/");
              if (!/^[A-Za-z0-9._-]+(?:\/[A-Za-z0-9._-]+)*$/.test(name) || segments.some((segment) => segment === "." || segment === ".." || segment.length > 128) || name.length > 511) {
                throw new Error(`static asset has an unsafe name: ${name}`);
              }
              const bytes = readFileSync(path);
              // Cloudflare's per-file asset limit; each policy sets its own lower limit.
              if (bytes.byteLength > 25 * 1024 * 1024) {
                throw new Error(`static asset has an invalid size: ${name}`);
              }
              const staged = resolve(stagedRoot, name);
              mkdirSync(dirname(staged), { recursive: true });
              copyFileSync(path, staged);
              files.push({
                path: `/${name}`,
                sha256: createHash("sha256").update(bytes).digest("hex"),
                size: bytes.byteLength,
                mediaType: mediaTypes.get(extname(name).toLowerCase()) ?? null,
              });
            }
          }
          walk(root);
          // The broker requires code-unit order; localeCompare sorts by locale
          // collation, which orders "index-a.css" before "Pilat.woff2".
          files.sort((left, right) => (left.path < right.path ? -1 : left.path > right.path ? 1 : 0));
          const totalBytes = files.reduce((total, file) => total + file.size, 0);
          // The largest asset sets the broker accepts; each policy sets its own limits.
          if (files.length === 0 || files.length > 20000 || totalBytes > 256 * 1024 * 1024) {
            throw new Error("static asset directory exceeds broker limits");
          }
          function optionalUtf8(name) {
            const path = join(root, name);
            if (!existsSync(path)) return null;
            const bytes = readFileSync(path);
            if (bytes.byteLength > 128 * 1024) throw new Error(`${name} exceeds 128 KiB`);
            return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
          }
          const manifest = `${JSON.stringify({
            schemaVersion: 1,
            files,
            headers: optionalUtf8("_headers"),
            redirects: optionalUtf8("_redirects"),
          })}\n`;
          if (Buffer.byteLength(manifest) > 4 * 1024 * 1024) {
            throw new Error("static asset manifest exceeds 4 MiB");
          }
          writeFileSync(resolve(artifactRoot, "static-assets.json"), manifest, { mode: 0o644 });
          const digest = createHash("sha256").update(manifest).digest("hex");
          writeFileSync(output, `assets-enabled=true\nassets-digest=${digest}\n`, { flag: "a" });
          NODE

      - name: Attest static asset manifest
        if: ${{ steps.prepare-assets.outputs.assets-enabled == 'true' }}
        id: attest-assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: static-assets.json
          subject-digest: sha256:${{ steps.prepare-assets.outputs.assets-digest }}
          show-summary: false

      - name: Stage and hash Worker configuration
        id: prepare-configuration
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          D1_MIGRATIONS_DIRECTORY: ${{ inputs.d1-migrations-directory }}
          WRANGLER_CONFIG: ${{ inputs.wrangler-config }}
          WRANGLER_ENVIRONMENT: ${{ inputs.wrangler-environment }}
          DISPATCH_NAMESPACE: ${{ inputs.dispatch-namespace }}
          CONTAINER_IMAGE_REFERENCE: ${{ steps.publish-container.outputs.image-reference }}
        run: |
          set -euo pipefail
          cd "${WORKING_DIRECTORY}"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { writeFileSync } from "node:fs";
          import { dirname, resolve } from "node:path";
