name: Action Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write

jobs:
  discover:
    name: Discover action tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    outputs:
      tests: ${{ steps.tests.outputs.tests }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@392079a54ac0240e1b21417eca38b7c0a50bf55d # 2026-10-01T18-10-09Z-392079a5

      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          persist-credentials: false

      - name: Find action tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          tests=$(find actions -type f -name '*.test.js' -print | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if [ "$tests" = "[]" ]; then
            echo "::error::No action tests found"
            exit 1
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.test }}
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover.outputs.tests) }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@392079a54ac0240e1b21417eca38b7c0a50bf55d # 2026-10-01T18-10-09Z-392079a5

      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          persist-credentials: false

      - name: Run action test
        env:
          TEST_FILE: ${{ matrix.test }}
          AEGIS_LIVE_GITHUB_OIDC: ${{ matrix.test == 'actions/aegis/github-oidc.test.js' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'true' || 'false' }}
        run: node --test "$TEST_FILE"

  tests-passed:
    name: tests-passed
    if: ${{ always() }}
    needs: [discover, test, cargo-dependency-changes]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@392079a54ac0240e1b21417eca38b7c0a50bf55d # 2026-10-01T18-10-09Z-392079a5

      - name: Check matrix results
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          CARGO_RESULT: ${{ needs.cargo-dependency-changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          if [[ "$DISCOVER_RESULT" != "success" || "$TEST_RESULT" != "success" || "$CARGO_RESULT" != "success" ]]; then
            echo "::error::Action tests failed (discover=$DISCOVER_RESULT, tests=$TEST_RESULT)"
            exit 1
          fi
          echo "All action tests passed"

  cargo-dependency-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@392079a54ac0240e1b21417eca38b7c0a50bf55d # 2026-10-01T18-10-09Z-392079a5
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s actions/cargo-dependency-changes -v
