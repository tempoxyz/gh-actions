name: Action Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write

jobs:
  discover:
    name: Discover action tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    outputs:
      tests: ${{ steps.tests.outputs.tests }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d0bd3f715fb4efadb78897db98fe87e7c94a6d95 # 2026-09-25T07-58-59Z-d0bd3f71

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find action tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          tests=$(find actions -type f -name '*.test.js' -print | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if [ "$tests" = "[]" ]; then
            echo "::error::No action tests found"
            exit 1
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.test }}
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover.outputs.tests) }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d0bd3f715fb4efadb78897db98fe87e7c94a6d95 # 2026-09-25T07-58-59Z-d0bd3f71

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run action test
        env:
          TEST_FILE: ${{ matrix.test }}
          AEGIS_LIVE_GITHUB_OIDC: ${{ matrix.test == 'actions/socket-firewall/github-oidc.test.js' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'true' || 'false' }}
        run: node --test "$TEST_FILE"

  tests-passed:
    name: tests-passed
    if: ${{ always() }}
    needs: [discover, test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d0bd3f715fb4efadb78897db98fe87e7c94a6d95 # 2026-09-25T07-58-59Z-d0bd3f71

      - name: Check matrix results
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          if [[ "$DISCOVER_RESULT" != "success" || "$TEST_RESULT" != "success" ]]; then
            echo "::error::Action tests failed (discover=$DISCOVER_RESULT, tests=$TEST_RESULT)"
            exit 1
          fi
          echo "All action tests passed"
