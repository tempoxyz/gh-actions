name: Action Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write

jobs:
  discover:
    name: Discover action tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    outputs:
      tests: ${{ steps.tests.outputs.tests }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@aaec1d2a49380949d267946d343f0cb9440248b7 # 2026-10-16T03-27-40Z-aaec1d2a

      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          persist-credentials: false

      - name: Find action tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          tests=$(find actions -type f -name '*.test.js' -print | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if [ "$tests" = "[]" ]; then
            echo "::error::No action tests found"
            exit 1
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.test }}
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover.outputs.tests) }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@aaec1d2a49380949d267946d343f0cb9440248b7 # 2026-10-16T03-27-40Z-aaec1d2a

      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          persist-credentials: false

      - name: Run action test
        env:
          TEST_FILE: ${{ matrix.test }}
          AEGIS_LIVE_GITHUB_OIDC: ${{ matrix.test == 'actions/aegis/github-oidc.test.js' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'true' || 'false' }}
        run: node --test "$TEST_FILE"

  tests-passed:
    name: tests-passed
    if: ${{ always() }}
    needs: [discover, test, cargo-dependency-changes, dependency-update-runner]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@aaec1d2a49380949d267946d343f0cb9440248b7 # 2026-10-16T03-27-40Z-aaec1d2a

      - name: Check matrix results
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          CARGO_RESULT: ${{ needs.cargo-dependency-changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RUNNER_RESULT: ${{ needs.dependency-update-runner.result }}
        run: |
          set -euo pipefail
          if [[ "$DISCOVER_RESULT" != "success" || "$TEST_RESULT" != "success" || "$CARGO_RESULT" != "success" || "$RUNNER_RESULT" != "success" ]]; then
            echo "::error::Action tests failed (discover=$DISCOVER_RESULT, tests=$TEST_RESULT, runner=$RUNNER_RESULT)"
            exit 1
          fi
          echo "All action tests passed"

  cargo-dependency-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@aaec1d2a49380949d267946d343f0cb9440248b7 # 2026-10-16T03-27-40Z-aaec1d2a
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s actions/cargo-dependency-changes -v

  dependency-update-runner:
    name: Dependency update runner smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@aaec1d2a49380949d267946d343f0cb9440248b7 # 2026-10-16T03-27-40Z-aaec1d2a
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          persist-credentials: false
      - name: Install updater tools
        env:
          RUST_TOOLCHAINS: "1.99.0 nightly-2026-08-21"
          NEXTEST_VERSION: "0.9.127"
          CODEX_VERSION: "0.162.0"
          NATIVE_PACKAGES: build-essential pkg-config libssl-dev clang libclang-dev mold
        run: python3 -I actions/dependency-update/setup_tools.py
      - name: Install cargo-nextest
        uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@aaec1d2a49380949d267946d343f0cb9440248b7 # 2026-10-16T03-27-40Z-aaec1d2a
        with:
          tool: cargo-nextest@0.9.127
      - name: Exercise direct runner commands
        run: python3 actions/codex-repair/smoke.py
