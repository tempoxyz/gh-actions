name: Test

# Integration tests for the scan-github-actions composite action. Distinct from
# ci.yml (which already dogfoods the reusable read-only path on this repo): this
# suite exercises the composite path (untested by ci.yml) with a clean fixture
# and a negative fixture, plus reusable/composite pin parity. The SARIF upload
# path is intentionally not exercised here so this repo's code scanning stays
# clean.
#
# All checks run in a single job so the suite surfaces as one status check
# (`Test / integration`), which can be marked required in branch protection.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test PR audit comment authorization
        run: node --test actions/pr-audit-comment/pr_audit_comment.test.js

      # Guard: the reusable workflow and composite action must pin identical tool
      # versions, since they duplicate the zizmor + actionlint steps.
      - name: Assert reusable/composite pins match
        run: |
          set -euo pipefail
          reusable=.github/workflows/scan-github-actions.yml
          composite=actions/scan-github-actions/action.yml
          status=0
          for tool in zizmorcore/zizmor-action; do
            r=$(grep -oE "${tool}@[^ ]+" "$reusable" | sort -u || true)
            c=$(grep -oE "${tool}@[^ ]+" "$composite" | sort -u || true)
            if [ -z "$r" ] || [ -z "$c" ]; then
              echo "::error::missing pin for ${tool} (reusable='$r' composite='$c')"
              status=1
            elif [ "$r" != "$c" ]; then
              echo "::error::${tool} pin differs (reusable='$r' composite='$c')"
              status=1
            else
              echo "ok: ${tool} -> $r"
            fi
          done
          # The three actionlint installers (reusable workflow, scan composite, standalone composite)
          # must pin the same release and tarball digests.
          for var in ACTIONLINT_VERSION SHA256; do
            r=$(grep -oE "${var}=\"[^\"]+\"" "$reusable" | sort -u | tr '\n' ' ')
            c=$(grep -oE "${var}=\"[^\"]+\"" "$composite" | sort -u | tr '\n' ' ')
            a=$(grep -oE "${var}=\"[^\"]+\"" actions/actionlint/action.yml | sort -u | tr '\n' ' ')
            if [ -z "$r" ] || [ "$r" != "$c" ] || [ "$r" != "$a" ]; then
              echo "::error::actionlint $var differs (reusable='$r' scan-composite='$c' actionlint-composite='$a')"
              status=1
            else
              echo "ok: actionlint $var -> $r"
            fi
          done
          exit "$status"

      # Guard the reusable workflow wiring that the integration steps below
      # cannot invoke directly from within this job.
      - name: Assert reusable Pinact policy wiring
        run: |
          set -euo pipefail
          workflow=.github/workflows/scan-github-actions.yml
          input=$(sed -n '/^      pin-min-age:/,/^$/p' "$workflow")
          resolver=$(sed -n '/- name: Resolve pinact config/,/- name: Check action pin policy/p' "$workflow")
          action=$(sed -n '/- name: Check action pin policy/,/- name: Scan GitHub Actions/p' "$workflow")

          grep -q 'type: number' <<< "$input"
          grep -q 'default: 7' <<< "$input"
          grep -q 'MIN_AGE:.*inputs.pin-min-age' <<< "$resolver"
          grep -q "printf 'version: 3.*min_age:.*value: %s" <<< "$resolver"
          grep -q 'PINACT_GLOBAL_CONFIG:.*steps.pinact-config.outputs.global-config' <<< "$action"

      # Guard: the reusable workflow installs pinact inline (see the comment there) and
      # actions/setup-pinact installs it for everyone else; both must pin the same release.
      - name: Assert installer pins match between reusable workflows and composites
        run: |
          set -euo pipefail
          r=$(grep -oE 'PINACT_VERSION: v[0-9.]+' .github/workflows/scan-github-actions.yml | head -1 | awk '{print $2}')
          c=$(yq -r '.inputs.version.default' actions/setup-pinact/action.yml)
          if [ -z "$r" ] || [ "$r" != "$c" ]; then
            echo "::error::pinact version differs (reusable='$r' composite='$c')"
            exit 1
          fi
          echo "ok: pinact -> $r"
          rs=$(grep -oE -- '--signer-workflow \S+' .github/workflows/scan-github-actions.yml | head -1)
          cs=$(grep -oE -- '--signer-workflow \S+' actions/setup-pinact/action.yml | head -1)
          if [ -z "$rs" ] || [ "$rs" != "$cs" ]; then
            echo "::error::pinact attestation signer differs (reusable='$rs' composite='$cs')"
            exit 1
          fi
          echo "ok: attestation signer -> ${rs#--signer-workflow }"
          # mold: the inline installs in the reusable workflows must pin the same version and
          # digests as actions/setup-rust-build.
          for wf in .github/workflows/rust-build-binaries.yml .github/workflows/rust-lint.yml actions/setup-mold/action.yml; do
            for var in MOLD_VERSION MOLD_SHA256_X86_64 MOLD_SHA256_AARCH64; do
              r=$(grep -oE "$var: \"?[0-9a-f.]+\"?" "$wf" | head -1 | tr -d '"')
              c=$(grep -oE "$var: \"?[0-9a-f.]+\"?" actions/setup-rust-build/action.yml | head -1 | tr -d '"')
              if [ -z "$r" ] || [ "$r" != "$c" ]; then
                echo "::error::$var differs ($wf='$r' composite='$c')"
                exit 1
              fi
            done
          done
          echo "ok: mold -> $(grep -oE 'MOLD_VERSION: "?[0-9.]+"?' actions/setup-rust-build/action.yml | tr -d '"' | awk '{print $2}')"
          # typos: the inline install in rust-lint must pin the same release as actions/typos.
          tr_=$(grep -oE 'TYPOS_VERSION: v[0-9.]+' .github/workflows/rust-lint.yml | head -1 | awk '{print $2}')
          tc=$(yq -r '.inputs.version.default' actions/typos/action.yml)
          if [ -z "$tr_" ] || [ "$tr_" != "$tc" ]; then
            echo "::error::typos version differs (rust-lint='$tr_' composite='$tc')"
            exit 1
          fi
          echo "ok: typos -> $tr_"

      # Positive: composite on a staged known-good workflow must pass. Covers
      # composite wiring (zizmor + actionlint) and acts as the control for the
      # negative case below, which uses the same staging mechanism.
      - name: Stage clean fixture
        run: cp testdata/fixtures/clean.yml .github/workflows/zz-clean-fixture.yml
      - name: Run composite on clean fixture (expected to pass)
        uses: ./actions/scan-github-actions
        with:
          paths: ".github actions"

      # Negative: swapping in a broken workflow must make the composite fail.
      - name: Swap clean fixture for broken fixture
        run: |
          rm -f .github/workflows/zz-clean-fixture.yml
          cp testdata/fixtures/broken.yml .github/workflows/zz-broken-fixture.yml
      - name: Run composite on broken fixture (expected to fail)
        id: scan
        continue-on-error: true
        uses: ./actions/scan-github-actions
        with:
          paths: ".github actions"
      - name: Assert the scan failed
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::composite should have failed on the broken fixture (outcome=$OUTCOME)"
            exit 1
          fi
          echo "composite correctly failed on the broken fixture"

      # The reusable scanner supplies a seven-day global policy even when the
      # caller has no local Pinact config. The workflow run's own commit is
      # always recent, keeping this check deterministic without an artificial
      # threshold that produces misleading century-old cutoff dates.
      - name: Stage recent pin without caller config
        id: recent-pin
        env:
          ACTION_NAME: ${{ github.repository }}/actions/scan-github-actions
          ACTION_REPOSITORY: ${{ github.repository }}
          ACTION_SHA: ${{ github.sha }}
          MIN_AGE: "7"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-broken-fixture.yml
          mv .pinact.yaml "$RUNNER_TEMP/caller-pinact.yaml"
          fixture=".github/workflows/zz-recent-pin.yml"
          policy="$RUNNER_TEMP/pinact-policy.yaml"
          commit_date=$(gh api "repos/$ACTION_REPOSITORY/commits/$ACTION_SHA" --jq .commit.committer.date)
          cutoff=$(date -u -d "$MIN_AGE days ago" +%s)
          if (( $(date -u -d "$commit_date" +%s) <= cutoff )); then
            echo "::error::test pin is not newer than the configured threshold"
            exit 1
          fi
          printf 'name: recent pin\non: push\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: %s@%s # v0.0.0\n' \
            "$ACTION_NAME" "$ACTION_SHA" > "$fixture"
          printf 'version: 3\nmin_age:\n  value: %s\n' "$MIN_AGE" > "$policy"
          echo "include=^${ACTION_NAME}$" >> "$GITHUB_OUTPUT"
          echo "policy=$policy" >> "$GITHUB_OUTPUT"
      - name: Install pinact
        uses: ./actions/setup-pinact
      - name: Check recent pin without minimum-age policy
        id: recent-pin-no-policy
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INCLUDE: ${{ steps.recent-pin.outputs.include }}
        run: pinact run -fix=false --verify-min-age -i "$INCLUDE"
      - name: Check recent pin with default minimum-age policy
        id: recent-pin-with-policy
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PINACT_GLOBAL_CONFIG: ${{ steps.recent-pin.outputs.policy }}
          INCLUDE: ${{ steps.recent-pin.outputs.include }}
        run: pinact run -fix=false --verify-min-age -i "$INCLUDE"
      - name: Assert default minimum-age policy
        env:
          WITHOUT_POLICY: ${{ steps.recent-pin-no-policy.outcome }}
          WITH_POLICY: ${{ steps.recent-pin-with-policy.outcome }}
        run: |
          set -euo pipefail
          mv "$RUNNER_TEMP/caller-pinact.yaml" .pinact.yaml
          rm .github/workflows/zz-recent-pin.yml
          if [[ "$WITHOUT_POLICY" != "success" ]]; then
            echo "::error::recent pin should pass without a minimum-age policy (outcome=$WITHOUT_POLICY)"
            exit 1
          fi
          if [[ "$WITH_POLICY" != "failure" ]]; then
            echo "::error::recent pin should fail with the default minimum-age policy (outcome=$WITH_POLICY)"
            exit 1
          fi
          echo "default minimum-age policy correctly rejected a recent pin"

      # Installers that verify upstream signatures or attestations must keep working end to end:
      # a rotated Argo key, a changed Foundry release layout, or a broken attestation lookup
      # should fail here, not in a consumer.
      - name: Smoke test setup-argo-cli (cosign key signature)
        uses: ./actions/setup-argo-cli
      - name: Smoke test setup-foundry stable (SLSA attestation)
        id: foundry-stable
        uses: ./actions/setup-foundry
        with:
          cache: "false"
      - name: Smoke test setup-foundry nightly (SLSA attestation, nightly-<commit> resolution)
        id: foundry-nightly
        uses: ./actions/setup-foundry
        with:
          version: nightly
          cache: "false"
      - name: Smoke test setup-terraform (HashiCorp GPG signature)
        uses: ./actions/setup-terraform
      - name: Smoke test setup-helm default (maintainer GPG signature)
        uses: ./actions/setup-helm
      - name: Smoke test setup-helm v4.1.1 (a release signed by a different maintainer key)
        uses: ./actions/setup-helm
        with:
          version: v4.1.1
      - name: Smoke test setup-mold (digest-pinned install)
        uses: ./actions/setup-mold
        with:
          make-default: "false"
      # Scoped to the new first-party actions: older files in actions/ contain test fixtures and
      # identifiers that typos flags, and adopting typos repo-wide is a separate decision.
      - name: Smoke test actionlint (digest-pinned image) on this repository's workflows
        uses: ./actions/actionlint
      - name: Smoke test typos (release attestation) on the first-party action sources
        uses: ./actions/typos
        with:
          files: actions/check-needs actions/pr-comment actions/typos actions/gh-release actions/changed-paths actions/cargo-cooldown actions/cargo-install actions/slack-notify actions/setup-mold
      - name: Create cargo-cooldown fixture
        env:
          FIXTURE: ${{ runner.temp }}/cargo-cooldown-fixture
        run: |
          set -euo pipefail
          mkdir -p "$FIXTURE/src"
          printf '[package]\nname = "cooldown-fixture"\nversion = "0.1.0"\nedition = "2024"\n\n[dependencies]\nitoa = "=1.0.10"\n' > "$FIXTURE/Cargo.toml"
          printf 'fn main() { let mut buffer = itoa::Buffer::new(); println!("{}", buffer.format(42)); }\n' > "$FIXTURE/src/main.rs"
          printf '[[allow.exact]]\ncrate = "example"\nversion = "1.2.3"\n' > "$FIXTURE/cooldown.toml"
          cargo generate-lockfile --manifest-path "$FIXTURE/Cargo.toml"
          git -C "$FIXTURE" init
          git -C "$FIXTURE" add Cargo.lock Cargo.toml cooldown.toml src/main.rs
          git -C "$FIXTURE" -c user.name=cargo-cooldown-test -c user.email=cargo-cooldown-test@example.invalid commit -m fixture
      - name: Smoke test cargo-cooldown
        id: cargo-cooldown
        env:
          CARGO_REGISTRIES_CRATES_IO_MIN_PUBLISH_AGE: invalid
          CARGO_REGISTRY_MIN_PUBLISH_AGE: invalid
          COOLDOWN_NOW: invalid
          COOLDOWN_SKIP_REGISTRIES: "["
        uses: ./actions/cargo-cooldown
        with:
          cooldown-days: 7
          working-directory: ${{ runner.temp }}/cargo-cooldown-fixture
      - name: Assert cargo-cooldown verifier outputs
        env:
          VERIFIER_PATH: ${{ steps.cargo-cooldown.outputs.verifier-path }}
          VERIFIER_SHA256: ${{ steps.cargo-cooldown.outputs.verifier-sha256 }}
        run: |
          set -euo pipefail
          test -x "$VERIFIER_PATH"
          echo "$VERIFIER_SHA256  $VERIFIER_PATH" | sha256sum --check --strict
      - name: Assert cargo-cooldown did not modify caller files
        env:
          FIXTURE: ${{ runner.temp }}/cargo-cooldown-fixture
        run: |
          git -C "$FIXTURE" diff --exit-code HEAD -- Cargo.lock Cargo.toml cooldown.toml src/main.rs
      - name: Create untrusted user cargo-cooldown policy
        env:
          USER_CARGO_HOME: ${{ runner.temp }}/cargo-cooldown-user-home
        run: |
          mkdir -p "$USER_CARGO_HOME"
          printf '[registry]\nglobal-min-publish-age = "0"\n' > "$USER_CARGO_HOME/cooldown.toml"
      - name: Reject untrusted user cargo-cooldown policy
        id: cargo-cooldown-user-policy
        continue-on-error: true
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-cooldown-user-home
        uses: ./actions/cargo-cooldown
        with:
          working-directory: ${{ runner.temp }}/cargo-cooldown-fixture
      - name: Assert untrusted user policy was rejected
        if: always()
        env:
          OUTCOME: ${{ steps.cargo-cooldown-user-policy.outcome }}
        run: test "$OUTCOME" = failure
      - name: Smoke test cargo-cooldown check mode
        uses: ./actions/cargo-cooldown
        with:
          cooldown-days: 7
          mode: check
          working-directory: ${{ runner.temp }}/cargo-cooldown-fixture
      - name: Create cargo-cooldown non-default member fixture
        env:
          FIXTURE: ${{ runner.temp }}/cargo-cooldown-nondefault-fixture
        run: |
          set -euo pipefail
          mkdir -p "$FIXTURE/safe/src" "$FIXTURE/nondefault/src"
          printf '[workspace]\nmembers = ["safe", "nondefault"]\ndefault-members = ["safe"]\nresolver = "3"\n' > "$FIXTURE/Cargo.toml"
          printf '[package]\nname = "safe"\nversion = "0.1.0"\nedition = "2024"\n' > "$FIXTURE/safe/Cargo.toml"
          printf 'pub fn safe() {}\n' > "$FIXTURE/safe/src/lib.rs"
          printf '[package]\nname = "nondefault"\nversion = "0.1.0"\nedition = "2024"\n\n[dependencies]\nserde_json = "=1.0.100"\n' > "$FIXTURE/nondefault/Cargo.toml"
          printf 'pub fn value() -> serde_json::Value { serde_json::json!({"ok": true}) }\n' > "$FIXTURE/nondefault/src/lib.rs"
          printf '[[allow.exact]]\ncrate = "serde_json"\nversion = "1.0.100"\n' > "$FIXTURE/cooldown.toml"
          cargo generate-lockfile --manifest-path "$FIXTURE/Cargo.toml"
          git -C "$FIXTURE" init
          git -C "$FIXTURE" add Cargo.lock Cargo.toml cooldown.toml safe nondefault
          git -C "$FIXTURE" -c user.name=cargo-cooldown-test -c user.email=cargo-cooldown-test@example.invalid commit -m fixture
      - name: Reject a fresh dependency in a non-default member
        id: cargo-cooldown-nondefault
        continue-on-error: true
        uses: ./actions/cargo-cooldown
        with:
          cooldown-days: 36500
          working-directory: ${{ runner.temp }}/cargo-cooldown-nondefault-fixture
      - name: Assert non-default member dependency was rejected
        if: always()
        env:
          OUTCOME: ${{ steps.cargo-cooldown-nondefault.outcome }}
        run: test "$OUTCOME" = failure
      - name: Create cargo-cooldown downgrade fixture
        env:
          FIXTURE: ${{ runner.temp }}/cargo-cooldown-downgrade-fixture
        run: |
          set -euo pipefail
          mkdir -p "$FIXTURE/src"
          printf '[package]\nname = "cooldown-downgrade-fixture"\nversion = "0.1.0"\nedition = "2024"\n\n[dependencies]\nitoa = "1"\n' > "$FIXTURE/Cargo.toml"
          printf 'fn main() { let mut buffer = itoa::Buffer::new(); println!("{}", buffer.format(42)); }\n' > "$FIXTURE/src/main.rs"
          printf 'now = "2024-01-01T00:00:00Z"\n' > "$FIXTURE/cooldown.toml"
          cargo generate-lockfile --manifest-path "$FIXTURE/Cargo.toml"
          git -C "$FIXTURE" init
          git -C "$FIXTURE" add Cargo.lock Cargo.toml cooldown.toml src/main.rs
          git -C "$FIXTURE" -c user.name=cargo-cooldown-test -c user.email=cargo-cooldown-test@example.invalid commit -m fixture
          sha256sum "$FIXTURE/Cargo.lock" | cut -d ' ' -f 1 > "$FIXTURE/Cargo.lock.sha256"
      - name: Reject and restore a safe dependency downgrade
        id: cargo-cooldown-downgrade
        continue-on-error: true
        uses: ./actions/cargo-cooldown
        with:
          cooldown-days: 7
          working-directory: ${{ runner.temp }}/cargo-cooldown-downgrade-fixture
      - name: Assert failed downgrade left Cargo.lock unchanged
        if: always()
        env:
          FIXTURE: ${{ runner.temp }}/cargo-cooldown-downgrade-fixture
          OUTCOME: ${{ steps.cargo-cooldown-downgrade.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          test "$(cat "$FIXTURE/Cargo.lock.sha256")" = "$(sha256sum "$FIXTURE/Cargo.lock" | cut -d ' ' -f 1)"
          git -C "$FIXTURE" diff --exit-code HEAD -- Cargo.lock
      - name: Smoke test cargo-install (cached binary)
        uses: ./actions/cargo-install
        with:
          tool: cargo-hack
      - name: Smoke test changed-paths (compare API)
        id: changed
        uses: ./actions/changed-paths
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            actions:
              - 'actions/**'
              - '!actions/**/*.md'
      - name: "Smoke test check-needs (fixture: passes with an allowed skip)"
        uses: ./actions/check-needs
        with:
          jobs: '{"build":{"result":"success"},"lint":{"result":"skipped"}}'
          allowed-skips: lint
      - name: "Smoke test check-needs (fixture: must fail on a failure)"
        id: check-needs-fail
        continue-on-error: true
        uses: ./actions/check-needs
        with:
          jobs: '{"build":{"result":"failure"}}'
      - name: Assert composite smoke results
        env:
          CHANGES: ${{ steps.changed.outputs.changes }}
          NEEDS_FAIL: ${{ steps.check-needs-fail.outcome }}
        run: |
          set -euo pipefail
          echo "$CHANGES" | jq -e 'type == "array"' >/dev/null || { echo "::error::changed-paths did not emit a JSON array of changes: '$CHANGES'"; exit 1; }
          [ "$NEEDS_FAIL" = "failure" ] || { echo "::error::check-needs should fail on a failed job (outcome=$NEEDS_FAIL)"; exit 1; }
          cargo hack --version
          echo "composite smoke tests ok (changes=$CHANGES)"
      - name: Report resolved Foundry tags
        env:
          STABLE: ${{ steps.foundry-stable.outputs.tag }}
          NIGHTLY: ${{ steps.foundry-nightly.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$STABLE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::stable resolved to '$STABLE'"; exit 1; }
          [[ "$NIGHTLY" =~ ^nightly-[0-9a-f]{40}$ ]] || { echo "::error::nightly resolved to '$NIGHTLY'"; exit 1; }
          echo "stable=$STABLE nightly=$NIGHTLY"
