# Third-party GitHub Actions vendored into vendor/<owner>/<repo>/ so workflows can keep using
# them under an org policy that only allows tempoxyz-owned and GitHub-authored actions.
#
#   node vendor/add.mjs <owner/repo>@<tag|sha> [--label v1.2.3] [--path <sub>] [--with-deps]
#   node vendor/sync.mjs            rebuild every tree from this file and refresh the README table
#   node vendor/sync.mjs --check    CI: fail if vendor/ or the README table drifted from this file

# Per action: `ref` is the upstream tag or branch for humans, `sha` is the commit that is vendored,
# `exclude` lists paths shown to be unused at run time (the reasoning is in `notes`), `keep` wins
# over any exclude, and `pin_nested` records commits for nested GitHub-authored `uses:` lines that
# upstream pins by tag (the org policy requires full SHAs). Trees under vendor/ are generated:
# edit this file and re-run the sync instead of editing them.
org: tempoxyz/gh-actions
vendor_dir: vendor
# Nested `uses:` lines pointing at these owners are left in place; the org policy allows them.
# Every other nested third-party reference is rewritten to $/vendor/<owner>/<repo>, which
# resolves to this repository at the commit the caller pinned (runner 2.336.0 or newer).
allowed_upstreams:
  - actions/
  - github/
# Removed from every vendored tree. Nothing listed here is read by a running action: repository
# docs and images, upstream CI, editor and VCS metadata. action.yml, package.json, LICENSE and
# .github/*.json files (problem matchers, release manifests) are always kept. Source maps are consulted only to pretty-print a stack trace after a
# failure, so dropping them changes error output, not behaviour. Patterns are anchored at the
# vendored tree root; use **/ for any depth.
default_exclude:
  # Dependency lockfiles describe how upstream built the action; the prebuilt bundles under dist/
  # never read them, and they only feed false positives into dependency scanners.
  - "**/package-lock.json"
  - "**/pnpm-lock.yaml"
  - "**/yarn.lock"
  - "**/bun.lock"
  - "**/bun.lockb"
  - .github/
  - docs/
  - doc/
  - "**/*.md"
  - "**/*.markdown"
  - "**/*.rst"
  - "**/*.map"
  - "*.png"
  - "*.jpg"
  - "*.jpeg"
  - "*.gif"
  - "*.svg"
  - "*.ico"
  - "*.webp"
  - "**/.gitignore"
  - "**/.gitattributes"
  - "**/.npmignore"
  - .gitmodules
  - .editorconfig
  - .mailmap
  - .git-blame-ignore-revs
  - CODEOWNERS
  - .husky/
  - .vscode/
  - .devcontainer/
  - .idea/
  - .changeset/
  - renovate.json
  - renovate.json5
  - .renovaterc*
  - .pre-commit-config.yaml
  - .markdownlint*
  - .yamllint*
